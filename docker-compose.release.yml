# docker-compose.release.yml — run PUBLISHED images instead of building them.
#
# Usage (add it to the stack, after the production overlay):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.release.yml -f deploy/compose.site.yml up -d
# or, as scripts/install.sh does, set in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml:docker-compose.release.yml:deploy/compose.site.yml
#   REVIEW_IMAGE_PREFIX=ghcr.io/yvigunderscore
#   REVIEW_IMAGE_TAG=v2.3.0
#
# Without this file the stack builds everything on the studio's server (a 3.6 GB worker image
# compiled on a NAS, with a result that depends on the build date). With it, an update is an
# image pull pinned to a version tag, and `scripts/update.sh --version vX.Y.Z` can roll back.
#
# The three images are published by .github/workflows/release.yml.
#
# ⚠ `REVIEW_IMAGE_TAG` is REQUIRED (`:?`): no implicit `latest` in production. An instance
#   must be able to tell which version it runs, which AGPL §13 also assumes in order to offer
#   the *corresponding* source.
services:
  backend:
    image: ${REVIEW_IMAGE_PREFIX:?REVIEW_IMAGE_PREFIX is required (e.g. ghcr.io/yvigunderscore)}/review-backend:${REVIEW_IMAGE_TAG:?REVIEW_IMAGE_TAG is required (e.g. v2.3.0)}

  worker:
    # Separate image from the backend: only this one ships Blender + usd-core (1.6 -> 3.6 GB).
    image: ${REVIEW_IMAGE_PREFIX:?REVIEW_IMAGE_PREFIX is required}/review-worker:${REVIEW_IMAGE_TAG:?REVIEW_IMAGE_TAG is required}

  frontend:
    image: ${REVIEW_IMAGE_PREFIX:?REVIEW_IMAGE_PREFIX is required}/review-frontend:${REVIEW_IMAGE_TAG:?REVIEW_IMAGE_TAG is required}
