server {
    listen 80;
    client_max_body_size 1G;

    # Licence du projet et notices des dépendances : lisibles en clair plutôt que
    # téléchargées (l'AGPL §13 et les licences MIT/BSD du bundle veulent qu'elles suivent
    # l'application, pas seulement le dépôt).
    location ~ ^/(LICENSE|THIRD-PARTY-NOTICES\.md)$ {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        # 'backend' is the service name in docker-compose
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO requests
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
