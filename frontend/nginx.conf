# Compression. L'image officielle nginx livre `gzip on;` COMMENTÉ et des `gzip_types`
# réduits à text/html : le bundle partait donc en clair, environ trois fois le poids que
# scripts/check-bundle-budget.mjs mesure et plafonne (430 ko **gzip**).
gzip on;
gzip_vary on;              # Vary: Accept-Encoding — indispensable derrière un cache
gzip_comp_level 5;         # au-delà, le CPU coûte plus que les octets gagnés
gzip_min_length 1024;      # sous 1 ko, l'en-tête gzip coûte plus que la compression
gzip_proxied any;          # le défaut (`off`) ne compresse AUCUNE réponse proxifiée
gzip_types
    text/plain
    text/css
    text/javascript
    text/markdown
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/wasm
    application/vnd.apple.mpegurl
    image/svg+xml
    font/ttf
    font/otf;
# text/html est toujours compressé par nginx : ne pas le lister (il le serait deux fois).
# woff2 et les images matricielles sont déjà compressés : les gzipper coûte du CPU pour rien.
# `application/vnd.apple.mpegurl` est le type des playlists HLS servies par /api/ : du texte
# très répétitif, devenu volumineux depuis que chaque segment y porte une URL présignée.
# Les segments eux-mêmes (.ts) ne passent plus par ce conteneur — ils vont droit à MinIO.

# `Connection` ne doit valoir « upgrade » que lorsque le client en demande une. Posé en dur
# sur un bloc, il annonce une bascule de protocole à chaque requête ordinaire — et fait
# fermer la connexion amont au lieu de la réutiliser. Cette table donne la forme correcte :
# « upgrade » quand `Upgrade:` est présent, « close » sinon.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Borne par défaut du serveur, héritée par les blocs qui n'en posent pas. Aucun fichier
    # ne transite par ce conteneur : les dépôts partent en PUT présigné vers MinIO, jamais
    # par ici. Un corps volumineux est donc écrit pour rien dans le fichier temporaire de
    # nginx (la couche inscriptible du conteneur) avant même que le backend le voie.
    client_max_body_size 2m;

    # Résolution DNS à chaque requête, via le resolver interne de Docker.
    #
    # Sans cela, nginx résout « backend » une seule fois au démarrage et garde l'adresse :
    # tout redémarrage du backend lui donne une nouvelle IP et le site répond 502 jusqu'à
    # ce qu'on pense à redémarrer aussi le frontend. Le passage par une variable force la
    # résolution à chaque requête, ce qui rend le redémarrage du backend transparent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $review_backend http://backend:3000;

    # Licence du projet et notices des dépendances : lisibles en clair plutôt que
    # téléchargées (l'AGPL §13 et les licences MIT/BSD du bundle veulent qu'elles suivent
    # l'application, pas seulement le dépôt).
    location ~ ^/(LICENSE|THIRD-PARTY-NOTICES\.md)$ {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    # Assets construits par Vite : les noms portent le hash du contenu
    # (`index-a1b2c3d4.js`), donc un fichier donné ne change JAMAIS. On peut les figer un
    # an — `immutable` évite même la requête de revalidation. Une nouvelle version produit
    # de nouveaux noms, référencés par un index.html qui, lui, n'est pas caché.
    #
    # ATTENTION — ce bloc filtre sur l'EXTENSION, pas sur le préfixe. Écrit en
    # `location ^~ /assets/`, il capturait TOUT ce qui commence par `/assets/` et le
    # terminait en `=404` : or l'application déclare aussi la route `/assets/:id`
    # (fiche d'asset, `App.tsx`). Un lien `/assets/58` ouvert dans un nouvel onglet, mis en
    # favori, partagé, ou simplement rechargé par F5 renvoyait donc 404 — alors que le même
    # lien suivi depuis l'application (React Router, sans aller-retour serveur) marchait.
    # Le préfixe `/assets/` appartient aux deux espaces de noms ; seule l'extension les sépare.
    location ~ ^/assets/.+\.(js|mjs|css|map|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|wasm)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html : jamais caché. C'est lui qui pointe vers les assets hachés ; le figer
    # servirait indéfiniment l'ancienne version après un déploiement. `no-cache` autorise
    # la mise en cache mais impose la revalidation (304 si rien n'a bougé).
    # La redirection interne de `try_files … /index.html` ci-dessous repasse par ici.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Repli SPA.
    #
    # `$uri/` est volontairement ABSENT du try_files. Il y était, et il masquait toutes les
    # routes de l'application qui portent le nom d'un répertoire réellement présent dans
    # `dist/` — au premier chef `/docs`, que le prebuild `scripts/build-docs.mjs` matérialise
    # en copiant `DOCUMENTATION/` dans `public/docs`. nginx trouvait le répertoire, émettait
    # sa redirection d'index — **absolue, reconstruite sur le port interne 80**, donc
    # `http://localhost:3429/docs` devenait `http://localhost/docs/` — puis refusait
    # l'autoindex en 403. Saisir l'URL, la partager ou faire F5 sur une page de doc était mort,
    # alors que le clic depuis la barre latérale (navigation React Router) fonctionnait.
    #
    # Sans `$uri/`, un répertoire n'est plus un candidat : la route retombe sur `/index.html`
    # et l'application la traite. Les fichiers réels de ces répertoires (`/docs/assets/x.svg`,
    # `/docs/manifest.json`) restent servis par `$uri`, qui passe en premier.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Ceinture et bretelles : si une redirection devait malgré tout être émise, qu'elle
        # reste relative plutôt que de reconstruire un absolu sur le port d'écoute interne.
        absolute_redirect off;
        port_in_redirect off;
        try_files $uri /index.html;
    }

    # API backend (« backend » = nom du service docker-compose).
    #
    # Ce conteneur est la porte d'entrée réelle de la pile docker seule : ce qui manque ici
    # ne manque nulle part ailleurs. Les délais d'attente sont donc alignés sur ceux du
    # frontal TLS de production (nginx/nginx.conf) — sans eux, le défaut nginx de 60 s
    # coupait la réponse en 504 pendant que Node continuait son travail jusqu'au bout : la
    # requête était payée en entier, puis jetée, et l'utilisateur rechargeait par-dessus.
    location /api/ {
        # Plafond applicatif le plus haut : 8 Mo (JSON d'édition splat, backend/src/app.ts).
        # Au-delà, nginx refuse en 413 sans écrire le corps sur son disque.
        client_max_body_size 8m;
        proxy_pass $review_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Le backend en déduit le schéma d'origine (liens absolus, cookies) ; le frontal de
        # production le pose déjà, les deux configurations doivent dire la même chose.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO : c'est ici, et seulement ici, qu'une bascule de protocole est négociée.
    location /socket.io/ {
        proxy_pass $review_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
