# Compression. The official nginx image ships `gzip on;` COMMENTED OUT and `gzip_types`
# limited to text/html: without this block the bundle would go out uncompressed, about
# three times the gzip size that scripts/check-bundle-budget.mjs measures and caps.
gzip on;
gzip_vary on;              # Vary: Accept-Encoding — required behind any cache
gzip_comp_level 5;         # higher levels cost more CPU than they save in bytes
gzip_min_length 1024;      # below 1 KB the gzip overhead outweighs the gain
gzip_proxied any;          # the default (`off`) compresses NO proxied response
gzip_types
    text/plain
    text/css
    text/javascript
    text/markdown
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/wasm
    application/vnd.apple.mpegurl
    image/svg+xml
    font/ttf
    font/otf;
# text/html is always compressed by nginx: do not list it (it would be listed twice).
# woff2 and raster images are already compressed: gzipping them burns CPU for nothing.
# `application/vnd.apple.mpegurl` is the type of the HLS playlists served by /api/: highly
# repetitive text, and large since every segment is a presigned URL.
# The segments themselves (.ts) never go through this container — they go straight to MinIO.

# `Connection` must be "upgrade" only when the client asks for one. Hard-coded, it
# announces a protocol switch on every ordinary request and makes nginx close the upstream
# connection instead of reusing it. This map gives the correct form: "upgrade" when an
# `Upgrade:` header is present, "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Default body limit, inherited by every location that does not set one. No file goes
    # through this container (uploads are presigned PUTs straight to MinIO), and nginx
    # writes a request body to a temporary file in the container's writable layer before
    # the backend even sees it.
    client_max_body_size 2m;

    # Resolve DNS on every request through Docker's internal resolver.
    #
    # Otherwise nginx resolves "backend" once at startup and keeps that address: every
    # backend restart gets a new IP and the site answers 502 until the frontend is restarted
    # too. Going through a variable forces resolution per request, so backend restarts are
    # transparent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $review_backend http://backend:3000;

    # Project licence and dependency notices, readable as plain text rather than downloaded
    # (AGPL §13 and the MIT/BSD licences of the bundle require them to ship with the running
    # application, not only with the repository).
    location ~ ^/(LICENSE|THIRD-PARTY-NOTICES\.md)$ {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
    }

    # Vite build assets: names carry the content hash (`index-a1b2c3d4.js`), so a given file
    # NEVER changes. They can be cached for a year — `immutable` even skips the revalidation
    # request. A new release produces new names, referenced by an index.html that is not
    # cached.
    #
    # ⚠ This block matches on the file EXTENSION, not the prefix. The application also
    # declares the route `/assets/:id` (asset page, frontend/src/v2/App.tsx). As
    # `location ^~ /assets/`, a deep link to `/assets/58` (new tab, bookmark, share, F5)
    # would end in `=404`, while the same link followed inside the app (React Router, no
    # server round trip) works. Only the extension separates the two namespaces.
    location ~ ^/assets/.+\.(js|mjs|css|map|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|wasm)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html: never cached. It references the hashed assets; caching it would keep
    # serving the old release after a deploy. `no-cache` allows caching but forces
    # revalidation (304 when unchanged).
    # The internal redirect from `try_files … /index.html` below goes through here.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback.
    #
    # ⚠ `$uri/` is deliberately ABSENT from try_files. With it, any app route whose name
    # matches a real directory in `dist/` breaks — first of all `/docs`, which the prebuild
    # (frontend/scripts/build-docs.mjs) materialises by copying DOCUMENTATION/ into
    # `public/docs`. nginx would find the directory, issue its index redirect — ABSOLUTE and
    # rebuilt on internal port 80, so `http://localhost:3429/docs` became
    # `http://localhost/docs/` — then refuse autoindex with 403. Typing, sharing or
    # reloading a docs URL failed, while sidebar navigation (React Router) worked.
    #
    # Without `$uri/`, a directory is not a candidate: the route falls back to `/index.html`
    # and the app handles it. Real files inside those directories (`/docs/assets/x.svg`,
    # `/docs/manifest.json`) are still served by `$uri`, which is tried first.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Belt and braces: should a redirect still be issued, keep it relative instead of
        # rebuilding an absolute URL on the internal listen port.
        absolute_redirect off;
        port_in_redirect off;
        try_files $uri /index.html;
    }

    # Backend API ("backend" = docker-compose service name).
    #
    # This container is the actual entry point of the docker-only stack (no TLS proxy in
    # front), so timeouts match the production TLS proxy (nginx/nginx.conf). With nginx's
    # 60 s default, a long request was cut with a 504 while Node kept working to the end:
    # the work was paid for in full, then thrown away, and the user retried on top of it.
    location /api/ {
        # Highest application limit: 8 MB (splat edit JSON, backend/src/app.ts).
        # Above that nginx answers 413 without writing the body to disk.
        client_max_body_size 8m;
        proxy_pass $review_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend derives the original scheme from it (absolute links, cookies); the
        # production proxy sets it too — both configurations must say the same thing.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO: the only place where a protocol upgrade is negotiated.
    location /socket.io/ {
        proxy_pass $review_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
