# Publish a release: check the CHANGELOG, run the validation suite, build and push
# the three images, then create the GitHub release.
#
# Trigger: a `vX.Y.Z` tag pushed to the repository.
#
#   git tag -a v2.3.0 -m "ReView 2.3.0" && git push origin v2.3.0
#
# Nothing is published unless `scripts/validate.sh` passes: the repository's core rule
# applies even more to what leaves for third-party studios. The `guard` job also refuses
# a tag missing from CHANGELOG.md, since a version without release notes cannot be
# installed by someone who does not know us.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  # Dry run: builds everything, pushes nothing.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Étiquette à répéter à blanc (aucune publication)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RUFF_VERSION: '0.16.9'
  REGISTRY: ghcr.io

jobs:
  # Check that the tag is publishable: SemVer version and release notes present.
  guard:
    name: Étiquette et CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      owner: ${{ steps.resolve.outputs.owner }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Résoudre la version
        id: resolve
        env:
          # Never interpolate `${{ inputs.* }}` into the script: it is attacker-controlled text
          # (script injection). It travels as an environment variable and is validated below.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF#refs/tags/}"
            publish=true
          else
            version="${INPUT_REF:-v0.0.0-dry-run}"
            publish=false
          fi
          # SemVer tag only (same shape as the `on.push.tags` filter): refuses anything else
          # before it reaches an output, a grep pattern or an image tag.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::Version invalide : doit ressembler à vX.Y.Z ou vX.Y.Z-rc.1." >&2
            exit 1
          fi
          # A pre-release (vX.Y.Z-…) never moves `:latest`.
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          # Owner name in lowercase: OCI image references reject uppercase letters in the
          # path. `ghcr.io/YvigUnderscore/review-backend` is invalid, which is exactly what
          # `github.repository_owner` produced. The registry mode, the only one from which an
          # instance updates without compiling and where the admin UI offers a button, had
          # therefore never been able to publish a single image.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version : $version (publication : $publish, propriétaire : ${GITHUB_REPOSITORY_OWNER,,})"

      - name: Exiger une entrée de CHANGELOG
        if: steps.resolve.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          version="$VERSION"
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de section « ## $version — … »." >&2
            exit 1
          fi

  # Run the repository validation suite as-is. No image is pushed before it passes.
  validate:
    name: validate.sh
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://validate:validate@localhost:5432/validate
      JWT_SECRET: ci-placeholder-secret-not-used-outside-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder-secret
      S3_BUCKET: review
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # ruff is mandatory in validate.sh (no silent skip).
      - name: Installer ruff
        run: pip install "ruff==${{ env.RUFF_VERSION }}"

      - name: Dépendances backend (npm ci)
        run: npm ci
        working-directory: backend

      - name: Dépendances frontend (npm ci)
        run: npm ci
        working-directory: frontend

      - name: Suite de validation
        run: bash scripts/validate.sh

  # Three images: API, worker (Blender + USD), frontend (bundles DOCUMENTATION/).
  #
  # linux/amd64 only: the real target is an x86 server or NAS, and the worker image embeds
  # Blender. An emulated arm64 build would take hours for a use nobody asked for. Reopen
  # this the day a studio runs on ARM.
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [guard, validate]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: review-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            usd: '0'
          - image: review-worker
            context: ./backend
            dockerfile: ./backend/Dockerfile
            usd: '1'
          - image: review-frontend
            context: .
            dockerfile: ./frontend/Dockerfile
            usd: '0'
          # Operations agent: ~40 MB, no product dependency. It holds the docker socket at
          # the studio, so it is built separately and stays auditable at a glance
          # (ops/Dockerfile, ops/agent.sh).
          - image: review-ops
            context: ./ops
            dockerfile: ./ops/Dockerfile
            usd: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Authentification au registre
        if: needs.guard.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ needs.guard.outputs.publish == 'true' }}
          # `INSTALL_USD_TOOLS` distinguishes the worker image from the API image; the other
          # three arguments let the instance identify itself (/api/version, "About" screen).
          build-args: |
            INSTALL_USD_TOOLS=${{ matrix.usd }}
            APP_VERSION=${{ needs.guard.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.guard.outputs.owner }}/${{ matrix.image }}:${{ needs.guard.outputs.version }}
            ${{ needs.guard.outputs.prerelease == 'false' && format('{0}/{1}/{2}:latest', env.REGISTRY, needs.guard.outputs.owner, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # GitHub release; body = the CHANGELOG.md section for this version.
  # `gh` rather than a third-party action: a publishing chain should not depend on an action
  # repository nobody reviews.
  publish:
    name: Release GitHub
    runs-on: ubuntu-latest
    needs: [guard, images]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Extraire les notes de version
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ needs.guard.outputs.owner }}
        run: |
          version="$VERSION"
          awk -v v="## $version " '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "### Images"
            echo ""
            echo '```'
            echo "REVIEW_IMAGE_PREFIX=$IMAGE_PREFIX"
            echo "REVIEW_IMAGE_TAG=$version"
            echo '```'
            echo ""
            echo "Installation : \`bash scripts/install.sh\` — mise à jour : \`bash scripts/update.sh --version $version\`."
            echo "Source (AGPL-3.0-or-later) : https://github.com/${{ github.repository }}"
          } >> release-notes.md
          cat release-notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          flags=()
          # A pre-release is flagged as such and never becomes GitHub's "latest release".
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" \
            --title "ReView $VERSION" \
            --notes-file release-notes.md "${flags[@]}"
