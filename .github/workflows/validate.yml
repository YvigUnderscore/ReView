# Intégration continue : rejoue `scripts/validate.sh`, la suite de validation du dépôt.
#
# Principe protégé (CLAUDE.md) : la suite ne se contourne pas et ne s'allège pas. Ce
# workflow ne fait que l'exécuter telle quelle — pas de sous-ensemble de contrôles, pas de
# `--max-warnings` relevé, pas de `|| true` sur la commande. Toute évolution doit étendre la
# suite, jamais la réduire.
#
# Node 22 : version des images d'exécution (backend/Dockerfile `node:22-slim`,
# frontend/Dockerfile `node:22-alpine`).
name: Validation

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# Lecture seule : le workflow ne publie rien et n'a besoin d'aucun droit d'écriture.
permissions:
  contents: read

# Un seul run par référence : une nouvelle poussée annule le run précédent.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Suite complète sans services : SPDX, notices tierces, i18n, tokens de couleur,
  # budgets, lint/format/typecheck/build/tests unitaires des deux paquets.
  # ---------------------------------------------------------------------------
  validate:
    name: validate.sh (unitaire)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # `backend/src/config/env.ts` valide l'environnement au chargement et arrête le process
    # s'il manque une variable : sans `backend/.env` en CI, tout test unitaire qui importe la
    # configuration mourrait avant de s'exécuter. Valeurs factices — aucun service n'est
    # joignable dans ce job, et rien ici n'est un secret.
    env:
      DATABASE_URL: postgresql://validate:validate@localhost:5432/validate
      JWT_SECRET: ci-placeholder-secret-not-used-outside-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder-secret
      S3_BUCKET: review
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # `npm ci` (et non `npm install`) : l'installation suit le lockfile à la lettre, ce
      # dont dépend le contrôle de fraîcheur de THIRD-PARTY-NOTICES.md.
      - name: Dépendances backend (npm ci)
        run: npm ci
        working-directory: backend

      - name: Dépendances frontend (npm ci)
        run: npm ci
        working-directory: frontend

      - name: Suite de validation
        run: bash scripts/validate.sh

  # ---------------------------------------------------------------------------
  # Même suite, plus les tests d'intégration (Postgres + Redis + MinIO réels).
  #
  # BLOQUANT. Il ne l'était pas : le test d'upload résumable recevait un 429 du limiteur de
  # débit, saturé par la suite elle-même — plus de deux cents appels sur la même app depuis
  # la même adresse. `createApp({ rateLimit: false })` a réglé la cause, la suite est verte,
  # et `continue-on-error` est retiré. Ne pas le remettre : un job qui ne bloque jamais
  # finit par ne plus être lu, ce qui est exactement ce qui s'était produit.
  # ---------------------------------------------------------------------------
  integration:
    name: validate.sh --with-integration (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_ci
          POSTGRES_DB: review_itest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # MinIO n'est pas ici : un conteneur de service GitHub Actions ne reçoit ni commande ni
      # arguments, or l'image MinIO exige `server /data` pour démarrer autre chose que son
      # aide en ligne. Il est donc lancé en `docker run` ci-dessous, sur le même réseau hôte.

    env:
      DATABASE_URL: postgresql://review:review_ci@localhost:5432/review_itest?schema=public
      JWT_SECRET: ci-placeholder-secret-not-used-outside-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: review
      S3_FORCE_PATH_STYLE: 'true'
      REDIS_URL: redis://localhost:6379
      # Le contrôle de dérive schema.prisma ↔ migrations se saute quand aucune base n'est
      # joignable (poste sans docker). Ici il y en a une : il devient obligatoire, sinon
      # le seul endroit où il pourrait tourner serait aussi le seul à ne pas l'exiger.
      REVIEW_REQUIRE_DRIFT_CHECK: '1'

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Démarrer MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO prêt."
              exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas répondu en 60 s." >&2
          docker logs minio >&2 || true
          exit 1

      # Le bucket n'est créé qu'au démarrage du serveur (`server.ts` → `ensureBucket`) ; les
      # tests d'intégration montent l'app sans passer par là, donc on le crée ici.
      # `MC_HOST_<alias>` évite d'avoir à persister une configuration `mc` entre deux runs.
      - name: Créer le bucket de stockage
        run: |
          docker run --rm --network host \
            -e MC_HOST_ci=http://minioadmin:minioadmin@localhost:9000 \
            minio/mc mb --ignore-existing ci/review

      - name: Dépendances backend (npm ci)
        run: npm ci
        working-directory: backend

      - name: Dépendances frontend (npm ci)
        run: npm ci
        working-directory: frontend

      # Base éphémère du job : le schéma vient des migrations versionnées, jamais d'un
      # `db push`. Les tests d'intégration sont écrits pour une base vierge comme pour une
      # base déjà peuplée (cf. src/integration/api.itest.ts).
      - name: Appliquer les migrations Prisma
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Suite de validation + tests d'intégration
        run: bash scripts/validate.sh --with-integration
