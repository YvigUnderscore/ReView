# Continuous integration: replays `scripts/validate.sh`, the repository validation suite.
#
# Protected principle (CLAUDE.md): the suite must not be bypassed or weakened. This
# workflow runs it as-is: no subset of checks, no raised `--max-warnings`, no `|| true` on
# the command. Any change must extend the suite, never shrink it.
#
# Node 22: version of the runtime images (backend/Dockerfile `node:22-slim`,
# frontend/Dockerfile `node:22-alpine`).
name: Validation

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# Read-only: the workflow publishes nothing and needs no write permission.
permissions:
  contents: read

# One run per ref: a new push cancels the previous run.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  RUFF_VERSION: '0.16.9'

jobs:
  # Full suite without services: SPDX, third-party notices, i18n, color tokens, budgets,
  # lint/format/typecheck/build/unit tests for both packages.
  validate:
    name: validate.sh (unitaire)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # `backend/src/config/env.ts` validates the environment at load time and stops the
    # process if a variable is missing: without `backend/.env` in CI, any unit test importing
    # the configuration would die before running. Dummy values: no service is reachable in
    # this job, and nothing here is a secret.
    env:
      DATABASE_URL: postgresql://validate:validate@localhost:5432/validate
      JWT_SECRET: ci-placeholder-secret-not-used-outside-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder-secret
      S3_BUCKET: review
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # `npm ci` (not `npm install`) follows the lockfile exactly, which the freshness check
      # of THIRD-PARTY-NOTICES.md depends on.
      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `ruff` is mandatory in validate.sh (no silent skip when absent).
      - name: Installer ruff
        run: pip install "ruff==${{ env.RUFF_VERSION }}"

      - name: Dépendances backend (npm ci)
        run: npm ci
        working-directory: backend

      - name: Dépendances frontend (npm ci)
        run: npm ci
        working-directory: frontend

      - name: Suite de validation
        run: bash scripts/validate.sh

  # Same suite, plus integration tests (real Postgres + Redis + MinIO).
  #
  # BLOCKING. It was not before: the resumable upload test received a 429 from the rate
  # limiter, saturated by the suite itself: more than two hundred calls to the same app from
  # the same address. `createApp({ rateLimit: false })` fixed the cause, the suite is green,
  # and `continue-on-error` has been removed. Do not reinstate it: a job that never blocks
  # eventually stops being read, which is exactly what had happened.
  integration:
    name: validate.sh --with-integration (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_ci
          POSTGRES_DB: review_itest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d review_itest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # MinIO is not here: a GitHub Actions service container receives no command or
      # arguments, and the MinIO image requires `server /data` to start anything other than its
      # help output. It is therefore started with `docker run` below, on the same host network.

    env:
      DATABASE_URL: postgresql://review:review_ci@localhost:5432/review_itest?schema=public
      JWT_SECRET: ci-placeholder-secret-not-used-outside-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-user
      S3_SECRET_KEY: ci-minio-password-0123456789
      S3_BUCKET: review
      S3_FORCE_PATH_STYLE: 'true'
      REDIS_URL: redis://localhost:6379
      # The schema.prisma <-> migrations drift check is skipped when no database is reachable
      # (machine without docker). Here one is, so it becomes mandatory; otherwise the only place
      # it could run would also be the only place not requiring it.
      REVIEW_REQUIRE_DRIFT_CHECK: '1'

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Same image and version as docker-compose.yml (scripts/ci-workflow.test.mjs checks this):
      # `minio/minio` is no longer published, and `latest` broke this job the day the repository
      # disappeared from Docker Hub.
      - name: Démarrer MinIO
        env:
          MINIO_ROOT_USER: ${{ env.S3_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.S3_SECRET_KEY }}
        run: |
          # Variable NAMES only (values come from the step env): nothing secret on the command line.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER \
            -e MINIO_ROOT_PASSWORD \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO prêt."
              exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas répondu en 60 s." >&2
          docker logs minio >&2 || true
          exit 1

      # The bucket is only created at server startup (`server.ts` -> `ensureBucket`); integration
      # tests mount the app without going through there, so it is created here.
      # `MC_HOST_<alias>` avoids persisting an `mc` configuration between runs; the `mc` is the
      # one from the server image, as for the compose probe and backup.sh.
      - name: Créer le bucket de stockage
        env:
          MC_HOST_ci: http://${{ env.S3_ACCESS_KEY }}:${{ env.S3_SECRET_KEY }}@localhost:9000
        run: |
          docker exec -e MC_HOST_ci \
            minio mc mb --ignore-existing ci/review

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `ruff` is mandatory in validate.sh (no silent skip when absent).
      - name: Installer ruff
        run: pip install "ruff==${{ env.RUFF_VERSION }}"

      - name: Dépendances backend (npm ci)
        run: npm ci
        working-directory: backend

      - name: Dépendances frontend (npm ci)
        run: npm ci
        working-directory: frontend

      # Ephemeral job database: the schema comes from versioned migrations, never from a
      # `db push`. Integration tests are written for both a blank database and an already
      # populated one (cf. src/integration/api.itest.ts).
      - name: Appliquer les migrations Prisma
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Suite de validation + tests d'intégration
        run: bash scripts/validate.sh --with-integration

  # Python client (clients/python): zero runtime dependency, so only the linter is installed.
  # ruff is mandatory here too: no silent skip.
  python-client:
    name: Client Python (ruff + compileall + unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer le client et ruff
        run: pip install -e . "ruff==${{ env.RUFF_VERSION }}"

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntaxe (compileall)
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q review tests

      - name: Tests (unittest)
        run: python -m unittest discover -s tests -t . -v

  # E2E: the same suite through its `--with-e2e` path (integration + Playwright smoke, which
  # starts backend and frontend). Same services as `integration`.
  e2e:
    name: validate.sh --with-e2e (Playwright + Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_ci
          # The application's own database, as on a development machine. The integration suite
          # derives and resets `review_itest` itself (backend/src/integration/itestEnv.ts); pointing
          # the app at that database made the E2E run on what the integration tests left there — a
          # studio whose admin is `ci-admin@review.local` — so every Playwright sign-in was refused.
          POSTGRES_DB: review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d review"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # MinIO is not here: a GitHub Actions service container receives no command or
      # arguments, and the MinIO image requires `server /data` to start anything other than its
      # help output. It is therefore started with `docker run` below, on the same host network.

    env:
      DATABASE_URL: postgresql://review:review_ci@localhost:5432/review?schema=public
      JWT_SECRET: ci-placeholder-secret-not-used-outside-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-user
      S3_SECRET_KEY: ci-minio-password-0123456789
      S3_BUCKET: review
      S3_FORCE_PATH_STYLE: 'true'
      REDIS_URL: redis://localhost:6379
      # The schema.prisma <-> migrations drift check is skipped when no database is reachable
      # (machine without docker). Here one is, so it becomes mandatory; otherwise the only place
      # it could run would also be the only place not requiring it.
      REVIEW_REQUIRE_DRIFT_CHECK: '1'
      # Backend output of the Playwright run (playwright.config.ts), kept for the failure steps below.
      E2E_SERVER_LOG: ${{ github.workspace }}/frontend/e2e-logs/backend.log

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Same image and version as docker-compose.yml (scripts/ci-workflow.test.mjs checks this):
      # `minio/minio` is no longer published, and `latest` broke this job the day the repository
      # disappeared from Docker Hub.
      - name: Démarrer MinIO
        env:
          MINIO_ROOT_USER: ${{ env.S3_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.S3_SECRET_KEY }}
        run: |
          # Variable NAMES only (values come from the step env): nothing secret on the command line.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER \
            -e MINIO_ROOT_PASSWORD \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO prêt."
              exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas répondu en 60 s." >&2
          docker logs minio >&2 || true
          exit 1

      # The bucket is only created at server startup (`server.ts` -> `ensureBucket`); integration
      # tests mount the app without going through there, so it is created here.
      # `MC_HOST_<alias>` avoids persisting an `mc` configuration between runs; the `mc` is the
      # one from the server image, as for the compose probe and backup.sh.
      - name: Créer le bucket de stockage
        env:
          MC_HOST_ci: http://${{ env.S3_ACCESS_KEY }}:${{ env.S3_SECRET_KEY }}@localhost:9000
        run: |
          docker exec -e MC_HOST_ci \
            minio mc mb --ignore-existing ci/review

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `ruff` is mandatory in validate.sh (no silent skip when absent).
      - name: Installer ruff
        run: pip install "ruff==${{ env.RUFF_VERSION }}"

      - name: Dépendances backend (npm ci)
        run: npm ci
        working-directory: backend

      - name: Dépendances frontend (npm ci)
        run: npm ci
        working-directory: frontend

      # Ephemeral job database: the schema comes from versioned migrations, never from a
      # `db push`. Integration tests are written for both a blank database and an already
      # populated one (cf. src/integration/api.itest.ts).
      # Browser for the Playwright smoke (frontend/e2e); system libraries included.
      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Appliquer les migrations Prisma
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Suite de validation + E2E Playwright
        run: bash scripts/validate.sh --with-e2e

      - name: Journal du backend (E2E)
        if: failure()
        run: tail -n 400 "$E2E_SERVER_LOG" || echo "Pas de journal backend (le serveur n'a pas démarré ?)."

      - name: Artefacts Playwright (traces, rapport, journal backend)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/e2e-logs
          if-no-files-found: ignore
          retention-days: 14
