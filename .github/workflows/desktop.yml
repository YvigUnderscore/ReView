# Application desktop (Tauri 2) : contrôles, construction sur les trois OS, publication.
#
# - À chaque changement de `desktop/` : contrôles (lanceur, Rust, notices) puis installeurs
#   en artefacts — de quoi tester sur une vraie machine.
# - Sur une étiquette `desktop-vX.Y.Z` : mêmes builds, attestations de provenance (signées
#   par Sigstore via l'OIDC de GitHub), SHA256SUMS, puis une pré-version GitHub.
#
#   git tag -a desktop-v0.2.0 -m "ReView Desktop 0.2.0" && git push origin desktop-v0.2.0
#
# Signature de code : activée seulement si les secrets existent (voir
# DOCUMENTATION/development/desktop-app.md). Sans eux, macOS reçoit une signature ad hoc et
# Windows un installeur non signé — l'avertissement à l'installation est documenté.
name: Desktop

on:
  push:
    branches: [dev, main]
    tags: ['desktop-v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - 'desktop/**'
      - 'scripts/generate-desktop-notices.mjs'
      - 'scripts/generate-notices.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/generate-desktop-notices.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always
  # Liste des prérequis Tauri 2 pour Debian/Ubuntu ; OpenSSL pour le TLS natif de reqwest.
  LINUX_DEPS: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

jobs:
  checks:
    name: Contrôles (lanceur, Rust, notices)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Toolchain Rust stable
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-checks-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-checks-

      - name: Dépendances npm
        run: npm ci
        working-directory: desktop

      - name: Lanceur — format et tests
        working-directory: desktop
        run: npm run format:check && npm test

      - name: Rust — format, clippy (zéro warning), tests
        working-directory: desktop/src-tauri
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

      - name: Notices tierces du binaire à jour
        run: node scripts/generate-desktop-notices.mjs --check

  build:
    name: Build (${{ matrix.os }})
    needs: checks
    strategy:
      # Chaque OS répond pour lui-même : un échec Linux ne doit pas masquer le verdict macOS.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # Binaire universel : Mac Apple Silicon et Mac Intel avec un seul .dmg.
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Toolchain Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Dépendances npm
        run: npm ci

      # Les secrets ne passent dans l'environnement que s'ils existent : un APPLE_CERTIFICATE
      # vide ferait échouer Tauri au lieu de retomber sur la signature ad hoc.
      - name: Signature de code (si configurée)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
            echo "::notice::macOS : signature Developer ID et notarisation activées"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_SIGN_COMMAND" ]; then
            node -e 'console.log(JSON.stringify({bundle:{windows:{signCommand:process.env.WINDOWS_SIGN_COMMAND}}}))' > src-tauri/signing.conf.json
            echo "TAURI_EXTRA_ARGS=--config src-tauri/signing.conf.json" >> "$GITHUB_ENV"
            echo "::notice::Windows : signature Authenticode activée"
          fi

      # Le cache restaure `target/`, installeurs des builds précédents compris : sans ce
      # ménage, un .dmg de la version d'avant partirait dans la publication.
      - name: tauri build
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
          npm run build -- ${{ matrix.args }} ${TAURI_EXTRA_ARGS:-}

      - name: Rassembler les installeurs
        shell: bash
        run: |
          mkdir -p ../dist-desktop
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} ../dist-desktop/ \;
          ls -la ../dist-desktop
          test -n "$(ls ../dist-desktop)"

      - name: Attestation de provenance (Sigstore)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-desktop/*

      - name: Publier les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: review-desktop-${{ runner.os }}
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Pré-version GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      # Une étiquette qui ne correspond ni à la version de l'application ni à une entrée du
      # CHANGELOG publierait des installeurs mal nommés, sans notes.
      - name: Contrôler l'étiquette
        id: guard
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#desktop-v}"
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "$version" = "$conf" ] || { echo "::error::$tag ≠ version $conf de tauri.conf.json"; exit 1; }
          # Correspondance littérale (index) : dans une regex construite d'une chaîne, `\[`
          # perd son échappement selon l'awk, et `[0.2.0]` devient une classe de caractères.
          awk -v h="## [$version]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' desktop/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::desktop/CHANGELOG.md n'a pas de section [$version]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Récupérer les installeurs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Empreintes SHA-256
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Créer la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat notes.md
            printf '\n---\n\n'
            printf 'Verify a download: `sha256sum -c SHA256SUMS.txt --ignore-missing`, or its build provenance: `gh attestation verify <file> --repo %s`.\n' "$GITHUB_REPOSITORY"
          } > body.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --prerelease \
            --title "ReView Desktop ${{ steps.guard.outputs.version }} (alpha)" \
            --notes-file body.md
