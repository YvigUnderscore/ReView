name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitaires (Vitest)
        run: npm test

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build (Vite)
        run: npm run build

  backend-integration:
    name: Backend — intégration (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_dev
          POSTGRES_DB: review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://review:review_dev@localhost:5432/review?schema=public
      JWT_SECRET: ci_test_secret_change_me_please
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: review
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # MinIO ne peut pas tourner en "service" (commande custom requise) → conteneur dédié
      - name: Démarrer MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live; then echo "minio ok"; break; fi
            sleep 2
          done
      - run: npm ci
      - name: Migrations Prisma
        run: npx prisma migrate deploy
      - name: Smoke test StorageService (MinIO présigné)
        run: npm run storage:smoke
      - name: Tests d'intégration API
        run: npm run test:integration
