# ReView — pile de base (dev et prod ; la prod ajoute docker-compose.prod.yml).
#
# Compose ≥ 2.24 requis : `env_file` en syntaxe longue (`required: false`) ici, et
# `!reset` dans l'overlay de production.

# Rotation des journaux docker, appliquée à TOUS les services (ancre YAML ci-dessous).
# Sans elle, le driver `json-file` par défaut écrit sans borne : sur la cible TrueNAS, les
# journaux pino d'une instance active saturent le pool système — ce n'est plus ReView qui
# tombe, c'est le NAS. 10 Mo × 5 = 50 Mo au plus par conteneur, soit ~450 Mo pour la pile.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review_dev}
      POSTGRES_DB: ${POSTGRES_DB:-review}
    # Pas d'exposition de port en base (prod) : accès interne uniquement.
    # Le dev expose 5432 via docker-compose.override.yml (auto-chargé).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 2 Gio : shared_buffers reste au défaut (128 Mo) et les requêtes du produit sont
    # courtes ; la marge sert au cache de pages et aux tris. Au-delà, c'est le cache du
    # noyau qui travaille, pas Postgres. Relever pour un studio à forte volumétrie.
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    # /dev/shm vaut 64 Mo par défaut dans un conteneur : trop peu pour les tris parallèles
    # de Postgres, qui échouent alors sur « could not resize shared memory segment ».
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    logging: *default-logging
    restart: always

  minio:
    # Version épinglée (jamais `latest` : deux installations faites à deux dates doivent
    # exécuter le même MinIO). Cette release est la dernière à embarquer la console web
    # complète, sur laquelle s'appuient DOCUMENTATION/infrastructure/storage-minio.md et
    # le port 9001 ci-dessous. Surchargeable par MINIO_VERSION dans .env.
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Boucle locale par défaut : ces ports servent au développement, et la console MinIO est
    # une administration complète du stockage — protégée en dev par minioadmin/minioadmin.
    # Publiée sur 0.0.0.0, elle offrait tout le bucket à quiconque partage le réseau.
    # Poser MINIO_BIND=0.0.0.0 pour exposer sciemment (docker-compose.prod.yml, lui, retire
    # tout port hôte : MinIO n'y est joignable qu'à travers nginx).
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Volontairement sans `mem_limit` : MinIO tamponne les envois multipart, et un OOM-kill
    # du stockage corromprait un upload en cours plutôt que de protéger l'hôte. Poser
    # MINIO_MEM_LIMIT si la machine l'exige (cf. infrastructure/storage-minio.md).
    logging: *default-logging
    restart: always

  redis:
    image: redis:7-alpine
    # Pas d'exposition de port en base (prod) ; dev via override.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: always

  backend:
    build: ./backend
    # Le schéma d'environnement du backend compte 43 variables (backend/src/config/env.ts) ;
    # ce bloc `environment:` n'en énumérait que 17. APP_URL, SMTP_*, VAPID_*, LOG_LEVEL,
    # APP_ENCRYPTION_KEY… n'atteignaient jamais le conteneur : inviter un collaborateur
    # échouait sur APP_URL_MISSING dans TOUTE installation docker. Le fichier .env est donc
    # chargé en entier, et `environment:` ne garde que ce qui doit primer.
    #
    # ⚠ Précédence : `environment:` l'emporte sur `env_file:`. Les valeurs ci-dessous sont
    # celles de la TOPOLOGIE RÉSEAU du compose (postgres, minio, redis joignables par leur
    # nom de service) : un .env qui contient un DATABASE_URL vers localhost — le cas normal,
    # pour le CLI Prisma de l'hôte — ne doit surtout pas les remplacer.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review_dev}@postgres:5432/${POSTGRES_DB:-review}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-review}
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Fuseau des digests, rapports hebdomadaires et burn-ins horodatés. Défaut historique
      # conservé ; un studio hors de France pose TZ dans .env.
      TZ: ${TZ:-Europe/Paris}
      # 37.E : nécessaire aussi côté API (déclenche le job `scan` des médias sans traitement).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      # Phase 48 : hôtes ShotGrid tolérés hors HTTPS public (simulateur de développement).
      SHOTGRID_INSECURE_HOSTS: ${SHOTGRID_INSECURE_HOSTS:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # 37.G : jeton d'accès à GET /metrics (vide = réseau interne uniquement).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Initialisation volontaire d'une base VIDE (cf. backend/start.sh) :
      # `PRISMA_DB_PUSH=1 docker compose up backend`. Sans cette ligne de passage, la
      # variable du shell n'atteindrait pas le conteneur — compose ne transmet pas
      # l'environnement de l'hôte. Vide par défaut : seule la valeur « 1 » déclenche quoi
      # que ce soit, et start.sh la refuse quand NODE_ENV=production.
      PRISMA_DB_PUSH: ${PRISMA_DB_PUSH:-}
    # Le simulateur ShotGrid de développement tourne sur la machine hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BPORT:-3430}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sonde HTTP de l'API (les migrations sont jouées au boot, avant l'écoute).
      #
      # ⚠ 127.0.0.1 et non `localhost` : le serveur écoute en IPv4 sur 0.0.0.0, alors que
      # `fetch` de Node résout `localhost` en ::1 d'abord — la sonde échouait sur les images
      # où l'IPv6 est active.
      #
      # HEALTH_PATH (via .env) désigne la route interrogée. `/health` est aujourd'hui une
      # sonde de VIVACITÉ : elle répond « ok » sans toucher Postgres, Redis ni MinIO — un
      # backend dont le pool est mort reste donc « healthy ». Le jour où l'API expose une
      # sonde de DISPONIBILITÉ (SELECT 1 + PING + statObject), il suffit de poser
      # HEALTH_PATH=/health/ready dans .env. Voir infrastructure/monitoring.md.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000' + (process.env.HEALTH_PATH || '/health')).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # 2 Gio : réplica unique, tas Node ~1,5 Gio au plus + les tampons des réponses. La borne
    # ne sert pas le fonctionnement normal — elle empêche une fuite (ex. le rapport de
    # stockage qui matérialise le bucket) d'emporter l'hôte entier.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    logging: *default-logging
    restart: always

  worker:
    build:
      context: ./backend
      args:
        # 45.D : Blender + usd-core dans la seule image du worker (1,6 Go → 3,6 Go).
        # Mettre à vide pour revenir à une image légère (USD alors non converti).
        INSTALL_USD_TOOLS: ${INSTALL_USD_TOOLS:-1}
    command: ["node", "dist/workers/ffmpeg.worker.js"]
    # Même raison que pour le backend : le worker partage le schéma d'environnement de
    # l'API (SMTP, chiffrement des secrets, APP_URL des liens d'email…).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review_dev}@postgres:5432/${POSTGRES_DB:-review}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-review}
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379
      # Le worker ne sert aucune requête HTTP, mais il partage le schéma d'environnement
      # du backend — lequel refuse CORS_ORIGIN='*' en production (config/env.ts). Sans
      # cette ligne, le worker retombe sur le défaut '*' et refuse de démarrer : il faut
      # donc lui passer la même valeur qu'au backend.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: ${TZ:-Europe/Paris}
      # 37.D : h264_nvenc si un GPU NVIDIA est exposé au conteneur (repli libx264 sinon).
      VIDEO_ENCODER: ${VIDEO_ENCODER:-libx264}
      # 37.E : scan antivirus opt-in — pointer vers le service clamav (profil antivirus).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      # Phase 48 : hôtes ShotGrid tolérés hors HTTPS public (simulateur de développement).
      SHOTGRID_INSECURE_HOSTS: ${SHOTGRID_INSECURE_HOSTS:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # 39.A : convertisseur USD→glTF natif (ex. `guc`, installé via --build-arg GUC_URL).
      # Repli utilisé seulement si Blender est absent. Voir DOCUMENTATION/admin-guide/3d-usd.md.
      USD_GLTF_CONVERTER: ${USD_GLTF_CONVERTER:-}
      # 45.D : chemins de l'outillage USD posé par INSTALL_USD_TOOLS (surchargeables).
      USD_BLENDER_BIN: ${USD_BLENDER_BIN:-/opt/blender/blender}
      USD_PYTHON_BIN: ${USD_PYTHON_BIN:-/opt/usdenv/bin/python3}
      # Garde-fous de conversion : délai max d'un convertisseur externe et bornes d'extraction
      # des archives 3D (traversée, bombes de décompression) — 45.A.
      MODEL_CONVERT_TIMEOUT_MS: ${MODEL_CONVERT_TIMEOUT_MS:-900000}
      ARCHIVE_MAX_ENTRIES: ${ARCHIVE_MAX_ENTRIES:-20000}
      ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${ARCHIVE_MAX_UNCOMPRESSED_BYTES:-8589934592}
      ARCHIVE_MAX_COMPRESSION_RATIO: ${ARCHIVE_MAX_COMPRESSION_RATIO:-200}
    # Le simulateur ShotGrid de développement tourne sur la machine hôte : c'est le
    # worker qui synchronise, il doit pouvoir l'atteindre.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Attend que le backend ait joué les migrations avant d'interroger la base.
      backend:
        condition: service_healthy
    # 8 Gio : c'est le seul service qui doive être généreux — deux transcodages HLS
    # simultanés (`media-processing` en concurrence 2) et, avec INSTALL_USD_TOOLS=1, un
    # Blender headless qui charge une scène USD entière. En dessous de ~4 Gio, les
    # conversions USD lourdes se font tuer par l'OOM-killer au lieu d'échouer proprement ;
    # sans borne du tout, elles emportent l'hôte. Ajuster par WORKER_MEM_LIMIT.
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    logging: *default-logging
    restart: always

  # Monitoring opt-in (37.G) : `docker compose --profile monitoring up -d`
  # Grafana sur 127.0.0.1:3431, dashboard « ReView » provisionné.
  prometheus:
    # Épinglé sur la ligne LTS 3.5 : `latest` a déjà changé de comportement entre deux
    # majeures. Surchargeable par PROMETHEUS_VERSION dans .env.
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging: *default-logging
    restart: always

  grafana:
    # Épinglé : le dashboard provisionné est en schemaVersion 39 (Grafana 10.4+/11.x).
    # Surchargeable par GRAFANA_VERSION dans .env.
    image: grafana/grafana-oss:${GRAFANA_VERSION:-11.6.1}
    profiles: ["monitoring"]
    # Boucle locale uniquement : le dashboard expose les métriques de toute l'instance et
    # n'a pas à être joignable depuis le réseau. Accès distant = tunnel SSH ou VPN.
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3431}:3000"
    environment:
      # Le couple admin/admin par défaut de Grafana est un compte d'administration réel :
      # renseigner GRAFANA_ADMIN_PASSWORD dans .env (cf. .env.example). La variable est
      # laissée optionnelle à dessein — compose interpole TOUT le fichier, profils inactifs
      # compris, donc un `:?` ici casserait `docker compose up` de tout le monde. La
      # protection qui ne dépend pas de l'opérateur est l'écoute en boucle locale ci-dessus.
      # (Repli sur `admin` — le défaut historique de Grafana — plutôt que sur une chaîne
      # vide, qui créerait un compte admin SANS mot de passe.)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging
    restart: always

  # Antivirus opt-in (37.E) : `docker compose --profile antivirus up -d` + CLAMAV_HOST=clamav
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *default-logging
    restart: always

  frontend:
    # Contexte racine : le build embarque DOCUMENTATION/ (page /docs in-app).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${PORT:-3429}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # busybox wget (image nginx:alpine) : la SPA est-elle servie ? Sans cette sonde, un
      # nginx qui a refusé sa configuration reste « running » et le proxy TLS de prod lui
      # envoie du trafic.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: always

volumes:
  pgdata:
  miniodata:
  redisdata:
  clamav_db:
  prometheus_data:
  grafana_data:
