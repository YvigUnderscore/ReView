services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review_dev}
      POSTGRES_DB: ${POSTGRES_DB:-review}
    # Pas d'exposition de port en base (prod) : accès interne uniquement.
    # Le dev expose 5432 via docker-compose.override.yml (auto-chargé).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Boucle locale par défaut : ces ports servent au développement, et la console MinIO est
    # une administration complète du stockage — protégée en dev par minioadmin/minioadmin.
    # Publiée sur 0.0.0.0, elle offrait tout le bucket à quiconque partage le réseau.
    # Poser MINIO_BIND=0.0.0.0 pour exposer sciemment (docker-compose.prod.yml, lui, retire
    # tout port hôte : MinIO n'y est joignable qu'à travers nginx).
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    # Pas d'exposition de port en base (prod) ; dev via override.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review_dev}@postgres:5432/${POSTGRES_DB:-review}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-review}
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: Europe/Paris
      # 37.E : nécessaire aussi côté API (déclenche le job `scan` des médias sans traitement).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # 37.G : jeton d'accès à GET /metrics (vide = réseau interne uniquement).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "${BPORT:-3430}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Vérifie que l'API répond (les migrations sont jouées au boot avant l'écoute).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: always

  worker:
    build:
      context: ./backend
      args:
        # 45.D : Blender + usd-core dans la seule image du worker (1,6 Go → 3,6 Go).
        # Mettre à vide pour revenir à une image légère (USD alors non converti).
        INSTALL_USD_TOOLS: ${INSTALL_USD_TOOLS:-1}
    command: ["node", "dist/workers/ffmpeg.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review_dev}@postgres:5432/${POSTGRES_DB:-review}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-review}
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379
      # Le worker ne sert aucune requête HTTP, mais il partage le schéma d'environnement
      # du backend — lequel refuse CORS_ORIGIN='*' en production (config/env.ts). Sans
      # cette ligne, le worker retombe sur le défaut '*' et refuse de démarrer : il faut
      # donc lui passer la même valeur qu'au backend.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: Europe/Paris
      # 37.D : h264_nvenc si un GPU NVIDIA est exposé au conteneur (repli libx264 sinon).
      VIDEO_ENCODER: ${VIDEO_ENCODER:-libx264}
      # 37.E : scan antivirus opt-in — pointer vers le service clamav (profil antivirus).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # 39.A : convertisseur USD→glTF natif (ex. `guc`, installé via --build-arg GUC_URL).
      # Repli utilisé seulement si Blender est absent. Voir DOCUMENTATION/admin-guide/3d-usd.md.
      USD_GLTF_CONVERTER: ${USD_GLTF_CONVERTER:-}
      # 45.D : chemins de l'outillage USD posé par INSTALL_USD_TOOLS (surchargeables).
      USD_BLENDER_BIN: ${USD_BLENDER_BIN:-/opt/blender/blender}
      USD_PYTHON_BIN: ${USD_PYTHON_BIN:-/opt/usdenv/bin/python3}
      # Garde-fous de conversion : délai max d'un convertisseur externe et bornes d'extraction
      # des archives 3D (traversée, bombes de décompression) — 45.A.
      MODEL_CONVERT_TIMEOUT_MS: ${MODEL_CONVERT_TIMEOUT_MS:-900000}
      ARCHIVE_MAX_ENTRIES: ${ARCHIVE_MAX_ENTRIES:-20000}
      ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${ARCHIVE_MAX_UNCOMPRESSED_BYTES:-8589934592}
      ARCHIVE_MAX_COMPRESSION_RATIO: ${ARCHIVE_MAX_COMPRESSION_RATIO:-200}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Attend que le backend ait joué les migrations avant d'interroger la base.
      backend:
        condition: service_healthy
    restart: always

  # Monitoring opt-in (37.G) : `docker compose --profile monitoring up -d`
  # Grafana sur 127.0.0.1:3431, dashboard « ReView » provisionné.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["monitoring"]
    # Boucle locale uniquement : le dashboard expose les métriques de toute l'instance et
    # n'a pas à être joignable depuis le réseau. Accès distant = tunnel SSH ou VPN.
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3431}:3000"
    environment:
      # Le couple admin/admin par défaut de Grafana est un compte d'administration réel :
      # renseigner GRAFANA_ADMIN_PASSWORD dans .env (cf. .env.example). La variable est
      # laissée optionnelle à dessein — compose interpole TOUT le fichier, profils inactifs
      # compris, donc un `:?` ici casserait `docker compose up` de tout le monde. La
      # protection qui ne dépend pas de l'opérateur est l'écoute en boucle locale ci-dessus.
      # (Repli sur `admin` — le défaut historique de Grafana — plutôt que sur une chaîne
      # vide, qui créerait un compte admin SANS mot de passe.)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  # Antivirus opt-in (37.E) : `docker compose --profile antivirus up -d` + CLAMAV_HOST=clamav
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: always

  frontend:
    # Contexte racine : le build embarque DOCUMENTATION/ (page /docs in-app).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${PORT:-3429}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  miniodata:
  redisdata:
  clamav_db:
  prometheus_data:
  grafana_data:
