<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" width="800" height="484" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">The two HTTP surfaces of the backend</title>
  <desc id="fig-desc">The internal /api is guarded by a session JWT and a role; the versioned /api/v1 is guarded by a service token and a scope. Both call the same services layer, which alone talks to Prisma and to the job queues.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="484" rx="10"/>

  <text class="d" x="40" y="28">WHAT THE BROWSER TALKS TO</text>
  <text class="d" x="420" y="28">WHAT A PIPELINE TOOL TALKS TO</text>

  <!-- Colonne gauche : API interne -->
  <rect class="panel" x="40" y="44" width="340" height="46" rx="9"/>
  <text class="t" x="210" y="66" text-anchor="middle">/api — the web interface</text>
  <text class="d" x="210" y="82" text-anchor="middle">may change with the UI, no version promise</text>
  <path class="conn" d="M210 90 L210 104" marker-end="url(#arrow)"/>
  <rect class="panel" x="40" y="108" width="340" height="34" rx="9"/>
  <text class="l" x="210" y="129" text-anchor="middle">authenticate — session JWT</text>
  <path class="conn" d="M210 142 L210 154" marker-end="url(#arrow)"/>
  <rect class="panel" x="40" y="158" width="340" height="34" rx="9"/>
  <text class="l" x="210" y="179" text-anchor="middle">requireRole — role and membership</text>
  <path class="conn" d="M210 192 L210 204" marker-end="url(#arrow)"/>
  <rect class="panel" x="40" y="208" width="340" height="34" rx="9"/>
  <text class="l" x="210" y="229" text-anchor="middle">routes/*.routes.ts — one per domain</text>

  <!-- Colonne droite : contrat d'intégration -->
  <rect class="panel" x="420" y="44" width="340" height="46" rx="9"/>
  <text class="t" x="590" y="66" text-anchor="middle">/api/v1 — the integration contract</text>
  <text class="d" x="590" y="82" text-anchor="middle">does not move without a version bump</text>
  <path class="conn-a" d="M590 90 L590 104" marker-end="url(#arrow-a)"/>
  <rect class="panel" x="420" y="108" width="340" height="34" rx="9"/>
  <text class="l" x="590" y="129" text-anchor="middle">service token, bound to a project</text>
  <path class="conn-a" d="M590 142 L590 154" marker-end="url(#arrow-a)"/>
  <rect class="panel" x="420" y="158" width="340" height="34" rx="9"/>
  <text class="l" x="590" y="179" text-anchor="middle">requireScope — versions:write, media:write</text>
  <path class="conn-a" d="M590 192 L590 204" marker-end="url(#arrow-a)"/>
  <rect class="panel" x="420" y="208" width="340" height="34" rx="9"/>
  <text class="l" x="590" y="229" text-anchor="middle">routes/v1/ — the versioned tree</text>

  <!-- Convergence -->
  <path class="conn" d="M210 242 L210 272" marker-end="url(#arrow)"/>
  <path class="conn-a" d="M590 242 L590 272" marker-end="url(#arrow-a)"/>

  <rect class="panel-a" x="120" y="272" width="560" height="46" rx="9"/>
  <text class="t" x="400" y="294" text-anchor="middle">services/ + lib/ — the business logic, written once</text>
  <text class="d" x="400" y="310" text-anchor="middle">one rule, one module, one test — never duplicated per surface</text>

  <path class="conn" d="M250 318 L250 348" marker-end="url(#arrow)"/>
  <path class="conn" d="M550 318 L550 348" marker-end="url(#arrow)"/>

  <rect class="panel" x="120" y="352" width="260" height="46" rx="9"/>
  <text class="l" x="250" y="374" text-anchor="middle">PostgreSQL, through Prisma</text>
  <text class="d" x="250" y="390" text-anchor="middle">transactions, committed migrations</text>

  <rect class="panel" x="420" y="352" width="260" height="46" rx="9"/>
  <text class="l" x="550" y="374" text-anchor="middle">BullMQ, through JobService</text>
  <text class="d" x="550" y="390" text-anchor="middle">ffmpeg, shotgrid, webhook workers</text>

  <rect class="panel-d" x="40" y="418" width="720" height="46" rx="9"/>
  <text class="t" x="400" y="440" text-anchor="middle">A leaked farm token opens /api/v1 only — and only its project</text>
  <text class="d" x="400" y="456" text-anchor="middle">apiTokenSurface closes the internal /api to every service token</text>
</svg>
