<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 756" width="800" height="756" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">The nine gates of scripts/validate.sh, in order</title>
  <desc id="fig-desc">Licence headers, third-party notices, four i18n checks, theme checks, documentation, tooling, the backend route budget, then the backend and frontend blocks. The script stops at the first red step. Three optional flags hang off the spine at the point where they run.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="756" rx="10"/>

  <text class="d" x="28" y="28">RUN BEFORE EVERY COMMIT — STOPS AT THE FIRST RED STEP</text>

  <rect class="panel" x="28" y="52" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="74">1 · SPDX header on every source file</text>
  <text class="m" x="44" y="90">node scripts/add-license-headers.mjs --check</text>
  <path class="conn" d="M299 98 L299 114" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="118" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="140">2 · THIRD-PARTY-NOTICES.md up to date</text>
  <text class="m" x="44" y="156">node scripts/generate-notices.mjs --check</text>
  <path class="conn" d="M299 164 L299 180" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="184" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="206">3 · i18n — four checks in a row</text>
  <text class="d" x="44" y="222">catalogue coherence, hardcoded strings (0), raw keys (0), backend English</text>
  <path class="conn" d="M299 230 L299 246" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="250" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="272">4 · Theme — tokens only, no pixel font sizes</text>
  <text class="m" x="44" y="288">check-color-tokens.mjs · check-text-sizes.mjs</text>
  <path class="conn" d="M299 296 L299 312" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="316" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="338">5 · Documentation — preambles, links, anchors, figures</text>
  <text class="m" x="44" y="354">check-docs.mjs</text>
  <path class="conn" d="M299 362 L299 378" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="382" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="404">6 · Tooling — root scripts and worker Python</text>
  <text class="d" x="44" y="420">eslint, prettier, bash -n, compileall over usd/ and ocio/, ruff if installed</text>
  <path class="conn" d="M299 428 L299 444" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="448" width="542" height="46" rx="9"/>
  <text class="l" x="44" y="470">7 · Budget — no backend route over 200 lines</text>
  <text class="d" x="44" y="486">the two SPDX lines are excluded from the count</text>
  <path class="conn" d="M299 494 L299 510" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="514" width="542" height="64" rx="9"/>
  <text class="l" x="44" y="536">8 · Backend</text>
  <text class="d" x="44" y="552">prettier, eslint (0 warnings), prisma validate, schema drift</text>
  <text class="d" x="44" y="568">then typecheck with tests, build, vitest, coverage floors</text>
  <path class="conn" d="M299 578 L299 594" marker-end="url(#arrow)"/>

  <rect class="panel" x="28" y="598" width="542" height="64" rx="9"/>
  <text class="l" x="44" y="620">9 · Frontend</text>
  <text class="d" x="44" y="636">prettier, eslint (0 warnings), typecheck (src and e2e), vitest</text>
  <text class="d" x="44" y="652">then coverage floors, vite build, entry bundle budget in gzip</text>
  <path class="conn" d="M299 662 L299 678" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="28" y="682" width="542" height="46" rx="9"/>
  <text class="t ok" x="299" y="704" text-anchor="middle">All green — the code may be committed</text>
  <text class="d" x="299" y="720" text-anchor="middle">anything red exits 1, and nothing after it runs</text>

  <rect class="panel-d" x="598" y="52" width="174" height="76" rx="9"/>
  <text class="t no" x="685" y="74" text-anchor="middle">Fail fast</text>
  <text class="d" x="685" y="92" text-anchor="middle">the first red step</text>
  <text class="d" x="685" y="106" text-anchor="middle">exits 1 — nothing</text>
  <text class="d" x="685" y="120" text-anchor="middle">after it is run</text>

  <path class="conn-o" d="M570 546 L594 546" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="598" y="523" width="174" height="46" rx="9"/>
  <text class="m" x="685" y="545" text-anchor="middle">--with-integration</text>
  <text class="d" x="685" y="561" text-anchor="middle">Postgres, Redis, MinIO</text>

  <path class="conn-o" d="M570 615 L594 615" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="598" y="592" width="174" height="46" rx="9"/>
  <text class="m" x="685" y="614" text-anchor="middle">--with-e2e</text>
  <text class="d" x="685" y="630" text-anchor="middle">Playwright smoke</text>

  <path class="conn-o" d="M570 673 L594 673" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="598" y="650" width="174" height="46" rx="9"/>
  <text class="m" x="685" y="672" text-anchor="middle">--with-shotgrid</text>
  <text class="d" x="685" y="688" text-anchor="middle">fake site, over HTTP</text>
</svg>
