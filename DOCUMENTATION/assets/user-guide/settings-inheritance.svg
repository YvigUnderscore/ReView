<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-labelledby="si-title si-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="si-title">How delivery settings cascade</title>
  <desc id="si-desc">Resolution and framerate descend from the studio to the project, the sequence and the shot; each level either inherits or overrides, and the shot adds the frame range. Assets carry none of it, and colour management and transcoding are set elsewhere.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="312" rx="10"/>

  <text class="d" x="24" y="30">RESOLUTION, FRAMERATE, FRAME RANGE — EACH LEVEL INHERITS OR OVERRIDES</text>

  <rect class="panel" x="24" y="46" width="170" height="46" rx="9"/>
  <text class="l" x="109" y="68" text-anchor="middle">Studio</text>
  <text class="d" x="109" y="84" text-anchor="middle">the default for all</text>

  <path class="conn" d="M194 69 L218 69" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="218" y="46" width="170" height="46" rx="9"/>
  <text class="t" x="303" y="68" text-anchor="middle">Project</text>
  <text class="d" x="303" y="84" text-anchor="middle">resolution · framerate</text>

  <path class="conn" d="M388 69 L412 69" marker-end="url(#arrow)"/>

  <rect class="panel" x="412" y="46" width="170" height="46" rx="9"/>
  <text class="l" x="497" y="68" text-anchor="middle">Sequence</text>
  <text class="d" x="497" y="84" text-anchor="middle">may override both</text>

  <path class="conn" d="M582 69 L606 69" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="606" y="46" width="170" height="46" rx="9"/>
  <text class="t" x="691" y="68" text-anchor="middle">Shot</text>
  <text class="d" x="691" y="84" text-anchor="middle">and the frame range</text>

  <text class="d" x="24" y="120">WHAT THE VIEWER USES</text>
  <rect class="panel" x="24" y="132" width="752" height="46" rx="9"/>
  <text class="l" x="40" y="154">The resolved value, level by level</text>
  <text class="d" x="40" y="170">the letterbox guide of the review frame is drawn at the delivery aspect ratio</text>

  <text class="d" x="24" y="204">NOT IN THIS CHAIN</text>
  <rect class="panel-o" x="24" y="216" width="368" height="46" rx="9"/>
  <text class="l" x="40" y="238">Assets</text>
  <text class="d" x="40" y="254">no resolution, no framerate of their own</text>

  <rect class="panel-w" x="408" y="216" width="368" height="46" rx="9"/>
  <text class="l" x="424" y="238">Colour and transcoding</text>
  <text class="d" x="424" y="254">OCIO per project · transcoding studio-wide only</text>

  <text class="d" x="24" y="290">A level that overrides nothing keeps inheriting: change the project and every sequence follows.</text>
</svg>
