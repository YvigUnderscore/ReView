<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Which derivatives exist, per kind of media</title>
  <desc id="fig-desc">A grid crossing seven kinds of delivered media with the eight derivatives the worker can produce: probe, MP4 proxy, HLS ladder, thumbnail, timeline sprite, audio waveform, full-resolution JPEG web proxy and derived GLB. Each row also states what becomes of the uploaded file.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="500" rx="10"/>

  <text class="d" x="24" y="30">WHAT THE WORKER WRITES, PER KIND OF DELIVERED MEDIA</text>

  <!-- Bandeau d'en-tête -->
  <rect class="band" x="24" y="52" width="752" height="32" rx="9"/>
  <text class="d" x="36" y="72">DELIVERED MEDIA</text>
  <text class="d" x="296" y="72" text-anchor="middle">Probe</text>
  <text class="d" x="360" y="72" text-anchor="middle">MP4 proxy</text>
  <text class="d" x="424" y="72" text-anchor="middle">HLS ladder</text>
  <text class="d" x="488" y="72" text-anchor="middle">Thumbnail</text>
  <text class="d" x="552" y="72" text-anchor="middle">Sprite</text>
  <text class="d" x="616" y="72" text-anchor="middle">Waveform</text>
  <text class="d" x="680" y="72" text-anchor="middle">Web JPEG</text>
  <text class="d" x="744" y="72" text-anchor="middle">GLB</text>

  <!-- Lignes alternées -->
  <rect class="band" x="24" y="134" width="752" height="46" rx="9"/>
  <rect class="band" x="24" y="226" width="752" height="46" rx="9"/>
  <rect class="band" x="24" y="318" width="752" height="46" rx="9"/>

  <!-- Vidéo -->
  <text class="l" x="36" y="108">Video</text>
  <text class="d" x="36" y="124">deleted — the proxy becomes the source</text>
  <circle class="ok" cx="296" cy="111" r="4.5"/>
  <circle class="ok" cx="360" cy="111" r="4.5"/>
  <circle class="ok" cx="424" cy="111" r="4.5"/>
  <circle class="ok" cx="488" cy="111" r="4.5"/>
  <circle class="ok" cx="552" cy="111" r="4.5"/>
  <circle class="ok" cx="616" cy="111" r="4.5"/>
  <text class="d" x="680" y="115" text-anchor="middle">–</text>
  <text class="d" x="744" y="115" text-anchor="middle">–</text>

  <!-- Séquence d'images -->
  <text class="l" x="36" y="154">Image sequence</text>
  <text class="d" x="36" y="170">frames and manifest always kept</text>
  <circle class="ok" cx="296" cy="157" r="4.5"/>
  <circle class="ok" cx="360" cy="157" r="4.5"/>
  <circle class="ok" cx="424" cy="157" r="4.5"/>
  <circle class="ok" cx="488" cy="157" r="4.5"/>
  <circle class="ok" cx="552" cy="157" r="4.5"/>
  <text class="d" x="616" y="161" text-anchor="middle">–</text>
  <text class="d" x="680" y="161" text-anchor="middle">–</text>
  <text class="d" x="744" y="161" text-anchor="middle">–</text>

  <!-- Image navigateur -->
  <text class="l" x="36" y="200">Browser image</text>
  <text class="d" x="36" y="216">jpg, png, webp, gif, bmp — kept as is</text>
  <circle class="ok" cx="296" cy="203" r="4.5"/>
  <text class="d" x="360" y="207" text-anchor="middle">–</text>
  <text class="d" x="424" y="207" text-anchor="middle">–</text>
  <circle class="ok" cx="488" cy="203" r="4.5"/>
  <text class="d" x="552" y="207" text-anchor="middle">–</text>
  <text class="d" x="616" y="207" text-anchor="middle">–</text>
  <text class="d" x="680" y="207" text-anchor="middle">–</text>
  <text class="d" x="744" y="207" text-anchor="middle">–</text>

  <!-- Image de production -->
  <text class="l" x="36" y="246">Production image</text>
  <text class="d" x="36" y="262">exr, dpx, tif, tga — kept, downloadable</text>
  <circle class="ok" cx="296" cy="249" r="4.5"/>
  <text class="d" x="360" y="253" text-anchor="middle">–</text>
  <text class="d" x="424" y="253" text-anchor="middle">–</text>
  <circle class="ok" cx="488" cy="249" r="4.5"/>
  <text class="d" x="552" y="253" text-anchor="middle">–</text>
  <text class="d" x="616" y="253" text-anchor="middle">–</text>
  <circle class="ok" cx="680" cy="249" r="4.5"/>
  <text class="d" x="744" y="253" text-anchor="middle">–</text>

  <!-- 3D à convertir -->
  <text class="l" x="36" y="292">3D model needing conversion</text>
  <text class="d" x="36" y="308">kept; the GLB is a derived view</text>
  <text class="d" x="296" y="299" text-anchor="middle">–</text>
  <text class="d" x="360" y="299" text-anchor="middle">–</text>
  <text class="d" x="424" y="299" text-anchor="middle">–</text>
  <text class="d" x="488" y="299" text-anchor="middle">–</text>
  <text class="d" x="552" y="299" text-anchor="middle">–</text>
  <text class="d" x="616" y="299" text-anchor="middle">–</text>
  <text class="d" x="680" y="299" text-anchor="middle">–</text>
  <circle class="ok" cx="744" cy="295" r="4.5"/>

  <!-- GLB natif -->
  <text class="l" x="36" y="338">Native .glb</text>
  <text class="d" x="36" y="354">kept and served as it is</text>
  <text class="d" x="296" y="345" text-anchor="middle">–</text>
  <text class="d" x="360" y="345" text-anchor="middle">–</text>
  <text class="d" x="424" y="345" text-anchor="middle">–</text>
  <text class="d" x="488" y="345" text-anchor="middle">–</text>
  <text class="d" x="552" y="345" text-anchor="middle">–</text>
  <text class="d" x="616" y="345" text-anchor="middle">–</text>
  <text class="d" x="680" y="345" text-anchor="middle">–</text>
  <text class="d" x="744" y="345" text-anchor="middle">–</text>

  <!-- Splat -->
  <text class="l" x="36" y="384">Gaussian splat</text>
  <text class="d" x="36" y="400">never modified; edits live in metadata</text>
  <text class="d" x="296" y="391" text-anchor="middle">–</text>
  <text class="d" x="360" y="391" text-anchor="middle">–</text>
  <text class="d" x="424" y="391" text-anchor="middle">–</text>
  <text class="d" x="488" y="391" text-anchor="middle">–</text>
  <text class="d" x="552" y="391" text-anchor="middle">–</text>
  <text class="d" x="616" y="391" text-anchor="middle">–</text>
  <text class="d" x="680" y="391" text-anchor="middle">–</text>
  <text class="d" x="744" y="391" text-anchor="middle">–</text>

  <text class="d" x="24" y="436">A waveform is written only when the source carries an audio track; the HLS ladder only when adaptive transcoding is enabled.</text>
  <text class="d" x="24" y="454">3D models and splats get their preview from a separate spatial-thumbnail renderer, not from this job.</text>
  <text class="a" x="24" y="472">Sprite, waveform, scene detection, burn-in resolution and client slate are best effort: they never fail the job.</text>
</svg>
