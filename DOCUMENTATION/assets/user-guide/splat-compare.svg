<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-labelledby="scm-title scm-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="scm-title">Comparing Gaussian splats in a single scene</title>
  <desc id="scm-desc">The READY splat siblings of the version and the splats checked in the Compare selector are loaded into one Spark scene as children of the same pivot. A/B cross-fades between them, Show all slides them apart, and a switch chooses between unified size and raw file scales. Compared clouds are loaded raw, without their own clean-up.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="376" rx="10"/>

  <text class="d" x="24" y="30">WHAT GOES INTO THE SCENE</text>
  <text class="d" x="548" y="30">HOW IT IS SHOWN</text>

  <!-- Sources -->
  <rect class="panel" x="24" y="54" width="228" height="64" rx="9"/>
  <text class="l" x="40" y="78">Splat siblings</text>
  <text class="d" x="40" y="95">the READY splats of this version</text>
  <text class="d" x="40" y="110">one tab each, in the header</text>

  <rect class="panel" x="24" y="142" width="228" height="64" rx="9"/>
  <text class="l" x="40" y="166">Other versions</text>
  <text class="d" x="40" y="183">checked in the Compare… selector</text>
  <text class="d" x="40" y="198">same task or asset — v003 vs v002</text>

  <path class="conn-a" d="M252 86 L272 86 L272 118 L292 118" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M252 174 L272 174 L272 154 L292 154" marker-end="url(#arrow-a)"/>

  <!-- Scène Spark commune -->
  <rect class="panel-a" x="292" y="90" width="216" height="92" rx="9"/>
  <text class="t" x="400" y="114" text-anchor="middle">One Spark scene</text>
  <text class="d" x="400" y="132" text-anchor="middle">every cloud a child of the</text>
  <text class="d" x="400" y="147" text-anchor="middle">same pivot — same orientation</text>
  <text class="d" x="400" y="162" text-anchor="middle">flip, same camera</text>

  <path class="conn" d="M508 118 L528 118 L528 94 L548 94" marker-end="url(#arrow)"/>
  <path class="conn" d="M508 154 L528 154 L528 182 L548 182" marker-end="url(#arrow)"/>

  <!-- États de sortie -->
  <rect class="panel" x="548" y="62" width="228" height="64" rx="9"/>
  <text class="l" x="564" y="86">One tab active — A/B</text>
  <text class="d" x="564" y="103">the chosen cloud fades in, the</text>
  <text class="d" x="564" y="118">others fade out and slide back</text>

  <rect class="panel" x="548" y="150" width="228" height="64" rx="9"/>
  <text class="l" x="564" y="174">Show all — side by side</text>
  <text class="d" x="564" y="191">spacing = widest visible</text>
  <text class="d" x="564" y="206">bounding box × 1.15</text>

  <!-- Interrupteur de taille -->
  <path class="conn-o" d="M400 182 L400 224"/>
  <rect class="panel-o" x="292" y="228" width="216" height="64" rx="9"/>
  <text class="l" x="400" y="252" text-anchor="middle">Unified size, or Real size</text>
  <text class="d" x="400" y="269" text-anchor="middle">unified (default) matches every</text>
  <text class="d" x="400" y="284" text-anchor="middle">cloud to the reference's size</text>

  <!-- Mise en garde -->
  <rect class="panel-d" x="24" y="300" width="752" height="56" rx="9"/>
  <text class="t" x="44" y="324">Compared splats are loaded raw</text>
  <text class="d" x="44" y="342">their own mask, cutting volumes and transform are not replayed — you are comparing shapes, not clean-ups.</text>
</svg>
