<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ovl-title ovl-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="ovl-title">Where a 3D scene change is written, and who sees it</title>
  <desc id="ovl-desc">Five layers stacked on top of the source file: the conversion to GLB, then the media override saved for everyone, then a proposal carried by a comment, then your own local exploration that is never saved. The source USD or GLB is never modified.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="500" rx="10"/>

  <text class="d" x="40" y="30">WHAT A VIEWER ENDS UP SEEING, LAYER BY LAYER</text>
  <text class="d" x="520" y="30">WHO WRITES IT, AND WHEN</text>

  <!-- 1. Fichier source -->
  <rect class="panel" x="40" y="44" width="440" height="52" rx="9"/>
  <text class="t" x="260" y="68" text-anchor="middle">Source file in object storage</text>
  <text class="d" x="260" y="85" text-anchor="middle">USD or GLB — never modified by anything on this page</text>

  <path class="conn" d="M260 96 L260 116" marker-end="url(#arrow)"/>

  <!-- 2. Conversion -->
  <rect class="panel" x="40" y="120" width="440" height="64" rx="9"/>
  <text class="l" x="260" y="144" text-anchor="middle">Conversion to GLB</text>
  <text class="d" x="260" y="161" text-anchor="middle">composition resolved, UsdPreviewSurface materials,</text>
  <text class="d" x="260" y="176" text-anchor="middle">baked variant combinations, the chosen purpose</text>

  <path class="conn-o" d="M480 152 L520 152"/>
  <rect class="panel" x="520" y="120" width="256" height="64" rx="9"/>
  <text class="d" x="536" y="142">Recompose from the USD replays</text>
  <text class="d" x="536" y="157">this step with other variants —</text>
  <text class="d" x="536" y="172">managers, before publication only</text>

  <path class="conn" d="M260 184 L260 204" marker-end="url(#arrow)"/>

  <!-- 3. Override du média -->
  <rect class="panel-a" x="40" y="208" width="440" height="64" rx="9"/>
  <text class="t" x="260" y="232" text-anchor="middle">Media override — the ReView delta</text>
  <text class="d" x="260" y="249" text-anchor="middle">moved, scaled, hidden, this variant, staging clones</text>
  <text class="d" x="260" y="264" text-anchor="middle">Save for everyone · replayed for all · frozen at publication</text>

  <path class="conn-o" d="M480 240 L520 240"/>
  <rect class="panel-w" x="520" y="208" width="256" height="64" rx="9"/>
  <text class="d" x="536" y="230">Publish writes your unsaved</text>
  <text class="d" x="536" y="245">scene changes into this layer</text>
  <text class="d" x="536" y="260">before it locks them for good</text>

  <path class="conn" d="M260 272 L260 292" marker-end="url(#arrow)"/>

  <!-- 4. Proposition d'un commentaire -->
  <rect class="panel-a" x="40" y="296" width="440" height="64" rx="9"/>
  <text class="t" x="260" y="320" text-anchor="middle">Comment proposal — the same delta, on a note</text>
  <text class="d" x="260" y="337" text-anchor="middle">replayed only while that comment is selected</text>
  <text class="d" x="260" y="352" text-anchor="middle">moving the camera keeps it applied; Esc releases it</text>

  <path class="conn-o" d="M480 328 L520 328"/>
  <rect class="panel" x="520" y="296" width="256" height="64" rx="9"/>
  <text class="d" x="536" y="318">The only way to propose a</text>
  <text class="d" x="536" y="333">change on a published media —</text>
  <text class="d" x="536" y="348">the shared scene never moves</text>

  <path class="conn" d="M260 360 L260 380" marker-end="url(#arrow)"/>

  <!-- 5. Exploration locale -->
  <rect class="panel-o" x="40" y="384" width="440" height="64" rx="9"/>
  <text class="l" x="260" y="408" text-anchor="middle">Your local exploration</text>
  <text class="d" x="260" y="425" text-anchor="middle">isolation, visibility, moved prims — yours alone</text>
  <text class="d" x="260" y="440" text-anchor="middle">Undo returns to the saved state; changing asset resets it</text>

  <path class="conn-o" d="M480 416 L520 416"/>
  <rect class="panel-o" x="520" y="384" width="256" height="64" rx="9"/>
  <text class="d" x="536" y="406">Never saved unless you do</text>
  <text class="d" x="536" y="421">one of the two layers above</text>
  <text class="d" x="536" y="436">— it belongs to your session</text>

  <text class="d" x="40" y="478">The two saved layers are bounded: up to 50 clones per prim, and 500 edited prims per override.</text>
</svg>
