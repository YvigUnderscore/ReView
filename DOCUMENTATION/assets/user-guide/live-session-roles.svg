<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Pilot, co-pilot and driver in a live review session</title>
  <desc id="fig-desc">A viewer becomes a co-pilot when the pilot names one, and a co-pilot becomes pilot on a hand over, which is a full transfer. If the pilot leaves for good the first co-pilot inherits, failing that the longest-present participant. The driver is whichever pilot or co-pilot interacted last, and the server drops sync from anyone else.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="410" rx="10"/>
  <rect class="band" x="406" y="52" width="374" height="292" rx="10"/>

  <text class="d" x="20" y="46">ROLES IN THE ROOM</text>
  <text class="d" x="420" y="46">WHO IS HEARD</text>

  <!-- Échelle des rôles -->
  <rect class="panel" x="20" y="64" width="340" height="46" rx="9"/>
  <text class="t" x="34" y="86">Viewer</text>
  <text class="d" x="34" y="102">watches and comments; steers nothing</text>

  <path class="conn" d="M190 110 L190 140" marker-end="url(#arrow)"/>
  <text class="a" x="204" y="130">the pilot names a co-pilot</text>

  <rect class="panel" x="20" y="144" width="340" height="46" rx="9"/>
  <text class="t" x="34" y="166">Co-pilot</text>
  <text class="d" x="34" y="182">may take the wheel at any moment</text>

  <path class="conn" d="M190 190 L190 220" marker-end="url(#arrow)"/>
  <text class="a" x="204" y="210">hand over — a full transfer</text>

  <rect class="panel-a" x="20" y="224" width="340" height="46" rx="9"/>
  <text class="t" x="34" y="246">Pilot</text>
  <text class="d" x="34" y="262">one per room; manages the roles</text>

  <path class="conn" d="M190 270 L190 300" marker-end="url(#arrow)"/>
  <text class="a" x="204" y="290">leaves for good</text>

  <rect class="panel-o" x="20" y="304" width="340" height="46" rx="9"/>
  <text class="t" x="34" y="326">The first co-pilot inherits</text>
  <text class="d" x="34" y="342">failing that, the longest-present participant</text>

  <text class="d" x="20" y="372">a reload or a brief disconnect keeps your role —</text>
  <text class="d" x="20" y="388">the server waits 10 seconds before removing you</text>

  <!-- Le driver et le relais -->
  <rect class="panel-a" x="420" y="64" width="360" height="64" rx="9"/>
  <text class="t" x="600" y="86" text-anchor="middle">Driver</text>
  <text class="d" x="600" y="104" text-anchor="middle">the last pilot or co-pilot who interacted —</text>
  <text class="d" x="600" y="120" text-anchor="middle">play/pause, seek, playlist nav, camera, zoom, wipe</text>

  <path class="conn-a" d="M600 128 L600 158" marker-end="url(#arrow-a)"/>

  <rect class="panel" x="420" y="162" width="360" height="64" rx="9"/>
  <text class="t" x="600" y="184" text-anchor="middle">Server relay</text>
  <text class="d" x="600" y="202" text-anchor="middle">sync from anyone who is not the driver is dropped</text>
  <text class="d" x="600" y="218" text-anchor="middle">neither pilot nor co-pilot: never relayed at all</text>

  <path class="conn-a" d="M600 226 L600 256" marker-end="url(#arrow-a)"/>

  <rect class="panel" x="420" y="260" width="360" height="64" rx="9"/>
  <text class="t" x="600" y="282" text-anchor="middle">Viewers</text>
  <text class="d" x="600" y="300" text-anchor="middle">playhead, A/B and wipe, camera, zoom and pan,</text>
  <text class="d" x="600" y="316" text-anchor="middle">plus the driver's pointer, in its own colour</text>

  <text class="d" x="420" y="372">joined without interacting first? playback starts</text>
  <text class="d" x="420" y="388">muted, with a sound button on the LIVE chip</text>
</svg>
