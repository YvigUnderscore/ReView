<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" width="800" height="512" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Two people saving one board, and what the server does about it</title>
  <desc id="fig-desc">Both editors load the board on the same timestamp T0. The first save updates the row only because it still carries T0, and the stored timestamp becomes T1. The second save still presents T0, updates zero rows, and comes back as 409 BOARD_CONFLICT, leaving the second editor to reload or to overwrite.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="512" rx="10"/>

  <text class="d" x="24" y="30">ONE BOARD, TWO EDITORS, NO SILENT LOSS</text>

  <!-- Les quatre acteurs, et leur ligne de vie -->
  <rect class="panel-a" x="35" y="44" width="150" height="34" rx="9"/>
  <text class="t" x="110" y="66" text-anchor="middle">Editor A</text>
  <rect class="panel-a" x="215" y="44" width="150" height="34" rx="9"/>
  <text class="t" x="290" y="66" text-anchor="middle">Editor B</text>
  <rect class="panel" x="415" y="44" width="150" height="34" rx="9"/>
  <text class="l" x="490" y="66" text-anchor="middle">Server</text>
  <rect class="panel" x="615" y="44" width="150" height="34" rx="9"/>
  <text class="l" x="690" y="66" text-anchor="middle">Board (Postgres)</text>

  <path class="conn-o" d="M110 78 L110 400"/>
  <path class="conn-o" d="M290 78 L290 400"/>
  <path class="conn-o" d="M490 78 L490 400"/>
  <path class="conn-o" d="M690 78 L690 400"/>

  <!-- Les deux chargements, sur le même horodatage -->
  <text class="d" x="300" y="104" text-anchor="middle">load — the board, and updatedAt = T0</text>
  <path class="conn" d="M490 110 L110 110" marker-end="url(#arrow)"/>
  <text class="d" x="390" y="140" text-anchor="middle">load — same board, same T0</text>
  <path class="conn" d="M490 146 L290 146" marker-end="url(#arrow)"/>

  <!-- A sauvegarde : la condition tient -->
  <text class="a" x="24" y="184">FIRST SAVE</text>
  <text class="m" x="300" y="184" text-anchor="middle">PUT { document, baseUpdatedAt: T0 }</text>
  <path class="conn-a" d="M110 190 L490 190" marker-end="url(#arrow-a)"/>
  <text class="m" x="590" y="208" text-anchor="middle">UPDATE … WHERE updatedAt = T0</text>
  <path class="conn" d="M490 214 L690 214" marker-end="url(#arrow)"/>
  <text class="m ok" x="590" y="232" text-anchor="middle">1 row — now T1</text>
  <path class="conn" d="M690 238 L490 238" marker-end="url(#arrow)"/>
  <text class="d ok" x="300" y="256" text-anchor="middle">saved — new base T1</text>
  <path class="conn" d="M490 262 L110 262" marker-end="url(#arrow)"/>

  <!-- B sauvegarde : la condition ne tient plus -->
  <text class="a" x="24" y="300">SECOND SAVE</text>
  <text class="m" x="390" y="300" text-anchor="middle">PUT { …, baseUpdatedAt: T0 }</text>
  <path class="conn-a" d="M290 306 L490 306" marker-end="url(#arrow-a)"/>
  <text class="m" x="590" y="324" text-anchor="middle">UPDATE … WHERE updatedAt = T0</text>
  <path class="conn" d="M490 330 L690 330" marker-end="url(#arrow)"/>
  <text class="m no" x="590" y="348" text-anchor="middle">0 rows — T0 is gone</text>
  <path class="conn" d="M690 354 L490 354" marker-end="url(#arrow)"/>
  <text class="m no" x="390" y="372" text-anchor="middle">409 BOARD_CONFLICT (T1)</text>
  <path class="conn" d="M490 378 L290 378" marker-end="url(#arrow)"/>

  <!-- Ce que B doit trancher -->
  <path class="conn" d="M290 400 L290 410 L160 410 L160 420" marker-end="url(#arrow)"/>
  <path class="conn" d="M290 400 L290 410 L430 410 L430 420" marker-end="url(#arrow)"/>

  <rect class="panel" x="35" y="420" width="250" height="46" rx="9"/>
  <text class="l" x="160" y="442" text-anchor="middle">Reload the board</text>
  <text class="d" x="160" y="458" text-anchor="middle">remount on T1, local edits lost</text>

  <rect class="panel-w" x="305" y="420" width="250" height="46" rx="9"/>
  <text class="l" x="430" y="442" text-anchor="middle">Save anyway</text>
  <text class="d" x="430" y="458" text-anchor="middle">rewrite on top of T1</text>

  <text class="d" x="400" y="488" text-anchor="middle">Autosave stops the moment the 409 arrives: nothing more is sent until the editor chooses, and the board never reloads itself.</text>
</svg>
