<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="spc-title spc-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="spc-title">Comparing 3D models, inside and across versions</title>
  <desc id="spc-desc">The sibling models of the version and the models checked in the Compare selector of the header are loaded into one Three.js scene, normalised to the same size and standing on the same floor. One tab active cross-fades between them; Show all lays them out side by side.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="330" rx="10"/>

  <text class="d" x="24" y="30">WHERE THE MODELS COME FROM</text>
  <text class="d" x="548" y="30">HOW THEY ARE SHOWN</text>

  <!-- Sources -->
  <rect class="panel" x="24" y="54" width="228" height="64" rx="9"/>
  <text class="l" x="40" y="78">Sibling 3D media</text>
  <text class="d" x="40" y="95">the other models of this version</text>
  <text class="d" x="40" y="110">one tab each, in the header</text>

  <rect class="panel" x="24" y="142" width="228" height="64" rx="9"/>
  <text class="l" x="40" y="166">Other versions</text>
  <text class="d" x="40" y="183">checked in the Compare… selector</text>
  <text class="d" x="40" y="198">same task or asset — v003 vs v002</text>

  <path class="conn-a" d="M252 86 L272 86 L272 118 L292 118" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M252 174 L272 174 L272 154 L292 154" marker-end="url(#arrow-a)"/>

  <!-- Scène commune -->
  <rect class="panel-a" x="292" y="90" width="216" height="92" rx="9"/>
  <text class="t" x="400" y="114" text-anchor="middle">One scene</text>
  <text class="d" x="400" y="132" text-anchor="middle">every model normalised to</text>
  <text class="d" x="400" y="147" text-anchor="middle">the same size, standing on</text>
  <text class="d" x="400" y="162" text-anchor="middle">the same floor, one camera</text>

  <path class="conn" d="M508 118 L528 118 L528 94 L548 94" marker-end="url(#arrow)"/>
  <path class="conn" d="M508 154 L528 154 L528 182 L548 182" marker-end="url(#arrow)"/>

  <!-- États de sortie -->
  <rect class="panel" x="548" y="62" width="228" height="64" rx="9"/>
  <text class="l" x="564" y="86">One tab active — A/B</text>
  <text class="d" x="564" y="103">the chosen model fades in, the</text>
  <text class="d" x="564" y="118">others fade out and slide back</text>

  <rect class="panel" x="548" y="150" width="228" height="64" rx="9"/>
  <text class="l" x="564" y="174">Show all — side by side</text>
  <text class="d" x="564" y="191">every model fades in and slides</text>
  <text class="d" x="564" y="206">apart on the floor plane</text>

  <!-- Deux choses à savoir -->
  <rect class="band" x="24" y="236" width="752" height="70" rx="10"/>
  <text class="a" x="44" y="260">TWO THINGS TO KNOW</text>
  <text class="d" x="44" y="279">Compared models are loaded raw — the ReView override saved on each of them is not replayed.</text>
  <text class="d" x="44" y="296">The tabs disappear while an editing tool is armed; the Compare… selector stays available.</text>
</svg>
