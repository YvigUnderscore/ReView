<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="twofa-states-title twofa-states-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="twofa-states-title">Two-factor authentication: every state, and the way out of it</title>
  <desc id="twofa-states-desc">Enabling generates a secret and shows a QR code; confirming a six-digit code turns it on and hands over ten backup codes, shown once. Disabling asks for your password and wipes the secret with every remaining code. While it is on, a correct password only opens a short-lived challenge, which a TOTP code or a single-use backup code turns into a session.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="440" rx="10"/>

  <text class="d" x="30" y="32">TURNING IT ON, AND OFF AGAIN</text>

  <rect class="panel" x="30" y="50" width="150" height="46" rx="9"/>
  <text class="l" x="105" y="72" text-anchor="middle">Off</text>
  <text class="d" x="105" y="88" text-anchor="middle">no secret, no codes</text>

  <path class="conn-a" d="M180 73 L286 73" marker-end="url(#arrow-a)"/>
  <text class="a" x="233" y="64" text-anchor="middle">Enable 2FA</text>
  <text class="d" x="233" y="90" text-anchor="middle">QR or manual key</text>

  <rect class="panel-w" x="290" y="50" width="220" height="46" rx="9"/>
  <text class="l" x="400" y="72" text-anchor="middle">Enrolling</text>
  <text class="d" x="400" y="88" text-anchor="middle">secret generated, not enforced yet</text>

  <path class="conn-a" d="M510 73 L616 73" marker-end="url(#arrow-a)"/>
  <text class="a" x="563" y="64" text-anchor="middle">Confirm 6 digits</text>

  <rect class="panel-a" x="620" y="50" width="150" height="46" rx="9"/>
  <text class="t" x="695" y="72" text-anchor="middle">On</text>
  <text class="d" x="695" y="88" text-anchor="middle">a code at every sign-in</text>

  <!-- La même transition livre les codes de secours, une fois pour toutes -->
  <path class="conn-a" d="M563 73 L563 110 L520 110 L520 136" marker-end="url(#arrow-a)"/>
  <rect class="panel-w" x="400" y="140" width="240" height="46" rx="9"/>
  <text class="l" x="520" y="162" text-anchor="middle">10 backup codes, shown once</text>
  <text class="d" x="520" y="178" text-anchor="middle">the server keeps only their hashes</text>

  <!-- Retour à l'état Off -->
  <path class="conn" d="M695 96 L695 216 L105 216 L105 96" marker-end="url(#arrow)"/>
  <text class="l" x="400" y="210" text-anchor="middle">Disable — your password, not a code</text>
  <text class="d" x="400" y="232" text-anchor="middle">the secret and every remaining code are wiped</text>

  <text class="d" x="30" y="266">SIGNING IN WHILE IT IS ON</text>

  <rect class="panel" x="30" y="282" width="150" height="46" rx="9"/>
  <text class="l" x="105" y="304" text-anchor="middle">Password accepted</text>
  <text class="d" x="105" y="320" text-anchor="middle">or SSO returned you</text>

  <path class="conn" d="M180 305 L246 305" marker-end="url(#arrow)"/>

  <rect class="panel-w" x="250" y="282" width="180" height="46" rx="9"/>
  <text class="l" x="340" y="304" text-anchor="middle">Challenge</text>
  <text class="d" x="340" y="320" text-anchor="middle">a short-lived token</text>

  <path class="conn-a" d="M430 294 L626 294" marker-end="url(#arrow-a)"/>
  <text class="a" x="528" y="288" text-anchor="middle">TOTP code</text>
  <path class="conn" d="M430 320 L626 320" marker-end="url(#arrow)"/>
  <text class="d" x="528" y="314" text-anchor="middle">or a backup code — used once</text>

  <rect class="panel-a" x="630" y="282" width="140" height="46" rx="9"/>
  <text class="t" x="700" y="304" text-anchor="middle">Session opens</text>
  <text class="d" x="700" y="320" text-anchor="middle">the usual tokens</text>

  <path class="conn-o" d="M340 328 L340 356 L105 356 L105 328" marker-end="url(#arrow)"/>
  <text class="d" x="350" y="352">the challenge expires — sign in again from the beginning</text>

  <text class="d" x="30" y="392">15 verification attempts per 15 minutes. An SSO sign-in enters this lane too: the challenge is not skipped.</text>
  <text class="m" x="30" y="412">Audit trail: TWOFA_ENABLE · TWOFA_DISABLE · TWOFA_FAIL · TWOFA_BACKUP_USED</text>
</svg>
