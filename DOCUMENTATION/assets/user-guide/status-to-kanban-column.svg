<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">How a task status becomes a kanban column</title>
  <desc id="fig-desc">The project's own status list supplies the columns; a project without a list falls back to the six built-in values. Each status carries a legacyStatus that files its column under one of five families, and a task whose status is not offered by the project is filed under the first column that carries the same built-in value.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="476" rx="10"/>

  <text class="d" x="24" y="30">WHERE A COLUMN COMES FROM</text>
  <rect class="band" x="506" y="44" width="270" height="330" rx="10"/>
  <text class="d" x="641" y="66" text-anchor="middle">IN THE LIST'S OWN ORDER</text>

  <!-- Sources : la liste du projet, le repli, et un statut absent de la liste -->
  <rect class="panel-a" x="24" y="80" width="224" height="46" rx="9"/>
  <text class="t" x="136" y="102" text-anchor="middle">The project's status list</text>
  <text class="d" x="136" y="118" text-anchor="middle">its own names and colours</text>

  <rect class="panel-o" x="24" y="154" width="224" height="46" rx="9"/>
  <text class="l" x="136" y="176" text-anchor="middle">No status list</text>
  <text class="d" x="136" y="192" text-anchor="middle">the six built-in values</text>

  <rect class="panel-o" x="24" y="228" width="224" height="46" rx="9"/>
  <text class="l" x="136" y="250" text-anchor="middle">Status not in the list</text>
  <text class="d" x="136" y="266" text-anchor="middle">inherited, or since removed</text>

  <!-- Ce qui décide de la famille -->
  <path class="conn" d="M248 103 L272 103 L272 140 L296 140" marker-end="url(#arrow)"/>
  <path class="conn" d="M248 177 L272 177 L272 140 L296 140" marker-end="url(#arrow)"/>
  <path class="conn" d="M248 251 L296 251" marker-end="url(#arrow)"/>

  <rect class="panel" x="296" y="117" width="180" height="46" rx="9"/>
  <text class="l" x="386" y="139" text-anchor="middle">legacyStatus</text>
  <text class="d" x="386" y="155" text-anchor="middle">sets the column's family</text>

  <rect class="panel" x="296" y="228" width="180" height="46" rx="9"/>
  <text class="l" x="386" y="250" text-anchor="middle">The task's own value</text>
  <text class="d" x="386" y="266" text-anchor="middle">picks the first match</text>

  <path class="conn" d="M476 140 L492 140"/>
  <path class="conn" d="M476 251 L492 251"/>
  <path class="conn" d="M492 103 L492 335"/>

  <!-- Les cinq familles du board -->
  <path class="conn-a" d="M492 103 L522 103" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M492 161 L522 161" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M492 219 L522 219" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M492 277 L522 277" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M492 335 L522 335" marker-end="url(#arrow-a)"/>

  <rect class="panel" x="522" y="80" width="238" height="46" rx="9"/>
  <text class="l" x="641" y="102" text-anchor="middle">To do</text>
  <text class="m" x="641" y="118" text-anchor="middle">TODO</text>

  <rect class="panel" x="522" y="138" width="238" height="46" rx="9"/>
  <text class="l" x="641" y="160" text-anchor="middle">In progress</text>
  <text class="m" x="641" y="176" text-anchor="middle">IN_PROGRESS</text>

  <rect class="panel" x="522" y="196" width="238" height="46" rx="9"/>
  <text class="l" x="641" y="218" text-anchor="middle">In review</text>
  <text class="m" x="641" y="234" text-anchor="middle">PENDING_REVIEW</text>

  <rect class="panel" x="522" y="254" width="238" height="46" rx="9"/>
  <text class="l" x="641" y="276" text-anchor="middle">Done</text>
  <text class="m" x="641" y="292" text-anchor="middle">APPROVED</text>

  <rect class="panel" x="522" y="312" width="238" height="46" rx="9"/>
  <text class="l" x="641" y="334" text-anchor="middle">Set aside</text>
  <text class="m" x="641" y="350" text-anchor="middle">RETAKE, REJECTED</text>

  <text class="d" x="400" y="406" text-anchor="middle">Dropping a card writes the exact status of its column — the list entry when there is one, the built-in value otherwise.</text>
  <text class="d" x="400" y="426" text-anchor="middle">A card whose built-in value matches no column at all is not drawn: keep one entry for each of the six.</text>
  <text class="d" x="400" y="446" text-anchor="middle">A status the studio flags inactive keeps its column here — it is the Production gauges that leave it out.</text>
</svg>
