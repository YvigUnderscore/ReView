<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">From a key to a saved move</title>
  <desc id="fig-desc">A key is written in one of three ways — the K shortcut, the transport diamond, or auto-key while flying — then edited in the Curves drawer, and finally either published as the media presentation, replayed for everyone, or attached to a comment, which still needs a word of text to be sent.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="330" rx="10"/>

  <text class="d" x="24" y="28">WRITE A KEY — MANAGERS ONLY</text>

  <rect class="panel" x="24" y="40" width="200" height="40" rx="9"/>
  <text class="l" x="124" y="65" text-anchor="middle">Press K</text>

  <rect class="panel" x="24" y="90" width="200" height="40" rx="9"/>
  <text class="l" x="124" y="115" text-anchor="middle">The transport diamond</text>

  <rect class="panel" x="24" y="140" width="200" height="52" rx="9"/>
  <text class="l" x="124" y="162" text-anchor="middle">Auto-key armed</text>
  <text class="d" x="124" y="180" text-anchor="middle">every move writes a key</text>

  <path class="conn" d="M224 60 L268 60 L268 116 L296 116" marker-end="url(#arrow)"/>
  <path class="conn" d="M224 110 L268 110" marker-end="url(#arrow)"/>
  <path class="conn" d="M224 166 L268 166 L268 122 L296 122" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="300" y="86" width="196" height="60" rx="9"/>
  <text class="t" x="398" y="110" text-anchor="middle">The Curves drawer</text>
  <text class="d" x="398" y="128" text-anchor="middle">retime, tangents, duration</text>

  <text class="d" x="300" y="172">eight channels · 256 keys each</text>
  <text class="d" x="300" y="190">playable from two keys at two times</text>

  <path class="conn-a" d="M496 104 L536 104 L536 68 L568 68" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M496 128 L536 128 L536 208 L568 208" marker-end="url(#arrow-a)"/>

  <text class="d" x="572" y="28">SAVE IT, OR IT GOES NOWHERE</text>

  <rect class="panel-a" x="572" y="40" width="204" height="72" rx="9"/>
  <text class="t" x="674" y="64" text-anchor="middle">Publish the presentation</text>
  <text class="d" x="674" y="82" text-anchor="middle">stored with the media and</text>
  <text class="d" x="674" y="98" text-anchor="middle">replayed for every spectator</text>

  <rect class="panel" x="572" y="180" width="204" height="72" rx="9"/>
  <text class="t" x="674" y="204" text-anchor="middle">Attach to a comment</text>
  <text class="d" x="674" y="222" text-anchor="middle">travels with that note,</text>
  <text class="d" x="674" y="238" text-anchor="middle">replayed when it is selected</text>

  <rect class="panel-w" x="572" y="264" width="204" height="46" rx="9"/>
  <text class="a" x="674" y="284" text-anchor="middle">TYPE A WORD TOO</text>
  <text class="d" x="674" y="300" text-anchor="middle">the move alone will not send</text>

  <path class="conn" d="M674 252 L674 264" marker-end="url(#arrow)"/>

  <rect class="band" x="24" y="212" width="472" height="98" rx="9"/>
  <text class="a" x="44" y="236">SELECTING A COMMENT THAT CARRIES A MOVE</text>
  <text class="d" x="44" y="258">loads it into the transport and plays it, replacing whatever</text>
  <text class="d" x="44" y="276">you were authoring and clearing its undo history —</text>
  <text class="d" x="44" y="294">publish your presentation before you go reading the thread</text>
</svg>
