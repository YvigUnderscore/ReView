<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="projection-title projection-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="projection-title">Two weekly series, one unit, and why the projected end is never shown alone</title>
  <desc id="projection-desc">The tab counts two separate weekly series over the observation window: media published per week, which is the output drawn on screen, and tasks crossed per week, which is the velocity. Only the velocity divides the remainder, because the remainder counts tasks too. The projected end is now plus the ceiling of remaining divided by the rate, times seven, in days. When there is nothing left, nothing crossed or nothing counted at all, the panel says which of the three it is instead of inventing a date.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="340" rx="10"/>

  <text class="d" x="24" y="30">HOW THE PROJECTED END DATE IS BUILT</text>

  <rect class="panel" x="24" y="48" width="330" height="58" rx="9"/>
  <text class="t" x="40" y="72">Media published per week</text>
  <text class="d" x="40" y="90">output — the bars drawn on screen</text>

  <rect class="panel-a" x="24" y="118" width="330" height="58" rx="9"/>
  <text class="t" x="40" y="142">Tasks crossed per week</text>
  <text class="d" x="40" y="160">velocity — first approval on the task</text>

  <text class="d no" x="40" y="198">The two series are never divided by one another.</text>

  <rect class="panel" x="24" y="212" width="330" height="58" rx="9"/>
  <text class="t" x="40" y="236">remaining = tasks not done</text>
  <text class="d" x="40" y="254">inactive statuses excluded</text>

  <path class="conn-a" d="M354 147 L372 147 L372 194"/>
  <path class="conn" d="M354 241 L372 241 L372 194"/>
  <path class="conn-a" d="M372 194 L614 194" marker-end="url(#arrow-a)"/>
  <text class="m" x="400" y="188">now + ceil(remaining ÷ rate × 7)</text>

  <rect class="panel-d" x="420" y="48" width="356" height="110" rx="9"/>
  <text class="t" x="440" y="72">No date — and it says which</text>
  <text class="d" x="440" y="96">nothing left to do</text>
  <text class="d" x="440" y="116">no task crossed over the window</text>
  <text class="d" x="440" y="136">nothing counted over the window</text>

  <rect class="panel-a" x="620" y="170" width="156" height="48" rx="9"/>
  <text class="t" x="698" y="192" text-anchor="middle">Projected end</text>
  <text class="d" x="698" y="208" text-anchor="middle">at the current pace</text>

  <text class="d" x="400" y="298" text-anchor="middle">The remainder counts tasks, so the rate has to count tasks as well.</text>
  <text class="d" x="400" y="320" text-anchor="middle">Observation window: 4, 8, 13 or 26 ISO weeks starting Monday, empty weeks kept.</text>
</svg>
