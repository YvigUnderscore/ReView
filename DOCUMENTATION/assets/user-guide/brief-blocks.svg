<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="title desc">
  <title id="title">Each block of the brief editor corresponds to one piece of the markdown that is stored</title>
  <desc id="desc">Four editor blocks on the left — a section, a text block, a references board and a gauge — each mapped by an arrow to the markdown it writes on the right: a heading, a paragraph, a refs directive with image keys, and a progress directive.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="372" rx="10"/>

  <text class="t" x="32" y="38">What you compose</text>
  <text class="d" x="32" y="56">Blocks, in the dialog</text>
  <text class="t" x="440" y="38">What is stored</text>
  <text class="d" x="440" y="56">Markdown, in the database</text>

  <rect class="panel" x="32" y="74" width="336" height="46" rx="9"/>
  <text class="l" x="48" y="94">Section</text>
  <text class="d" x="48" y="110">Brief</text>
  <rect class="panel" x="440" y="74" width="328" height="46" rx="9"/>
  <text class="m" x="456" y="102">## Brief</text>
  <path class="conn" d="M368 97 L440 97" marker-end="url(#arrow)"/>

  <rect class="panel" x="32" y="132" width="336" height="46" rx="9"/>
  <text class="l" x="48" y="152">Text</text>
  <text class="d" x="48" y="168">Night mood, neon signs.</text>
  <rect class="panel" x="440" y="132" width="328" height="46" rx="9"/>
  <text class="m" x="456" y="160">Night mood, neon signs.</text>
  <path class="conn" d="M368 155 L440 155" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="32" y="190" width="336" height="66" rx="9"/>
  <text class="l" x="48" y="212">References</text>
  <text class="d" x="48" y="228">6 images, grid of 3</text>
  <text class="a" x="48" y="246">uploaded into the brief</text>
  <rect class="panel-a" x="440" y="190" width="328" height="66" rx="9"/>
  <text class="m" x="456" y="210">::refs grid cols=3 h=180</text>
  <text class="m" x="456" y="228">![Neon](note-images/shot/12/…)</text>
  <text class="m" x="456" y="246">::end</text>
  <path class="conn-a" d="M368 223 L440 223" marker-end="url(#arrow-a)"/>

  <rect class="panel" x="32" y="268" width="336" height="46" rx="9"/>
  <text class="l" x="48" y="288">Gauge</text>
  <text class="d" x="48" y="304">Animation, 60%</text>
  <rect class="panel" x="440" y="268" width="328" height="46" rx="9"/>
  <text class="m" x="456" y="296">::progress Animation 60</text>
  <path class="conn" d="M368 291 L440 291" marker-end="url(#arrow)"/>

  <text class="d" x="32" y="344">The editor reads and writes this syntax; nobody has to type it. An image stores its key,</text>
  <text class="d" x="32" y="360">never a signed URL — the link would expire long before the brief is read again.</text>
</svg>
