<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="imp-title imp-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="imp-title">The three steps of a CSV import, and where the writing happens</title>
  <desc id="imp-desc">Step one gives the dialog a file, dropped, picked or pasted, with a server-generated template as a reference. Step two asks for a preview: the server answers with the column matching, which the coordinator can override. Step three shows what would be created, changed or left alone, offers the whole report as a CSV download, and only then enables the Import button, which writes everything in one bounded transaction. Nothing is written before that point, and an archived project refuses the import at commit time.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="620" rx="10"/>

  <rect class="band" x="15" y="88" width="765" height="84" rx="9"/>
  <rect class="band" x="15" y="180" width="765" height="116" rx="9"/>
  <rect class="band" x="15" y="304" width="765" height="292" rx="9"/>

  <path class="conn-o" d="M95 78 L95 600"/>
  <path class="conn-o" d="M295 78 L295 600"/>
  <path class="conn-o" d="M505 78 L505 600"/>
  <path class="conn-o" d="M700 78 L700 600"/>

  <rect class="panel-a" x="15" y="44" width="160" height="34" rx="9"/>
  <text class="l" x="95" y="66" text-anchor="middle">Coordinator</text>
  <rect class="panel" x="215" y="44" width="160" height="34" rx="9"/>
  <text class="l" x="295" y="66" text-anchor="middle">Import dialog</text>
  <rect class="panel" x="425" y="44" width="160" height="34" rx="9"/>
  <text class="l" x="505" y="66" text-anchor="middle">Server</text>
  <rect class="panel" x="620" y="44" width="160" height="34" rx="9"/>
  <text class="l" x="700" y="66" text-anchor="middle">Project</text>

  <text class="d" x="26" y="106">STEP 1 — GIVE IT THE FILE</text>
  <text class="l" x="195" y="130" text-anchor="middle">drop, pick or paste the file</text>
  <path class="conn" d="M95 136 L289 136" marker-end="url(#arrow)"/>
  <text class="l" x="400" y="158" text-anchor="middle">Template — every column, 2 examples</text>
  <path class="conn" d="M505 164 L301 164" marker-end="url(#arrow)"/>

  <text class="d" x="26" y="198">STEP 2 — CHECK THE COLUMNS</text>
  <text class="l" x="400" y="222" text-anchor="middle">POST import-csv, commit = false</text>
  <path class="conn" d="M295 228 L499 228" marker-end="url(#arrow)"/>
  <text class="l" x="400" y="252" text-anchor="middle">your header → our field, or Ignored</text>
  <path class="conn" d="M505 258 L301 258" marker-end="url(#arrow)"/>
  <text class="l" x="195" y="282" text-anchor="middle">override any mapping</text>
  <path class="conn" d="M95 288 L289 288" marker-end="url(#arrow)"/>

  <text class="d" x="26" y="322">STEP 3 — READ THE PREVIEW, THEN IMPORT</text>
  <text class="l" x="400" y="350" text-anchor="middle">created · changed · unchanged</text>
  <path class="conn" d="M505 356 L301 356" marker-end="url(#arrow)"/>
  <text class="d" x="400" y="372" text-anchor="middle">rejected rows carry their file line</text>
  <text class="l" x="195" y="396" text-anchor="middle">Report: every warning as CSV</text>
  <path class="conn" d="M295 402 L101 402" marker-end="url(#arrow)"/>
  <text class="l" x="195" y="424" text-anchor="middle">press Import</text>
  <path class="conn" d="M95 430 L289 430" marker-end="url(#arrow)"/>

  <rect class="panel-d" x="15" y="444" width="765" height="30" rx="9"/>
  <text class="t no" x="397" y="464" text-anchor="middle">nothing is written before this point</text>

  <text class="l" x="400" y="492" text-anchor="middle">commit = true</text>
  <path class="conn-a" d="M295 498 L499 498" marker-end="url(#arrow-a)"/>
  <text class="l" x="602" y="520" text-anchor="middle">one transaction — all or nothing</text>
  <path class="conn-a" d="M505 526 L694 526" marker-end="url(#arrow-a)"/>

  <rect class="panel-w" x="420" y="540" width="360" height="44" rx="9"/>
  <text class="l" x="436" y="562">An archived project refuses the import (403)</text>
  <text class="d" x="436" y="578">checked at commit, not at preview</text>
</svg>
