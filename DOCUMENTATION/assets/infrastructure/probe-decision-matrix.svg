<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 434" width="800" height="434" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Four ways to ask whether a ReView instance is working</title>
  <desc id="fig-desc">Liveness touches nothing and is meant for the container healthcheck. Readiness touches Postgres, Redis and MinIO under a two-second timeout and is the probe for external monitoring. The admin system screen reports the same three dependencies but has no timeout and is for a human. docker compose ps proves nothing about the application. On the public domain the plain health path is answered by the single-page application.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="434" rx="10"/>

  <!-- En-tête de colonnes -->
  <rect class="band" x="20" y="10" width="760" height="26" rx="8"/>
  <text class="d" x="32" y="27">PROBE</text>
  <text class="d" x="222" y="27">QUESTION</text>
  <text class="d" x="372" y="27">WHAT IT TOUCHES</text>
  <text class="d" x="557" y="27">COST</text>
  <text class="d" x="662" y="27">USE IT FOR</text>

  <!-- Ligne 1 : vivacité -->
  <rect class="panel" x="20" y="44" width="760" height="72" rx="9"/>
  <text class="m" x="32" y="68">GET /health</text>
  <text class="m" x="32" y="85">GET /health/live</text>
  <text class="l" x="222" y="68">Is the process</text>
  <text class="l" x="222" y="85">alive?</text>
  <text class="d" x="372" y="68">Nothing. No I/O at</text>
  <text class="d" x="372" y="85">all, so it never fails</text>
  <text class="d" x="372" y="102">on a dependency.</text>
  <text class="d" x="557" y="68">free</text>
  <text class="d" x="557" y="85">no auth</text>
  <text class="d" x="662" y="68">The container</text>
  <text class="d" x="662" y="85">healthcheck.</text>

  <!-- Ligne 2 : disponibilité (la bonne réponse pour une supervision) -->
  <rect class="panel-a" x="20" y="124" width="760" height="72" rx="9"/>
  <text class="m" x="32" y="148">GET /health/ready</text>
  <text class="d" x="32" y="165">and /api/health/ready</text>
  <text class="l" x="222" y="148">Can it actually</text>
  <text class="l" x="222" y="165">serve?</text>
  <text class="d" x="372" y="148">Postgres SELECT 1,</text>
  <text class="d" x="372" y="165">Redis PING, MinIO</text>
  <text class="d" x="372" y="182">statObject. 503 if not.</text>
  <text class="d" x="557" y="148">2 s per check,</text>
  <text class="d" x="557" y="165">memoised 5 s,</text>
  <text class="d" x="557" y="182">no auth</text>
  <text class="a" x="662" y="148">Monitors and</text>
  <text class="a" x="662" y="165">load balancers.</text>

  <!-- Ligne 3 : écran d'administration -->
  <rect class="panel" x="20" y="204" width="760" height="72" rx="9"/>
  <text class="m" x="32" y="228">GET /api/admin/system</text>
  <text class="l" x="222" y="228">The same three,</text>
  <text class="l" x="222" y="245">plus host metrics.</text>
  <text class="d" x="372" y="228">Postgres, Redis and</text>
  <text class="d" x="372" y="245">MinIO, with no</text>
  <text class="d" x="372" y="262">timeout of its own.</text>
  <text class="d" x="557" y="228">can hang</text>
  <text class="d" x="557" y="245">ADMIN only</text>
  <text class="d" x="662" y="228">A human looking</text>
  <text class="d" x="662" y="245">at a screen.</text>

  <!-- Ligne 4 : l'état du conteneur ne dit rien de l'application -->
  <rect class="panel" x="20" y="284" width="760" height="72" rx="9"/>
  <text class="m" x="32" y="308">docker compose ps</text>
  <text class="l" x="222" y="308">Is the container</text>
  <text class="l" x="222" y="325">up?</text>
  <text class="d" x="372" y="308">Whatever HEALTH_PATH</text>
  <text class="d" x="372" y="325">points at, which is</text>
  <text class="d" x="372" y="342">nothing by default.</text>
  <text class="d" x="557" y="308">free</text>
  <text class="d" x="662" y="308">Never as proof</text>
  <text class="d" x="662" y="325">the stack works.</text>

  <!-- Le piège du domaine public -->
  <rect class="panel-d" x="20" y="368" width="760" height="52" rx="9"/>
  <text class="l" x="34" y="392">On the public domain, GET /health is answered by the SPA: 200 HTML whatever the API is doing.</text>
  <text class="d" x="34" y="409">The TLS front only proxies /api/, /socket.io/ and signed /review/. Monitor /api/health/ready instead.</text>
</svg>
