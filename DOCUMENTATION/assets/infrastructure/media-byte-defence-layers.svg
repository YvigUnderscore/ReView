    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="570" rx="10"/>

  <text class="d" x="28" y="30">WHAT AN UPLOADED BYTE HAS TO GET PAST, FROM THE OUTSIDE IN</text>
  <text class="d" x="634" y="30">REFUSAL</text>

  <rect class="panel" x="20" y="42" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="63">1</text>
  <text class="l" x="52" y="63">Transport</text>
  <text class="d" x="52" y="80">TLS-terminating nginx; every host port removed from frontend, backend and minio; helmet</text>
  <text class="m" x="766" y="69" text-anchor="end">TLS + CSP</text>

  <rect class="panel" x="20" y="94" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="115">2</text>
  <text class="l" x="52" y="115">Rate limit</text>
  <text class="d" x="52" y="132">Redis counters over a 15-minute window, keyed on the account with an IP fallback</text>
  <text class="m" x="766" y="121" text-anchor="end">429</text>

  <rect class="panel" x="20" y="146" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="167">3</text>
  <text class="l" x="52" y="167">Authentication</text>
  <text class="d" x="52" y="184">A JWT with no kind claim and a live session; revocation is effective within 30 s</text>
  <text class="m" x="766" y="173" text-anchor="end">401 SESSION_REVOKED</text>

  <rect class="panel" x="20" y="198" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="219">4</text>
  <text class="l" x="52" y="219">Authorization</text>
  <text class="d" x="52" y="236">Global role, project membership and effective project role; a published media is frozen</text>
  <text class="m" x="766" y="225" text-anchor="end">403 PUBLISHED_LOCKED</text>

  <rect class="panel" x="20" y="250" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="271">5</text>
  <text class="l" x="52" y="271">Admission</text>
  <text class="d" x="52" y="288">Zod on body, query and params; declared size against the project quota; naming rule</text>
  <text class="m" x="766" y="277" text-anchor="end">400 NAMING_REJECTED</text>

  <rect class="panel-a" x="20" y="302" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="323">6</text>
  <text class="l" x="52" y="323">Content</text>
  <text class="d" x="52" y="340">Magic bytes at finalize, real object size re-checked, optional ClamAV INSTREAM scan</text>
  <text class="m" x="766" y="329" text-anchor="end">400 INVALID_FILE</text>

  <rect class="panel" x="20" y="354" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="375">7</text>
  <text class="l" x="52" y="375">Archives</text>
  <text class="d" x="52" y="392">20 000 entries, 8 GiB uncompressed, ratio 200; the converter is killed at its timeout</text>
  <text class="d" x="766" y="381" text-anchor="end">extraction aborted</text>

  <rect class="panel" x="20" y="406" width="760" height="46" rx="9"/>
  <text class="a" x="34" y="427">8</text>
  <text class="l" x="52" y="427">Serving</text>
  <text class="d" x="52" y="444">Presigned URL issued after the RBAC check, Content-Type fixed server-side, sandbox CSP</text>
  <text class="m" x="766" y="433" text-anchor="end">sandbox</text>

  <rect class="panel-w" x="20" y="464" width="760" height="88" rx="9"/>
  <text class="l" x="34" y="486">Outbound requests, the other direction</text>
  <text class="d" x="34" y="506">A webhook URL is validated at creation and re-checked after DNS resolution at delivery time;</text>
  <text class="d" x="34" y="522">redirects are refused, each delivery times out at 10 s. The ShotGrid client refuses non-HTTPS</text>
  <text class="d" x="34" y="538">and non-public addresses, and SHOTGRID_INSECURE_HOSTS is logged as a warning at every boot.</text>
</svg>
