<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="nlp-title nlp-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="nlp-title">Which nginx block handles a /review/ request</title>
  <desc id="nlp-desc">A segment matches the regex location and is cached; any other presigned or S3-authenticated request goes to the prefix location and straight to MinIO; a plain navigation is redirected internally to the named location that serves the application.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="400" rx="10"/>

  <text class="d" x="20" y="32">A REQUEST ARRIVES</text>
  <text class="d" x="310" y="32">NGINX PICKS ITS HANDLER, IN THIS ORDER</text>

  <rect class="panel-o" x="20" y="52" width="256" height="46" rx="9"/>
  <text class="m" x="32" y="72">/review/derived/42/hls/720p_000.ts</text>
  <text class="d" x="32" y="88">?X-Amz-Signature=…</text>
  <path class="conn-a" d="M276 75 L310 75" marker-end="url(#arrow-a)"/>

  <rect class="panel-o" x="20" y="160" width="256" height="46" rx="9"/>
  <text class="m" x="32" y="180">/review/projects/7/plate.mov</text>
  <text class="d" x="32" y="196">?X-Amz-Signature=…</text>
  <path class="conn" d="M276 183 L310 183" marker-end="url(#arrow)"/>

  <rect class="panel-o" x="20" y="266" width="256" height="46" rx="9"/>
  <text class="m" x="32" y="286">/review/a1b2c3d4</text>
  <text class="d" x="32" y="302">no query, no auth header</text>
  <path class="conn" d="M276 289 L310 289" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="310" y="40" width="470" height="92" rx="9"/>
  <text class="t" x="326" y="64">1 — regex location, wins over any prefix</text>
  <text class="m" x="326" y="82">location ~ ^/review/derived/[0-9]+/hls/[^/]+\.(ts|m4s)$</text>
  <text class="d" x="326" y="100">proxy_cache review_hls (2 GB, valid 2 h), proxy_cache_lock on</text>
  <text class="d" x="326" y="118">proxy_buffering on — nginx never fills its cache unbuffered</text>

  <rect class="panel" x="310" y="146" width="470" height="92" rx="9"/>
  <text class="t" x="326" y="170">2 — prefix location, everything else under the bucket</text>
  <text class="m" x="326" y="188">location /review/</text>
  <text class="d" x="326" y="206">guarded by $review_to_minio: a presigned query or an S3 auth header</text>
  <text class="d" x="326" y="224">proxy_buffering off for uploads and range reads, CSP: sandbox</text>

  <rect class="panel" x="310" y="252" width="470" height="74" rx="9"/>
  <text class="t" x="326" y="276">3 — named location, the application page</text>
  <text class="m" x="326" y="294">location @review_spa</text>
  <text class="d" x="326" y="312">reached by return 418 from layer 2 — the SPA's own CSP applies</text>

  <rect class="panel-w" x="20" y="344" width="760" height="40" rx="9"/>
  <text class="l" x="36" y="368">The literal /review/ in layers 1 and 2 is the bucket name — adapt both if S3_BUCKET differs.</text>
</svg>
