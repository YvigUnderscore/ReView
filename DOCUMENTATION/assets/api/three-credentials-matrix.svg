<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 582" width="800" height="582" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">What each credential actually opens</title>
  <desc id="fig-desc">A matrix comparing the JWT session, the API token and the share session across eight rows: format, header, which surfaces they open, whether scopes are enforced, project binding, how they end, and who typically holds them. The API token column carries the caveat that the guard closing /api to tokens is written but not mounted.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="582" rx="10"/>

  <rect class="band" x="24" y="100" width="754" height="42" rx="6"/>
  <rect class="band" x="24" y="184" width="754" height="64" rx="6"/>
  <rect class="band" x="24" y="290" width="754" height="56" rx="6"/>
  <rect class="band" x="24" y="402" width="754" height="56" rx="6"/>

  <path class="conn-o" d="M362 96 L362 500"/>
  <path class="conn-o" d="M572 96 L572 500"/>

  <rect class="panel" x="156" y="40" width="202" height="52" rx="9"/>
  <text class="t" x="257" y="66" text-anchor="middle">JWT session</text>
  <text class="d" x="257" y="82" text-anchor="middle">the web app</text>

  <rect class="panel-w" x="366" y="40" width="202" height="52" rx="9"/>
  <text class="t" x="467" y="66" text-anchor="middle">API token</text>
  <text class="d" x="467" y="82" text-anchor="middle">scripts and integrations</text>

  <rect class="panel" x="576" y="40" width="202" height="52" rx="9"/>
  <text class="t" x="677" y="66" text-anchor="middle">Share session</text>
  <text class="d" x="677" y="82" text-anchor="middle">client share pages</text>

  <text class="l" x="24" y="125">Format</text>
  <text class="d" x="168" y="125">signed JWT, sid embedded</text>
  <text class="d" x="378" y="125">rvk_ + 40 hex, stored hashed</text>
  <text class="d" x="588" y="125">short JWT, kind = share</text>

  <text class="l" x="24" y="167">Header</text>
  <text class="m" x="168" y="167">Authorization: Bearer</text>
  <text class="m" x="378" y="167">Authorization: Bearer</text>
  <text class="m" x="588" y="167">X-Share-Auth</text>

  <text class="l" x="24" y="204">Opens /api</text>
  <text class="l" x="168" y="204">Yes</text>
  <text class="d" x="168" y="222">the whole web surface,</text>
  <text class="d" x="168" y="240">bounded by role + membership</text>
  <text class="l no" x="378" y="204">On paper, no</text>
  <text class="d" x="378" y="222">403 API_TOKEN_V1_ONLY — but</text>
  <text class="d" x="378" y="240">the guard is not mounted yet</text>
  <text class="l" x="588" y="204">No</text>
  <text class="d" x="588" y="222">only /api/client/:token</text>
  <text class="d" x="588" y="240">and its sub-routes</text>

  <text class="l" x="24" y="273">Opens /api/v1</text>
  <text class="l" x="168" y="273">Yes</text>
  <text class="l" x="378" y="273">Yes — its own surface</text>
  <text class="l" x="588" y="273">No</text>

  <text class="l" x="24" y="313">Scopes enforced</text>
  <text class="l" x="168" y="313">None</text>
  <text class="d" x="168" y="331">role and membership decide</text>
  <text class="l" x="378" y="313">Yes</text>
  <text class="d" x="378" y="331">requireScope, per v1 route</text>
  <text class="l" x="588" y="313">None</text>
  <text class="d" x="588" y="331">the link is VIEW or COMMENT</text>

  <text class="l" x="24" y="369">Project binding</text>
  <text class="l" x="168" y="369">n/a</text>
  <text class="d" x="168" y="387">memberships do the work</text>
  <text class="l" x="378" y="369">Optional projectId</text>
  <text class="d" x="378" y="387">checked by v1 routes only</text>
  <text class="l" x="588" y="369">The link's own scope</text>
  <text class="d" x="588" y="387">project, playlist or media</text>

  <text class="l" x="24" y="425">How it ends</text>
  <text class="l" x="168" y="425">Logout or revocation</text>
  <text class="d" x="168" y="443">within 30 s · expiry 7 d</text>
  <text class="l" x="378" y="425">DELETE the token</text>
  <text class="d" x="378" y="443">immediate · or expiresAt</text>
  <text class="l" x="588" y="425">Revoked or expired</text>
  <text class="d" x="588" y="443">view quota · 24 h session</text>

  <text class="l" x="24" y="483">Typical holder</text>
  <text class="d" x="168" y="483">a signed-in human</text>
  <text class="d" x="378" y="483">a farm node, a bot, a shelf</text>
  <text class="d" x="588" y="483">a client outside the studio</text>

  <rect class="panel" x="24" y="516" width="754" height="46" rx="9"/>
  <text class="l" x="38" y="538">All three travel in a header — never in a query string.</text>
  <text class="d" x="38" y="554">A URL crosses application logs, the proxy's logs, browser history and Referer; a header goes nowhere.</text>
</svg>
