<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 508" width="800" height="508" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Who serves what during HLS playback</title>
  <desc id="fig-desc">The player asks the API for the master playlist, which is the only request that pays the full authorisation check in database; it comes back carrying a playback token. The rendition playlist is rewritten on the fly so that every segment is an absolute presigned MinIO URL, and the player then fetches the segment bytes straight from MinIO without going through Node.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="508" rx="10"/>

  <rect class="panel" x="30" y="28" width="180" height="40" rx="9"/>
  <text class="t" x="120" y="53" text-anchor="middle">Player (browser)</text>

  <rect class="panel-a" x="310" y="28" width="180" height="40" rx="9"/>
  <text class="t" x="400" y="53" text-anchor="middle">ReView API</text>

  <rect class="panel" x="600" y="28" width="176" height="40" rx="9"/>
  <text class="t" x="688" y="53" text-anchor="middle">MinIO</text>

  <path class="conn-o" d="M120 68 L120 440"/>
  <path class="conn-o" d="M400 68 L400 440"/>
  <path class="conn-o" d="M688 68 L688 440"/>

  <!-- 1 : maître, seul point payant l'autorisation en base -->
  <text class="m" x="132" y="96">1  GET /api/media/:id/hls/master.m3u8</text>
  <path class="conn" d="M120 104 L400 104" marker-end="url(#arrow)"/>
  <text class="d" x="132" y="120">full auth + project access check, in database</text>

  <!-- 2 : le maître émet le jeton de lecture -->
  <text class="l" x="132" y="168">2  master.m3u8 + a playback token on each URI</text>
  <path class="conn-a" d="M400 176 L120 176" marker-end="url(#arrow-a)"/>
  <text class="m" x="132" y="192">Cache-Control: private, no-store</text>

  <!-- 3 : la sous-playlist se contente du jeton -->
  <text class="m" x="132" y="240">3  GET …/hls/720p.m3u8?pt=…</text>
  <path class="conn" d="M120 248 L400 248" marker-end="url(#arrow)"/>
  <text class="d" x="132" y="264">the token replaces the database check</text>

  <!-- 4 : réécriture en URL présignées -->
  <text class="l" x="132" y="312">4  the rendition playlist, rewritten on the fly</text>
  <path class="conn-a" d="M400 320 L120 320" marker-end="url(#arrow-a)"/>
  <text class="d" x="132" y="336">every segment becomes an absolute presigned URL</text>
  <text class="d" x="132" y="352">TTL 2 h, pinned to the current 15-minute window</text>

  <!-- 5 : les octets ne traversent plus Node -->
  <text class="m" x="132" y="388">5  GET 720p_003.ts, 720p_004.ts, …</text>
  <path class="conn" d="M120 396 L688 396" marker-end="url(#arrow)"/>
  <path class="conn" d="M120 410 L688 410" marker-end="url(#arrow)"/>
  <text class="d" x="132" y="430">segment bytes never traverse Node</text>

  <rect class="band" x="24" y="456" width="752" height="34" rx="9"/>
  <text class="d" x="40" y="478">Everything else — originals, thumbnails, proxies — is presigned directly: PUT 15 min, GET 1 h.</text>
</svg>
