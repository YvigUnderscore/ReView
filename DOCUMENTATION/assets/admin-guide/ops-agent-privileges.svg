<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">How an operation ordered from the admin area reaches the machine</title>
  <desc id="fig-desc">The backend writes an order into ops/queue and reads ops/state read-only; the operations agent, which lives in a separate compose project and holds the docker socket, does the opposite and runs the shell scripts that recreate the main stack.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="470" rx="10"/>

  <rect class="panel" x="30" y="40" width="220" height="200" rx="9"/>
  <text class="t" x="42" y="64">Backend container</text>
  <text class="d" x="42" y="84">reachable from the internet</text>
  <text class="d" x="42" y="100">no docker socket</text>

  <rect class="panel-a" x="550" y="40" width="220" height="200" rx="9"/>
  <text class="t" x="562" y="64">Operations agent</text>
  <text class="d" x="562" y="84">compose project review-ops</text>
  <text class="d" x="562" y="100">holds /var/run/docker.sock</text>

  <text class="d" x="400" y="116" text-anchor="middle">Host disk</text>

  <rect class="panel" x="290" y="126" width="220" height="40" rx="9"/>
  <text class="m" x="400" y="151" text-anchor="middle">ops/queue/&lt;id&gt;.json</text>

  <rect class="panel" x="290" y="196" width="220" height="40" rx="9"/>
  <text class="m" x="400" y="221" text-anchor="middle">ops/state/runs/&lt;id&gt;/</text>

  <path class="conn-a" d="M250 146 L284 146" marker-end="url(#arrow-a)"/>
  <text class="a" x="267" y="138" text-anchor="middle">writes</text>
  <path class="conn" d="M510 146 L544 146" marker-end="url(#arrow)"/>
  <text class="d" x="527" y="138" text-anchor="middle">reads</text>

  <path class="conn-a" d="M550 216 L516 216" marker-end="url(#arrow-a)"/>
  <text class="a" x="533" y="208" text-anchor="middle">writes</text>
  <path class="conn" d="M290 216 L256 216" marker-end="url(#arrow)"/>
  <text class="d" x="273" y="208" text-anchor="middle">reads only</text>

  <path class="conn-a" d="M660 240 L660 264" marker-end="url(#arrow-a)"/>
  <rect class="panel" x="550" y="270" width="220" height="52" rx="9"/>
  <text class="m" x="562" y="292">update.sh · backup.sh</text>
  <text class="m" x="562" y="310">restore.sh verify</text>

  <path class="conn" d="M548 296 L522 296 L522 362 L508 362" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="30" y="330" width="470" height="64" rx="9"/>
  <text class="t" x="42" y="356">Main stack</text>
  <text class="d" x="42" y="376">backend · worker · frontend, recreated by a switch</text>

  <text class="d" x="30" y="424">The agent does not belong to that stack — which is what lets it survive recreating it.</text>
  <text class="d" x="30" y="444">The backend never writes into ops/state, so it cannot plant a link there for the agent to follow.</text>
</svg>
