<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316" role="img" aria-labelledby="who-light-title who-light-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="who-light-title">Tweaking the light for yourself versus deciding it for everyone</title>
  <desc id="who-light-desc">Anyone may change the lighting of a 3D review for their own session, and lose it on reload. Saving it on the media, which replays it for every viewer and is allowed even after publication, is reserved to the account that uploaded the media and to studio supervisors and administrators. The project default belongs to whoever manages the project, and the library itself to administrators only.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="316" rx="10"/>

  <text class="d" x="28" y="30">WHO MAY DO WHAT WITH THE LIGHT</text>

  <rect class="band" x="28" y="40" width="746" height="44" rx="9"/>
  <text class="d" x="333" y="59" text-anchor="middle">ARTIST</text>
  <text class="d" x="333" y="73" text-anchor="middle">not the uploader</text>
  <text class="d" x="431" y="59" text-anchor="middle">UPLOADER</text>
  <text class="d" x="431" y="73" text-anchor="middle">of this media</text>
  <text class="d" x="529" y="59" text-anchor="middle">SUPERVISOR</text>
  <text class="d" x="529" y="73" text-anchor="middle">by membership</text>
  <text class="d" x="627" y="59" text-anchor="middle">SUPERVISOR</text>
  <text class="d" x="627" y="73" text-anchor="middle">studio-wide</text>
  <text class="d" x="725" y="59" text-anchor="middle">ADMIN</text>
  <text class="d" x="725" y="73" text-anchor="middle">studio-wide</text>

  <rect class="panel" x="28" y="90" width="746" height="34" rx="9"/>
  <text class="l" x="44" y="111">Change the light for my own session</text>
  <text class="l ok" x="333" y="111" text-anchor="middle">Yes</text>
  <text class="l ok" x="431" y="111" text-anchor="middle">Yes</text>
  <text class="l ok" x="529" y="111" text-anchor="middle">Yes</text>
  <text class="l ok" x="627" y="111" text-anchor="middle">Yes</text>
  <text class="l ok" x="725" y="111" text-anchor="middle">Yes</text>

  <rect class="panel" x="28" y="128" width="746" height="34" rx="9"/>
  <text class="l" x="44" y="149">Save the light on a media</text>
  <text class="l no" x="333" y="149" text-anchor="middle">No</text>
  <text class="l ok" x="431" y="149" text-anchor="middle">Yes</text>
  <text class="l no" x="529" y="149" text-anchor="middle">No</text>
  <text class="l ok" x="627" y="149" text-anchor="middle">Yes</text>
  <text class="l ok" x="725" y="149" text-anchor="middle">Yes</text>

  <rect class="panel" x="28" y="166" width="746" height="34" rx="9"/>
  <text class="l" x="44" y="187">Save it on a published media</text>
  <text class="l no" x="333" y="187" text-anchor="middle">No</text>
  <text class="l ok" x="431" y="187" text-anchor="middle">Yes</text>
  <text class="l no" x="529" y="187" text-anchor="middle">No</text>
  <text class="l ok" x="627" y="187" text-anchor="middle">Yes</text>
  <text class="l ok" x="725" y="187" text-anchor="middle">Yes</text>

  <rect class="panel" x="28" y="204" width="746" height="34" rx="9"/>
  <text class="l" x="44" y="225">Set the project default lighting</text>
  <text class="l no" x="333" y="225" text-anchor="middle">No</text>
  <text class="l no" x="431" y="225" text-anchor="middle">No</text>
  <text class="l ok" x="529" y="225" text-anchor="middle">Yes</text>
  <text class="l ok" x="627" y="225" text-anchor="middle">Yes</text>
  <text class="l ok" x="725" y="225" text-anchor="middle">Yes</text>

  <rect class="panel" x="28" y="242" width="746" height="34" rx="9"/>
  <text class="l" x="44" y="263">Add or delete a library entry</text>
  <text class="l no" x="333" y="263" text-anchor="middle">No</text>
  <text class="l no" x="431" y="263" text-anchor="middle">No</text>
  <text class="l no" x="529" y="263" text-anchor="middle">No</text>
  <text class="l no" x="627" y="263" text-anchor="middle">No</text>
  <text class="l ok" x="725" y="263" text-anchor="middle">Yes</text>

  <text class="d" x="28" y="292">Row one is lost on reload and shared with nobody — the complaint that the lighting reset itself is that rule, not a bug.</text>
  <text class="d" x="28" y="306">Saving on a media reads the studio role or the uploader id — never the role held on that one project.</text>
</svg>
