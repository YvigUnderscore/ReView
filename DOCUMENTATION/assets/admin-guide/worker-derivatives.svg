<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 518" width="800" height="518" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">What one video upload produces</title>
  <desc id="fig-desc">From the untouched original — or from a prefix of frames plus a sequence manifest — the FFmpeg worker derives an MP4 proxy, the adaptive HLS ladder, a card thumbnail, a timeline hover sprite, a burnt-in client derivative, an audio waveform stored in the metadata, and optional scene-detection markers. The dashed derivatives are best effort and do not fail the job.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="518" rx="10"/>

  <text class="d" x="28" y="30">THE SOURCE</text>
  <text class="d" x="300" y="30">WHAT THE WORKER WRITES</text>

  <rect class="panel-a" x="24" y="100" width="210" height="64" rx="9"/>
  <text class="t" x="38" y="122">Uploaded original</text>
  <text class="m" x="38" y="140">projects/{slug}/…/{file}</text>
  <text class="d" x="38" y="156">never modified</text>

  <rect class="panel-o" x="24" y="190" width="210" height="64" rx="9"/>
  <text class="l" x="38" y="212">…or an image sequence</text>
  <text class="m" x="38" y="230">{mediaId}/frames/*.exr</text>
  <text class="m" x="38" y="248">{mediaId}/sequence.json</text>

  <path class="conn" d="M234 132 L266 132"/>
  <path class="conn-o" d="M234 222 L266 222"/>
  <path class="conn" d="M266 71 L266 419"/>

  <path class="conn" d="M266 71 L300 71" marker-end="url(#arrow)"/>
  <rect class="panel" x="300" y="48" width="476" height="46" rx="9"/>
  <text class="m" x="316" y="68">derived/{id}/proxy.mp4</text>
  <text class="d" x="316" y="86">MP4 proxy — CRF 23 / veryfast hard-coded, height capped at 1080</text>

  <path class="conn-a" d="M266 129 L300 129" marker-end="url(#arrow-a)"/>
  <rect class="panel-a" x="300" y="106" width="476" height="46" rx="9"/>
  <text class="m" x="316" y="126">derived/{id}/hls/</text>
  <text class="d" x="316" y="144">adaptive ladder — bitrate mode; preset and rung bitrates are the only knobs</text>

  <path class="conn" d="M266 187 L300 187" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="300" y="164" width="476" height="46" rx="9"/>
  <text class="m" x="316" y="184">derived/{id}/thumbnail.jpg</text>
  <text class="d" x="316" y="202">card thumbnail — one frame at duration / 2, 640 px wide</text>

  <path class="conn" d="M266 245 L300 245" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="300" y="222" width="476" height="46" rx="9"/>
  <text class="m" x="316" y="242">derived/{id}/timeline-sprite.jpg</text>
  <text class="d" x="316" y="260">hover sprite — one tile every 3 s, 160 px, ≤ 10 columns, ≤ 240 tiles</text>

  <path class="conn" d="M266 303 L300 303" marker-end="url(#arrow)"/>
  <rect class="panel" x="300" y="280" width="476" height="46" rx="9"/>
  <text class="m" x="316" y="300">derived/{id}/client.mp4</text>
  <text class="d" x="316" y="318">slate + burn-ins — served to client shares only</text>

  <path class="conn" d="M266 361 L300 361" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="300" y="338" width="476" height="46" rx="9"/>
  <text class="m" x="316" y="358">metadata.waveform</text>
  <text class="d" x="316" y="376">audio peaks — one byte per bar, 8 bars per second, base64; no object stored</text>

  <path class="conn" d="M266 419 L300 419" marker-end="url(#arrow)"/>
  <rect class="panel-o" x="300" y="396" width="476" height="46" rx="9"/>
  <text class="l" x="316" y="416">Timeline markers “Plan n”</text>
  <text class="d" x="316" y="434">scene detection, opt-in — threshold 0.4, ≤ 120 markers, replaced on reprocess</text>

  <rect class="band" x="24" y="452" width="752" height="48" rx="9"/>
  <text class="d" x="40" y="474">Dashed = best effort: a failure there does not fail the job. Worker concurrency is 2.</text>
  <text class="d" x="40" y="492">A ClamAV hit quarantines the object and marks the media FAILED; a checksum mismatch fails the job.</text>
</svg>
