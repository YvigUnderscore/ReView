<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="err-title err-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="err-title">How the effective role on a project is resolved</title>
  <desc id="err-desc">A three-question chain read top to bottom. A global ADMIN, then a global SUPERVISOR, each leave immediately with that role on every project and their membership ignored. Anyone else without a membership gets no role at all and a 403. With a membership, the effective role is the membership role, falling back to the global one.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="430" rx="10"/>

  <text class="d" x="40" y="28">THE QUESTION CHAIN</text>
  <text class="d" x="430" y="28">WHAT YOU COME OUT WITH</text>

  <rect class="panel-a" x="40" y="48" width="280" height="46" rx="9"/>
  <text class="t" x="180" y="70" text-anchor="middle">A request touches project P</text>
  <text class="d" x="180" y="86" text-anchor="middle">global role and membership are read</text>

  <path class="conn" d="M180 94 L180 118" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="118" width="280" height="46" rx="9"/>
  <text class="l" x="180" y="140" text-anchor="middle">Global role is ADMIN?</text>
  <text class="d" x="180" y="156" text-anchor="middle">membership not consulted</text>

  <path class="conn-a" d="M320 141 L430 141" marker-end="url(#arrow-a)"/>
  <text class="a" x="375" y="133" text-anchor="middle">yes</text>
  <path class="conn" d="M180 164 L180 188" marker-end="url(#arrow)"/>
  <text class="d" x="190" y="181">no</text>

  <rect class="panel-a" x="430" y="118" width="330" height="46" rx="9"/>
  <text class="t" x="595" y="140" text-anchor="middle">ADMIN on this project</text>
  <text class="d" x="595" y="156" text-anchor="middle">no project role can hide a show from an administrator</text>

  <rect class="panel" x="40" y="188" width="280" height="46" rx="9"/>
  <text class="l" x="180" y="210" text-anchor="middle">Global role is SUPERVISOR?</text>
  <text class="d" x="180" y="226" text-anchor="middle">membership not consulted</text>

  <path class="conn-a" d="M320 211 L430 211" marker-end="url(#arrow-a)"/>
  <text class="a" x="375" y="203" text-anchor="middle">yes</text>
  <path class="conn" d="M180 234 L180 258" marker-end="url(#arrow)"/>
  <text class="d" x="190" y="251">no</text>

  <rect class="panel-a" x="430" y="188" width="330" height="46" rx="9"/>
  <text class="t" x="595" y="210" text-anchor="middle">SUPERVISOR on this project</text>
  <text class="d" x="595" y="226" text-anchor="middle">every project of the studio — but still no admin area</text>

  <rect class="panel" x="40" y="258" width="280" height="46" rx="9"/>
  <text class="l" x="180" y="280" text-anchor="middle">A membership on P exists?</text>
  <text class="d" x="180" y="296" text-anchor="middle">the only door left for other roles</text>

  <path class="conn" d="M320 281 L430 281" marker-end="url(#arrow)"/>
  <text class="d no" x="375" y="273" text-anchor="middle">no</text>
  <path class="conn" d="M180 304 L180 328" marker-end="url(#arrow)"/>
  <text class="d" x="190" y="321">yes</text>

  <rect class="panel-d" x="430" y="258" width="330" height="46" rx="9"/>
  <text class="t" x="595" y="280" text-anchor="middle">No role at all — 403</text>
  <text class="d" x="595" y="296" text-anchor="middle">refused server-side, not merely filtered out of a list</text>

  <rect class="panel-a" x="40" y="328" width="280" height="46" rx="9"/>
  <text class="l" x="180" y="350" text-anchor="middle">Membership role, else global role</text>
  <text class="d" x="180" y="366" text-anchor="middle">where local elevation happens</text>

  <path class="conn" d="M320 351 L430 351" marker-end="url(#arrow)"/>
  <text class="d" x="375" y="343" text-anchor="middle">gives</text>

  <rect class="panel" x="430" y="328" width="330" height="46" rx="9"/>
  <text class="l" x="595" y="350" text-anchor="middle">SUPERVISOR, ARTIST or CLIENT</text>
  <text class="d" x="595" y="366" text-anchor="middle">on this project, and nowhere else</text>

  <text class="d" x="40" y="398">A global manager is never demoted by a project role: setting an administrator's membership to Client changes nothing.</text>
  <text class="d" x="40" y="416">A project role never leaks either — a lead promoted on one show stays an ordinary artist everywhere else.</text>
</svg>
