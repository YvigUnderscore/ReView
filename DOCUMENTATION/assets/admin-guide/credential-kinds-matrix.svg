<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Four ways to be authenticated in ReView, and what each one opens</title>
  <desc id="fig-desc">A matrix comparing the session JWT of a human login, a personal API token, a service token and a share session, over who issues them, whether they carry scopes, how they are bound to a project, how long they live, how fast a revocation bites, and whether a role change or a disable kills them.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="520" rx="10"/>

  <!-- En-têtes de colonnes -->
  <rect class="band" x="24" y="44" width="148" height="56" rx="9"/>
  <rect class="panel" x="180" y="44" width="145" height="56" rx="9"/>
  <text class="t" x="253" y="68" text-anchor="middle">Session JWT</text>
  <text class="d" x="253" y="86" text-anchor="middle">a human signs in</text>
  <rect class="panel-a" x="331" y="44" width="145" height="56" rx="9"/>
  <text class="t" x="404" y="68" text-anchor="middle">Personal token</text>
  <text class="m" x="404" y="86" text-anchor="middle">rvk_… a person</text>
  <rect class="panel-a" x="482" y="44" width="145" height="56" rx="9"/>
  <text class="t" x="555" y="68" text-anchor="middle">Service token</text>
  <text class="m" x="555" y="86" text-anchor="middle">rvk_… a machine</text>
  <rect class="panel" x="633" y="44" width="145" height="56" rx="9"/>
  <text class="t" x="706" y="68" text-anchor="middle">Share session</text>
  <text class="d" x="706" y="86" text-anchor="middle">a client opens a link</text>

  <!-- Ligne 1 : émission -->
  <rect class="band" x="24" y="112" width="148" height="52" rx="9"/>
  <text class="l" x="38" y="143">Who issues it</text>
  <rect class="panel" x="180" y="112" width="145" height="52" rx="9"/>
  <text class="d" x="253" y="143" text-anchor="middle">Login, or SSO</text>
  <rect class="panel" x="331" y="112" width="145" height="52" rx="9"/>
  <text class="d" x="404" y="136" text-anchor="middle">The owner, with</text>
  <text class="d" x="404" y="152" text-anchor="middle">the password</text>
  <rect class="panel" x="482" y="112" width="145" height="52" rx="9"/>
  <text class="d" x="555" y="136" text-anchor="middle">An ADMIN, with</text>
  <text class="d" x="555" y="152" text-anchor="middle">the password</text>
  <rect class="panel" x="633" y="112" width="145" height="52" rx="9"/>
  <text class="d" x="706" y="136" text-anchor="middle">Opening the link,</text>
  <text class="d" x="706" y="152" text-anchor="middle">which spends a view</text>

  <!-- Ligne 2 : scopes -->
  <rect class="band" x="24" y="170" width="148" height="52" rx="9"/>
  <text class="l" x="38" y="201">Carries scopes</text>
  <rect class="panel" x="180" y="170" width="145" height="52" rx="9"/>
  <text class="d" x="253" y="194" text-anchor="middle">No: the role and</text>
  <text class="d" x="253" y="210" text-anchor="middle">memberships decide</text>
  <rect class="panel" x="331" y="170" width="145" height="52" rx="9"/>
  <text class="d" x="404" y="194" text-anchor="middle">Yes: 9 domains,</text>
  <text class="d" x="404" y="210" text-anchor="middle">plus admin</text>
  <rect class="panel" x="482" y="170" width="145" height="52" rx="9"/>
  <text class="d" x="555" y="201" text-anchor="middle">Yes, same catalogue</text>
  <rect class="panel" x="633" y="170" width="145" height="52" rx="9"/>
  <text class="d" x="706" y="194" text-anchor="middle">No: view only, or</text>
  <text class="d" x="706" y="210" text-anchor="middle">view and comment</text>

  <!-- Ligne 3 : cantonnement -->
  <rect class="band" x="24" y="228" width="148" height="52" rx="9"/>
  <text class="l" x="38" y="259">Project binding</text>
  <rect class="panel" x="180" y="228" width="145" height="52" rx="9"/>
  <text class="d" x="253" y="259" text-anchor="middle">Its memberships</text>
  <rect class="panel" x="331" y="228" width="145" height="52" rx="9"/>
  <text class="d" x="404" y="252" text-anchor="middle">Optional, and the</text>
  <text class="d" x="404" y="268" text-anchor="middle">v1 handlers hold it</text>
  <rect class="panel" x="482" y="228" width="145" height="52" rx="9"/>
  <text class="d" x="555" y="252" text-anchor="middle">Optional, and it</text>
  <text class="d" x="555" y="268" text-anchor="middle">adds the membership</text>
  <rect class="panel" x="633" y="228" width="145" height="52" rx="9"/>
  <text class="d" x="706" y="252" text-anchor="middle">One project, and</text>
  <text class="d" x="706" y="268" text-anchor="middle">one scope inside it</text>

  <!-- Ligne 4 : durée de vie -->
  <rect class="band" x="24" y="286" width="148" height="52" rx="9"/>
  <text class="l" x="38" y="317">Lifetime</text>
  <rect class="panel" x="180" y="286" width="145" height="52" rx="9"/>
  <text class="d" x="253" y="310" text-anchor="middle">The session, slid</text>
  <text class="d" x="253" y="326" text-anchor="middle">forward by refresh</text>
  <rect class="panel" x="331" y="286" width="145" height="52" rx="9"/>
  <text class="d" x="404" y="310" text-anchor="middle">None by default,</text>
  <text class="d" x="404" y="326" text-anchor="middle">up to 3650 days</text>
  <rect class="panel" x="482" y="286" width="145" height="52" rx="9"/>
  <text class="d" x="555" y="310" text-anchor="middle">None by default,</text>
  <text class="d" x="555" y="326" text-anchor="middle">up to 3650 days</text>
  <rect class="panel" x="633" y="286" width="145" height="52" rx="9"/>
  <text class="d" x="706" y="317" text-anchor="middle">24 hours</text>

  <!-- Ligne 5 : révocation -->
  <rect class="band" x="24" y="344" width="148" height="52" rx="9"/>
  <text class="l" x="38" y="375">Revocation bites</text>
  <rect class="panel" x="180" y="344" width="145" height="52" rx="9"/>
  <text class="d" x="253" y="368" text-anchor="middle">In 30 s at worst,</text>
  <text class="d" x="253" y="384" text-anchor="middle">an in-process cache</text>
  <rect class="panel" x="331" y="344" width="145" height="52" rx="9"/>
  <text class="d" x="404" y="368" text-anchor="middle">At once, re-read</text>
  <text class="d" x="404" y="384" text-anchor="middle">on every request</text>
  <rect class="panel" x="482" y="344" width="145" height="52" rx="9"/>
  <text class="d" x="555" y="368" text-anchor="middle">At once, re-read</text>
  <text class="d" x="555" y="384" text-anchor="middle">on every request</text>
  <rect class="panel" x="633" y="344" width="145" height="52" rx="9"/>
  <text class="d" x="706" y="368" text-anchor="middle">At once, checked</text>
  <text class="d" x="706" y="384" text-anchor="middle">on every request</text>

  <!-- Ligne 6 : offboarding -->
  <rect class="band" x="24" y="402" width="148" height="52" rx="9"/>
  <text class="l" x="38" y="426">Killed by a role</text>
  <text class="l" x="38" y="442">change or disable</text>
  <rect class="panel" x="180" y="402" width="145" height="52" rx="9"/>
  <text class="d ok" x="253" y="433" text-anchor="middle">Yes</text>
  <rect class="panel" x="331" y="402" width="145" height="52" rx="9"/>
  <text class="d ok" x="404" y="433" text-anchor="middle">Yes</text>
  <rect class="panel" x="482" y="402" width="145" height="52" rx="9"/>
  <text class="d no" x="555" y="426" text-anchor="middle">No: revoke the</text>
  <text class="d no" x="555" y="442" text-anchor="middle">token by hand</text>
  <rect class="panel" x="633" y="402" width="145" height="52" rx="9"/>
  <text class="d no" x="706" y="426" text-anchor="middle">No: revoke the</text>
  <text class="d no" x="706" y="442" text-anchor="middle">link by hand</text>

  <text class="d" x="400" y="478" text-anchor="middle">Changing a password or the login email, and disabling an account, revoke that account’s sessions and its API tokens.</text>
  <text class="d" x="400" y="496" text-anchor="middle">None of that touches a share link: only deleting the account revokes the links it created.</text>
</svg>
