<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Why the order of departments decides which version is the latest</title>
  <desc id="fig-desc">The departments of a project are ordered upstream to downstream and ranked from zero. A compositing version published on Tuesday beats an animation version published on Thursday, because the latest version is the one from the furthest stage reached, not the most recent one.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="320" rx="10"/>

  <!-- Deux versions candidates -->
  <text class="d no" x="260" y="40" text-anchor="middle">published Thursday — does not win</text>
  <rect class="panel" x="194" y="48" width="132" height="56" rx="9"/>
  <text class="l" x="260" y="74" text-anchor="middle">anim v012</text>
  <text class="d" x="260" y="92" text-anchor="middle">Animation</text>

  <text class="a" x="680" y="40" text-anchor="middle">furthest stage reached — wins</text>
  <rect class="panel-a" x="614" y="48" width="132" height="56" rx="9"/>
  <text class="t" x="680" y="74" text-anchor="middle">comp v002</text>
  <text class="d" x="680" y="92" text-anchor="middle">Compositing · Tuesday</text>

  <path class="conn" d="M260 104 L260 130" marker-end="url(#arrow)"/>
  <path class="conn-a" d="M680 104 L680 130" marker-end="url(#arrow-a)"/>

  <!-- La chaîne ordonnée des départements -->
  <rect class="panel" x="60" y="130" width="120" height="44" rx="9"/>
  <text class="l" x="120" y="152" text-anchor="middle">Layout</text>
  <text class="d" x="120" y="168" text-anchor="middle">rank 0</text>

  <rect class="panel" x="200" y="130" width="120" height="44" rx="9"/>
  <text class="l" x="260" y="152" text-anchor="middle">Animation</text>
  <text class="d" x="260" y="168" text-anchor="middle">rank 1</text>

  <rect class="panel" x="340" y="130" width="120" height="44" rx="9"/>
  <text class="l" x="400" y="152" text-anchor="middle">FX</text>
  <text class="d" x="400" y="168" text-anchor="middle">rank 2</text>

  <rect class="panel" x="480" y="130" width="120" height="44" rx="9"/>
  <text class="l" x="540" y="152" text-anchor="middle">Lighting</text>
  <text class="d" x="540" y="168" text-anchor="middle">rank 3</text>

  <rect class="panel-a" x="620" y="130" width="120" height="44" rx="9"/>
  <text class="t" x="680" y="152" text-anchor="middle">Compositing</text>
  <text class="d" x="680" y="168" text-anchor="middle">rank 4</text>

  <path class="conn" d="M60 192 L740 192" marker-end="url(#arrow)"/>
  <text class="a" x="400" y="212" text-anchor="middle">upstream → downstream, in the order you arrange them</text>

  <rect class="band" x="24" y="228" width="752" height="76" rx="9"/>
  <text class="l" x="40" y="252">Latest version = the furthest department reached that has something to show, then the most recent within it.</text>
  <text class="d" x="40" y="272">A department unknown to the project ranks −1: it never wins against a known stage, and is grouped last.</text>
  <text class="d" x="40" y="290">With no departments configured everything ties and the most recent wins — the same rule feeds every auto cut timeline.</text>
</svg>
