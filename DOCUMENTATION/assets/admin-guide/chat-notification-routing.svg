<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="chat-routing-title chat-routing-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="chat-routing-title">Which event reaches which chat channel, and with what timeout</title>
  <desc id="chat-routing-desc">A publication and a review decision go through notifyChat, which posts to both Slack and Discord under a five-second timeout. A new comment on a media and new feedback on a timeline go through sendDiscord, which posts to Discord only and carries no timeout at all. Both paths are fire-and-forget: a webhook that fails is logged and never fails the action that triggered it.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="310" rx="10"/>

  <text class="d" x="30" y="32">THE EVENT</text>
  <text class="d" x="276" y="32">THE SENDER</text>
  <text class="d" x="540" y="32">THE CHANNEL</text>

  <rect class="panel" x="30" y="52" width="200" height="34" rx="9"/>
  <text class="l" x="46" y="73">Media published</text>

  <rect class="panel" x="30" y="96" width="200" height="34" rx="9"/>
  <text class="l" x="46" y="117">Review decision recorded</text>

  <rect class="panel" x="30" y="140" width="200" height="34" rx="9"/>
  <text class="l" x="46" y="161">New comment on a media</text>

  <rect class="panel" x="30" y="184" width="200" height="34" rx="9"/>
  <text class="l" x="46" y="205">Feedback on a timeline</text>

  <path class="conn" d="M230 69 L256 69 L256 83"/>
  <path class="conn" d="M230 113 L256 113 L256 83"/>
  <path class="conn" d="M256 83 L272 83" marker-end="url(#arrow)"/>
  <path class="conn" d="M230 157 L256 157 L256 171"/>
  <path class="conn" d="M230 201 L256 201 L256 171"/>
  <path class="conn" d="M256 171 L272 171" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="276" y="60" width="214" height="46" rx="9"/>
  <text class="t" x="292" y="82">Publications and decisions</text>
  <text class="m" x="292" y="99">notifyChat() — 5 s timeout</text>

  <rect class="panel-w" x="276" y="148" width="214" height="46" rx="9"/>
  <text class="t" x="292" y="170">Comments and feedback</text>
  <text class="m" x="292" y="187">sendDiscord() — no timeout</text>

  <text class="d" x="276" y="216">Slack never receives these two.</text>

  <path class="conn-a" d="M490 83 L514 83"/>
  <path class="conn-a" d="M514 83 L514 67 L536 67" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M514 83 L514 176 L536 176" marker-end="url(#arrow-a)"/>
  <path class="conn" d="M490 171 L522 171 L522 190 L536 190" marker-end="url(#arrow)"/>

  <rect class="panel" x="540" y="44" width="230" height="46" rx="9"/>
  <text class="t" x="556" y="66">Slack</text>
  <text class="d" x="556" y="83">hooks.slack.com, HTTPS only</text>

  <rect class="panel" x="540" y="160" width="230" height="46" rx="9"/>
  <text class="t" x="556" y="182">Discord</text>
  <text class="d" x="556" y="199">discord.com or discordapp.com</text>

  <rect class="panel-o" x="540" y="222" width="230" height="46" rx="9"/>
  <text class="l" x="556" y="244">Host allow-list</text>
  <text class="d" x="556" y="261">re-checked before every post</text>

  <text class="d" x="30" y="292">Fire-and-forget on both paths: a webhook that fails is logged, and the action that triggered it goes through anyway.</text>
</svg>
