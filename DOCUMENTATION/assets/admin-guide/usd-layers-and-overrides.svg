<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">The four layers between a delivered USD scene and what a reviewer sees</title>
  <desc id="fig-desc">From the bottom: the delivered USD source, which is never modified; the USD overlay layer holding the variant and purpose selection; the converted GLB with every variant option baked as a tagged subtree; and on top the ReView override, which exists either as a media override written before publication or as a proposal attached to a comment.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="480" rx="10"/>

  <text class="d" x="30" y="34">WHAT EACH LAYER IS, AND WHO WRITES IT</text>
  <text class="a" x="770" y="34" text-anchor="end">the top layer is applied last</text>

  <rect class="panel-a" x="30" y="56" width="300" height="56" rx="9"/>
  <text class="t" x="180" y="80" text-anchor="middle">ReView override</text>
  <text class="d" x="180" y="98" text-anchor="middle">visibility · transform · look · variant</text>
  <text class="d" x="356" y="76">A small delta applied when the scene loads — it is not USD,</text>
  <text class="d" x="356" y="92">and it never rewrites a single byte of the delivered file.</text>
  <text class="d" x="356" y="108">Two flavours, described below.</text>

  <path class="conn-a" d="M180 132 L180 116" marker-end="url(#arrow-a)"/>

  <rect class="panel" x="30" y="132" width="300" height="56" rx="9"/>
  <text class="t" x="180" y="156" text-anchor="middle">Converted GLB</text>
  <text class="d" x="180" y="174" text-anchor="middle">what the viewer actually loads</text>
  <text class="d" x="356" y="152">Every option of every variant set is baked as its own tagged</text>
  <text class="d" x="356" y="168">subtree, and every node carries its USD prim path. Switching</text>
  <text class="d" x="356" y="184">a variant costs no job, so it works on published media too.</text>

  <path class="conn" d="M180 208 L180 192" marker-end="url(#arrow)"/>

  <rect class="panel-o" x="30" y="208" width="300" height="56" rx="9"/>
  <text class="t" x="180" y="232" text-anchor="middle">USD overlay layer</text>
  <text class="d" x="180" y="250" text-anchor="middle">variant selection + purpose</text>
  <text class="d" x="356" y="228">Written by Recompose the scene…, or given at publication</text>
  <text class="d" x="356" y="244">time. It sublayers the root, and that composed stage converts.</text>
  <text class="d" x="356" y="260">Recomposing a published media is refused — 403 PUBLISHED_LOCKED.</text>

  <path class="conn" d="M180 284 L180 268" marker-end="url(#arrow)"/>

  <rect class="panel" x="30" y="284" width="300" height="56" rx="9"/>
  <text class="t" x="180" y="308" text-anchor="middle">Delivered USD source</text>
  <text class="d" x="180" y="326" text-anchor="middle">never modified by ReView</text>
  <text class="d" x="356" y="304">The .usd, .usdz or .zip your pipeline delivered. Read only:</text>
  <text class="d" x="356" y="320">a scene is corrected by publishing a new version, never in place.</text>

  <text class="d" x="30" y="376">THE REVIEW OVERRIDE COMES IN TWO FLAVOURS</text>

  <rect class="panel-a" x="30" y="390" width="360" height="64" rx="9"/>
  <text class="t" x="210" y="414" text-anchor="middle">Media override</text>
  <text class="m" x="210" y="430" text-anchor="middle">PUT /api/media/:id/usd/override</text>
  <text class="d" x="210" y="446" text-anchor="middle">frozen at publication, then replayed for everyone</text>

  <rect class="panel" x="410" y="390" width="360" height="64" rx="9"/>
  <text class="t" x="590" y="414" text-anchor="middle">Comment proposal</text>
  <text class="d" x="590" y="430" text-anchor="middle">attached to a comment, before or after publication</text>
  <text class="d" x="590" y="446" text-anchor="middle">replayed only while that comment is selected</text>
</svg>
