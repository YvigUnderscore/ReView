<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Environment versus database, field by field</title>
  <desc id="fig-desc">For each SMTP field, the effective value when the SMTP_HOST variable is set and when it is not. Host, port and secure follow the environment; user and password follow their own variable either way; the sender resolves the other way round and is highlighted.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="388" rx="10"/>

  <text class="d" x="24" y="30">WHICH VALUE ACTUALLY REACHES THE RELAY</text>

  <text class="d" x="40" y="64">FIELD</text>
  <text class="d" x="220" y="64">WITH SMTP_HOST SET</text>
  <text class="d" x="516" y="64">WITHOUT SMTP_HOST</text>

  <rect class="panel" x="24" y="76" width="752" height="228" rx="9"/>
  <path class="conn" d="M204 76 L204 304"/>
  <path class="conn" d="M500 76 L500 304"/>
  <path class="conn" d="M24 114 L776 114"/>
  <path class="conn" d="M24 152 L776 152"/>
  <path class="conn" d="M24 190 L776 190"/>
  <path class="conn" d="M24 228 L776 228"/>
  <path class="conn" d="M24 266 L776 266"/>

  <text class="l" x="40" y="100">host</text>
  <text class="m" x="220" y="100">SMTP_HOST</text>
  <text class="d" x="516" y="100">the stored host — empty means no mail</text>

  <text class="l" x="40" y="138">port</text>
  <text class="m" x="220" y="138">SMTP_PORT<tspan class="d" dx="8">— default 587</tspan></text>
  <text class="d" x="516" y="138">the stored port, default 587</text>

  <text class="l" x="40" y="176">secure</text>
  <text class="m" x="220" y="176">SMTP_SECURE<tspan class="d" dx="8">— default off</tspan></text>
  <text class="d" x="516" y="176">the stored flag, default off (STARTTLS)</text>

  <text class="l" x="40" y="214">user</text>
  <text class="m" x="220" y="214">SMTP_USER</text>
  <text class="m" x="516" y="214">SMTP_USER<tspan class="d" dx="8">still wins, else stored</tspan></text>

  <text class="l" x="40" y="252">password</text>
  <text class="m" x="220" y="252">SMTP_PASS</text>
  <text class="m" x="516" y="252">SMTP_PASS<tspan class="d" dx="8">still wins, else stored</tspan></text>

  <rect class="panel-w" x="204" y="266" width="572" height="38" rx="9"/>
  <text class="l" x="40" y="290">from</text>
  <text class="d" x="220" y="290">the stored sender first — SMTP_FROM only as a fallback, in both columns</text>

  <text class="a" x="24" y="332">The panel announces the environment override. The sender address is the one exception to it.</text>
  <text class="d" x="24" y="352">A staging instance pointed at a capture relay through SMTP_HOST still signs its mail with the production From.</text>
  <text class="d" x="24" y="370">Saving the panel once writes that sender into the database, after which SMTP_FROM no longer applies at all.</text>
</svg>
