<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">What closing a banner means</title>
  <desc id="fig-desc">An announcement passes three gates — active, within its start and end dates, targeted at the reader's global role — before its banner is shown on the home page. Closing it records a read receipt, and the frequency decides whether the banner comes back on the next page load, never again, or on the next UTC day.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="446" rx="10"/>

  <text class="d" x="24" y="32">THREE GATES, THEN THE BANNER</text>

  <rect class="panel" x="24" y="56" width="170" height="46" rx="9"/>
  <text class="l" x="40" y="78">Announcement</text>
  <text class="d" x="40" y="94">saved by an admin</text>

  <path class="conn" d="M194 79 L214 79" marker-end="url(#arrow)"/>

  <rect class="panel-o" x="214" y="56" width="150" height="46" rx="9"/>
  <text class="l" x="230" y="78">Active?</text>
  <text class="d" x="230" y="94">off = kept, never shown</text>

  <path class="conn" d="M364 79 L384 79" marker-end="url(#arrow)"/>

  <rect class="panel-o" x="384" y="56" width="176" height="46" rx="9"/>
  <text class="l" x="400" y="78">Within its dates?</text>
  <text class="d" x="400" y="94">outside = not shown</text>

  <path class="conn" d="M560 79 L580 79" marker-end="url(#arrow)"/>

  <rect class="panel-o" x="580" y="56" width="196" height="46" rx="9"/>
  <text class="l" x="596" y="78">Your global role?</text>
  <text class="d" x="596" y="94">no tick = everyone</text>

  <path class="conn-a" d="M678 102 L678 130 L400 130 L400 152" marker-end="url(#arrow-a)"/>

  <rect class="panel-a" x="300" y="152" width="200" height="46" rx="9"/>
  <text class="t" x="400" y="174" text-anchor="middle">Banner shown</text>
  <text class="d" x="400" y="190" text-anchor="middle">home page, above the widgets</text>

  <path class="conn" d="M400 198 L400 224" marker-end="url(#arrow)"/>

  <rect class="panel" x="290" y="224" width="220" height="46" rx="9"/>
  <text class="l" x="400" y="246" text-anchor="middle">Reader closes it</text>
  <text class="d" x="400" y="262" text-anchor="middle">read receipt recorded</text>

  <path class="conn" d="M400 270 L400 292 L139 292 L139 314" marker-end="url(#arrow)"/>
  <path class="conn" d="M400 270 L400 314" marker-end="url(#arrow)"/>
  <path class="conn" d="M400 270 L400 292 L661 292 L661 314" marker-end="url(#arrow)"/>

  <rect class="panel" x="24" y="314" width="230" height="46" rx="9"/>
  <text class="l" x="40" y="336">Permanent</text>
  <text class="d" x="40" y="352">back on the next page load</text>

  <rect class="panel" x="286" y="314" width="228" height="46" rx="9"/>
  <text class="l" x="302" y="336">First login</text>
  <text class="d" x="302" y="352">never shown to them again</text>

  <rect class="panel" x="546" y="314" width="230" height="46" rx="9"/>
  <text class="l" x="562" y="336">First of the day</text>
  <text class="d" x="562" y="352">back on the next UTC day</text>

  <text class="d" x="24" y="390">Targeting and dates are applied on the server: a browser never receives an announcement aimed at someone else.</text>
  <text class="d" x="24" y="408">UTC, not the reader's timezone — a studio spread over several offices sees the same banner on the same day.</text>
  <text class="a" x="24" y="428">Read by 23: the count of receipts is the closest thing to a delivery receipt.</text>
</svg>
