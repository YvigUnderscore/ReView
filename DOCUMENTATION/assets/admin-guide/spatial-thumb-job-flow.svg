<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="thumb-flow-title thumb-flow-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="thumb-flow-title">One thumbnail job per media, eight attempts, and both of its happy endings</title>
  <desc id="thumb-flow-desc">A finalised upload or a reprocess queues one job whose id is derived from the media, so two triggers never start two renders. If the source is not ready the job is retried with an exponential backoff, eight times, for a little over an hour. When it is ready, a 3D model goes through Blender and a splat through the built-in point rasteriser; the resulting PNG is written only if the media still has no thumbnail. Both endings are successes: an image, or no image with a logged cause.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="470" rx="10"/>

  <text class="d" x="30" y="32">ONE JOB PER MEDIA, AND EVERY WAY IT ENDS WELL</text>

  <rect class="panel" x="30" y="48" width="200" height="34" rx="9"/>
  <text class="l" x="46" y="69">Upload finalised</text>

  <rect class="panel" x="30" y="92" width="200" height="34" rx="9"/>
  <text class="l" x="46" y="113">Reprocess</text>

  <path class="conn" d="M230 65 L256 65 L256 71"/>
  <path class="conn" d="M230 109 L256 109 L256 71"/>
  <path class="conn" d="M256 71 L286 71" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="290" y="48" width="480" height="46" rx="9"/>
  <text class="t" x="306" y="70">Queued on the spatial-thumb queue</text>
  <text class="m" x="306" y="87">job id spatial-thumb-&lt;mediaId&gt; — one render in flight per media</text>
  <text class="d" x="290" y="112">released ten minutes after completion, so a later reprocess starts a new run</text>

  <path class="conn" d="M420 94 L420 124" marker-end="url(#arrow)"/>

  <rect class="panel" x="270" y="128" width="300" height="46" rx="9"/>
  <text class="t" x="286" y="150">Is the source ready?</text>
  <text class="d" x="286" y="167">GLB converted, or already .glb / .ply / .splat</text>

  <path class="conn" d="M266 151 L226 151" marker-end="url(#arrow)"/>
  <text class="d" x="243" y="144" text-anchor="middle">no</text>

  <rect class="panel-o" x="40" y="128" width="180" height="46" rx="9"/>
  <text class="l" x="56" y="150">Not yet — retry</text>
  <text class="d" x="56" y="167">8 tries, ~1 h in total</text>

  <path class="conn" d="M130 174 L130 200 L330 200 L330 176" marker-end="url(#arrow)"/>

  <path class="conn-a" d="M570 151 L600 151 L600 214 L390 214 L390 228" marker-end="url(#arrow-a)"/>
  <path class="conn-a" d="M600 214 L650 214 L650 228" marker-end="url(#arrow-a)"/>
  <text class="a" x="588" y="144" text-anchor="middle">yes</text>

  <rect class="panel" x="270" y="232" width="240" height="46" rx="9"/>
  <text class="t" x="286" y="254">3D model</text>
  <text class="d" x="286" y="271">Blender headless, Cycles on CPU</text>

  <rect class="panel" x="530" y="232" width="240" height="46" rx="9"/>
  <text class="t" x="546" y="254">Splat .ply or .splat</text>
  <text class="d" x="546" y="271">built-in point rasteriser</text>

  <path class="conn" d="M390 278 L390 296" marker-end="url(#arrow)"/>
  <path class="conn" d="M650 278 L650 296" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="30" y="300" width="740" height="46" rx="9"/>
  <text class="t" x="46" y="322">Written only if the media still has no thumbnail</text>
  <text class="d" x="46" y="339">derived/&lt;mediaId&gt;/thumbnail.png — 512 × 512, transparent, three-quarter view (azimuth 35°, elevation 22°)</text>

  <path class="conn" d="M250 346 L250 356" marker-end="url(#arrow)"/>
  <path class="conn" d="M590 346 L590 356" marker-end="url(#arrow)"/>

  <rect class="panel" x="110" y="360" width="280" height="46" rx="9"/>
  <text class="t" x="126" y="382">An image is written</text>
  <text class="d" x="126" y="399">the tile fills in everywhere at once</text>

  <rect class="panel" x="420" y="360" width="340" height="46" rx="9"/>
  <text class="t" x="436" y="382">No image — the job still succeeds</text>
  <text class="d" x="436" y="399">the cause is logged, the media is untouched</text>

  <text class="d" x="30" y="428">blender-missing · no-geometry · import-failed · degenerate bounds · ascii-ply · compressed-ply · no-visible-point · timeout:600s</text>
  <text class="a" x="30" y="452">The media status is never touched: nothing stalls in PROCESSING or turns FAILED because of a tile.</text>
</svg>
