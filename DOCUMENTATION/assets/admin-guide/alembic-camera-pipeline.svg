<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">From a tracked Alembic camera to a move every reviewer sees</title>
  <desc id="fig-desc">Outside ReView, a one-time extractor turns shot_cam.abc into a JSON of samples. Inside the review, the Import control of the Export panel reads that JSON into a v2 camera animation on eight channels, which is then published in Staging as the media presentation. A channel accepts at most 256 keys.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="350" rx="10"/>

  <text class="d" x="30" y="32">OUTSIDE REVIEW — ONCE PER SHOT</text>

  <rect class="panel" x="30" y="44" width="220" height="70" rx="9"/>
  <text class="t" x="140" y="68" text-anchor="middle">DCC scene</text>
  <text class="m" x="140" y="86" text-anchor="middle">shot_cam.abc</text>
  <text class="d" x="140" y="104" text-anchor="middle">Ogawa binary — never read by ReView</text>

  <path class="conn" d="M250 79 L290 79" marker-end="url(#arrow)"/>

  <rect class="panel" x="290" y="44" width="220" height="70" rx="9"/>
  <text class="t" x="400" y="68" text-anchor="middle">Extractor, run once</text>
  <text class="m" x="400" y="86" text-anchor="middle">abc_camera.py</text>
  <text class="d" x="400" y="104" text-anchor="middle">Blender headless, no extra libraries</text>

  <path class="conn" d="M510 79 L550 79" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="550" y="44" width="220" height="70" rx="9"/>
  <text class="t" x="660" y="68" text-anchor="middle">shot_cam.json</text>
  <text class="m" x="660" y="86" text-anchor="middle">{ fps, fovDeg, samples[] }</text>
  <text class="d" x="660" y="104" text-anchor="middle">the exchange format</text>

  <path class="conn-a" d="M660 114 L660 180 L140 180 L140 196" marker-end="url(#arrow-a)"/>

  <text class="d" x="30" y="166">INSIDE THE REVIEW</text>

  <rect class="panel" x="30" y="196" width="220" height="70" rx="9"/>
  <text class="t" x="140" y="220" text-anchor="middle">Import an animation</text>
  <text class="d" x="140" y="238" text-anchor="middle">Export panel of the review dock</text>
  <text class="d" x="140" y="256" text-anchor="middle">.json reads as samples, else glTF</text>

  <path class="conn" d="M250 231 L290 231" marker-end="url(#arrow)"/>

  <rect class="panel" x="290" y="196" width="220" height="70" rx="9"/>
  <text class="t" x="400" y="220" text-anchor="middle">v2 camera animation</text>
  <text class="m" x="400" y="238" text-anchor="middle">px py pz tx ty tz fov roll</text>
  <text class="d" x="400" y="256" text-anchor="middle">linear keys, editable in Curves</text>

  <path class="conn" d="M510 231 L550 231" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="550" y="196" width="220" height="70" rx="9"/>
  <text class="t" x="660" y="220" text-anchor="middle">Publish in Staging</text>
  <text class="d" x="660" y="238" text-anchor="middle">saved as the presentation and</text>
  <text class="d" x="660" y="256" text-anchor="middle">replayed for everyone in review</text>

  <path class="conn-o" d="M140 266 L140 286" marker-end="url(#arrow)"/>
  <path class="conn" d="M660 266 L660 286" marker-end="url(#arrow)"/>

  <rect class="panel-o" x="30" y="286" width="350" height="46" rx="9"/>
  <text class="l" x="205" y="308" text-anchor="middle">Re-import on the next version</text>
  <text class="d" x="205" y="324" text-anchor="middle">the JSON is the exchange format, not an attachment</text>

  <rect class="panel-d" x="410" y="286" width="370" height="46" rx="9"/>
  <text class="l" x="595" y="308" text-anchor="middle">At most 256 keys per channel</text>
  <text class="d" x="595" y="324" text-anchor="middle">a per-frame bake beyond 256 frames is refused on save</text>
</svg>
