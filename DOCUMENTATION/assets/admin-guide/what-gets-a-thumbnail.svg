<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="thumb-matrix-title thumb-matrix-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="thumb-matrix-title">Which media are queued for a server-side thumbnail, and what renders them</title>
  <desc id="thumb-matrix-desc">A 3D model is rendered by Blender from its converted GLB, or from the file itself when it is already a GLB. A splat stored as PLY or SPLAT is rendered by the built-in point rasteriser, which streams the file and keeps at most 160 000 points. Compressed splat containers are deliberately not queued. Video and image thumbnails come from the FFmpeg worker and are out of scope here.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="330" rx="10"/>

  <text class="d" x="28" y="32">WHAT IS QUEUED, AND WHAT RENDERS IT</text>

  <rect class="band" x="28" y="44" width="746" height="32" rx="9"/>
  <text class="d" x="44" y="64">MEDIA</text>
  <text class="d" x="250" y="64">SOURCE READ</text>
  <text class="d" x="506" y="64">RENDERER</text>
  <text class="d" x="712" y="64" text-anchor="middle">QUEUED?</text>

  <rect class="panel" x="28" y="84" width="746" height="46" rx="9"/>
  <text class="m" x="44" y="104">MODEL_3D</text>
  <text class="d" x="44" y="121">any source format</text>
  <text class="d" x="250" y="104">model.glb produced by the conversion</text>
  <text class="d" x="250" y="121">or the file itself when already .glb</text>
  <text class="l" x="506" y="104">Blender headless</text>
  <text class="d" x="506" y="121">Cycles on CPU</text>
  <text class="l ok" x="712" y="112" text-anchor="middle">Yes</text>

  <rect class="panel" x="28" y="136" width="746" height="46" rx="9"/>
  <text class="m" x="44" y="156">SPLAT</text>
  <text class="d" x="44" y="173">.ply or .splat</text>
  <text class="d" x="250" y="156">the splat file, read as a stream</text>
  <text class="d" x="250" y="173">never loaded into memory</text>
  <text class="l" x="506" y="156">Point rasteriser</text>
  <text class="d" x="506" y="173">160 000 points at most</text>
  <text class="l ok" x="712" y="164" text-anchor="middle">Yes</text>

  <rect class="panel" x="28" y="188" width="746" height="46" rx="9"/>
  <text class="m" x="44" y="208">SPLAT</text>
  <text class="d" x="44" y="225">.spz, .ksplat, .sog, .sogs</text>
  <text class="d" x="250" y="208">nothing is read</text>
  <text class="d" x="250" y="225">the job is never created</text>
  <text class="d" x="506" y="208">—</text>
  <text class="l no" x="712" y="204" text-anchor="middle">No</text>
  <text class="d" x="712" y="220" text-anchor="middle">on purpose</text>

  <rect class="panel" x="28" y="240" width="746" height="46" rx="9"/>
  <text class="m" x="44" y="260">VIDEO, IMAGE</text>
  <text class="d" x="44" y="277">out of scope on this page</text>
  <text class="d" x="250" y="260">the media itself</text>
  <text class="l" x="506" y="260">FFmpeg worker</text>
  <text class="d" x="506" y="277">on the media-processing queue</text>
  <text class="d" x="712" y="264" text-anchor="middle">n / a</text>

  <text class="d" x="28" y="308">A compressed container is left out on purpose: decoding it approximately would produce a wrong image nobody would question.</text>
  <text class="d" x="28" y="322">Those media keep relying on the capture the viewer takes the first time somebody opens the review.</text>
</svg>
