<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" width="800" height="448" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Registry mode versus local build</title>
  <desc id="fig-desc">Seven rows compare the two update modes: how each is chosen, which keys it needs in the .env file, what switching means, whether a version is mandatory, its precondition, what a rollback restores, and what it costs on the studio server.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="448" rx="10"/>

  <text class="d" x="40" y="34">HOW UPDATE.SH SWITCHES VERSIONS</text>

  <rect class="panel-a" x="290" y="52" width="230" height="34" rx="9"/>
  <text class="t" x="405" y="73" text-anchor="middle">Registry (recommended)</text>
  <rect class="panel" x="530" y="52" width="230" height="34" rx="9"/>
  <text class="t" x="645" y="73" text-anchor="middle">Local build (default)</text>

  <rect class="band" x="40" y="96" width="720" height="34" rx="9"/>
  <text class="l" x="52" y="117">Chosen by</text>
  <text class="d" x="405" y="117" text-anchor="middle">REVIEW_IMAGE_PREFIX in .env</text>
  <text class="d" x="645" y="117" text-anchor="middle">its absence</text>

  <text class="l" x="52" y="161">Keys it needs</text>
  <text class="d" x="405" y="161" text-anchor="middle">COMPOSE_FILE + PREFIX + TAG</text>
  <text class="d" x="645" y="161" text-anchor="middle">COMPOSE_FILE written by install.sh</text>

  <rect class="band" x="40" y="184" width="720" height="34" rx="9"/>
  <text class="l" x="52" y="205">Switching means</text>
  <text class="d" x="405" y="205" text-anchor="middle">docker compose pull, then up -d</text>
  <text class="d" x="645" y="205" text-anchor="middle">git checkout, then up -d --build</text>

  <text class="l" x="52" y="249">--version</text>
  <text class="d" x="405" y="249" text-anchor="middle">required — no implicit latest</text>
  <text class="d" x="645" y="249" text-anchor="middle">optional — fast-forwards the branch</text>

  <rect class="band" x="40" y="272" width="720" height="34" rx="9"/>
  <text class="l" x="52" y="293">Precondition</text>
  <text class="d" x="405" y="293" text-anchor="middle">registry reachable, tag published</text>
  <text class="d" x="645" y="293" text-anchor="middle">no locally modified tracked file</text>

  <text class="l" x="52" y="337">Rollback restores</text>
  <text class="d" x="405" y="337" text-anchor="middle">the previous image tag</text>
  <text class="d" x="645" y="337" text-anchor="middle">the previous commit, rebuilt</text>

  <rect class="band" x="40" y="360" width="720" height="34" rx="9"/>
  <text class="l" x="52" y="381">Cost on the server</text>
  <text class="d" x="405" y="381" text-anchor="middle">download only</text>
  <text class="d" x="645" y="381" text-anchor="middle">builds the ~3.6 GB worker image</text>

  <path class="conn" d="M284 90 L284 394"/>
  <path class="conn" d="M524 90 L524 394"/>

  <text class="d" x="400" y="424" text-anchor="middle">Both modes rewrite APP_VERSION — what /api/version, the About panel and review_worker_info report.</text>
</svg>
