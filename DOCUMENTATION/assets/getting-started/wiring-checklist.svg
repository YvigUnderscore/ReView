<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Proving the instance is really wired</title>
  <desc id="fig-desc">One readiness call answers for the database, Redis and storage at once; four commands answer the same questions one at a time. Two symptoms point at the worker and at the public storage endpoint.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="368" rx="10"/>

  <text class="d" x="40" y="30">ONE QUESTION</text>
  <text class="d" x="420" y="30">OR, ONE AT A TIME</text>
  <path class="conn-o" d="M400 44 L400 292"/>

  <rect class="panel-a" x="40" y="44" width="340" height="46" rx="9"/>
  <text class="t" x="210" y="66" text-anchor="middle">GET /health/ready</text>
  <text class="d" x="210" y="82" text-anchor="middle">200 ready · 503 degraded · result cached 5 s</text>
  <path class="conn-a" d="M210 90 L210 114" marker-end="url(#arrow-a)"/>

  <rect class="panel" x="40" y="118" width="340" height="34" rx="9"/>
  <text class="l" x="56" y="139">checks.database</text>
  <text class="d" x="364" y="139" text-anchor="end">SELECT 1</text>

  <rect class="panel" x="40" y="160" width="340" height="34" rx="9"/>
  <text class="l" x="56" y="181">checks.redis</text>
  <text class="d" x="364" y="181" text-anchor="end">PING</text>

  <rect class="panel" x="40" y="202" width="340" height="34" rx="9"/>
  <text class="l" x="56" y="223">checks.storage</text>
  <text class="d" x="364" y="223" text-anchor="end">bucket reachable</text>

  <text class="d" x="40" y="258">Each check has a 2 s timeout, and a 503</text>
  <text class="d" x="40" y="274">names the dependency that failed.</text>

  <rect class="panel" x="420" y="44" width="350" height="46" rx="9"/>
  <text class="l" x="436" y="66">Schema migrated</text>
  <text class="m" x="436" y="82">psql -U review -d review -c '\dt'</text>

  <rect class="panel" x="420" y="100" width="350" height="46" rx="9"/>
  <text class="l" x="436" y="122">Queues instrumented</text>
  <text class="m" x="436" y="138">curl /metrics | grep review_queue_jobs</text>

  <rect class="panel" x="420" y="156" width="350" height="46" rx="9"/>
  <text class="l" x="436" y="178">Worker consuming</text>
  <text class="m" x="436" y="194">docker compose logs worker</text>

  <rect class="panel" x="420" y="212" width="350" height="46" rx="9"/>
  <text class="l" x="436" y="234">Bucket created at boot</text>
  <text class="m" x="436" y="250">docker compose exec minio mc ls local/review</text>

  <rect class="panel-w" x="40" y="304" width="340" height="46" rx="9"/>
  <text class="l" x="210" y="326" text-anchor="middle">Upload stays in UPLOADING</text>
  <text class="d" x="210" y="342" text-anchor="middle">the worker or Redis — see Jobs &amp; workers</text>

  <rect class="panel-w" x="420" y="304" width="350" height="46" rx="9"/>
  <text class="l" x="595" y="326" text-anchor="middle">Presigned URL unreachable</text>
  <text class="d" x="595" y="342" text-anchor="middle">S3_PUBLIC_ENDPOINT points elsewhere</text>
</svg>
