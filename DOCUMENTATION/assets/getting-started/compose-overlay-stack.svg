<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Which compose files make your stack</title>
  <desc id="fig-desc">The base docker-compose.yml carries every service. Development adds the auto-loaded override, which turns the production guards off. Production stacks the production overlay, optionally the release overlay, and the site overlay written by the installer.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="412" rx="10"/>

  <text class="d" x="40" y="30">WHICH FILES A BARE docker compose LOADS</text>

  <rect class="panel-a" x="40" y="44" width="720" height="46" rx="9"/>
  <text class="t" x="400" y="66" text-anchor="middle">install.sh writes COMPOSE_FILE and COMPOSE_PATH_SEPARATOR into .env</text>
  <text class="d" x="400" y="82" text-anchor="middle">a bare docker compose up -d then loads exactly these files — no forgotten -f</text>

  <text class="d" x="40" y="120">DEVELOPMENT — OVERRIDE AUTO-LOADED</text>
  <text class="d" x="420" y="120">PRODUCTION — WHAT THE INSTALLER WRITES</text>
  <path class="conn-o" d="M400 132 L400 310"/>

  <rect class="panel-d" x="40" y="196" width="340" height="46" rx="9"/>
  <text class="t no" x="210" y="218" text-anchor="middle">NODE_ENV=development</text>
  <text class="d" x="210" y="234" text-anchor="middle">production guards off — never deploy this</text>

  <rect class="panel" x="40" y="260" width="340" height="46" rx="9"/>
  <text class="l" x="210" y="282" text-anchor="middle">docker-compose.override.yml</text>
  <text class="d" x="210" y="298" text-anchor="middle">Postgres 5432 + Redis 6379 on DEV_BIND</text>

  <rect class="panel" x="420" y="132" width="340" height="46" rx="9"/>
  <text class="l" x="590" y="154" text-anchor="middle">deploy/compose.site.yml</text>
  <text class="d" x="590" y="170" text-anchor="middle">rendered nginx.conf · volumes under DATA_ROOT</text>

  <rect class="panel" x="420" y="196" width="340" height="46" rx="9"/>
  <text class="l" x="590" y="218" text-anchor="middle">docker-compose.release.yml</text>
  <text class="d" x="590" y="234" text-anchor="middle">published images — PREFIX + TAG required</text>

  <rect class="panel-a" x="420" y="260" width="340" height="46" rx="9"/>
  <text class="l" x="590" y="282" text-anchor="middle">docker-compose.prod.yml</text>
  <text class="d" x="590" y="298" text-anchor="middle">nginx TLS 80/443 · no host port · ${VAR:?}</text>

  <rect class="panel" x="40" y="318" width="720" height="46" rx="9"/>
  <text class="t" x="400" y="340" text-anchor="middle">docker-compose.yml — the base stack</text>
  <text class="d" x="400" y="356" text-anchor="middle">postgres · minio · redis · backend · worker · frontend — NODE_ENV=production</text>

  <text class="d" x="400" y="390" text-anchor="middle">With --tls none the installer writes base + site only — no production overlay, and MINIO_BIND=0.0.0.0.</text>
</svg>
