<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 648" width="800" height="648" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">What scripts/install.sh does, in order</title>
  <desc id="fig-desc">Eight ordered steps: prerequisites, four questions, six secrets, untracked files written, certificate, build and start, wait for readiness, print the setup URL. The TLS mode decides what happens at the certificate step, and two failures stop the run.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="648" rx="10"/>

  <text class="d" x="40" y="34">ORDERED STEPS</text>
  <text class="d" x="444" y="34">WHAT DEPENDS ON YOUR ANSWERS</text>
  <rect class="band" x="424" y="46" width="346" height="550" rx="10"/>

  <!-- Colonne des étapes -->
  <rect class="panel" x="40" y="60" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="82" text-anchor="middle">1 · Prerequisites</text>
  <text class="d" x="218" y="98" text-anchor="middle">docker, compose ≥ 2.24, daemon answering, no .env</text>
  <path class="conn" d="M218 106 L218 130" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="130" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="152" text-anchor="middle">2 · Four questions</text>
  <text class="d" x="218" y="168" text-anchor="middle">domain, TLS mode, timezone, data root</text>
  <path class="conn" d="M218 176 L218 200" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="200" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="222" text-anchor="middle">3 · Six secrets drawn</text>
  <text class="d" x="218" y="238" text-anchor="middle">openssl rand -hex 32, or /dev/urandom if absent</text>
  <path class="conn" d="M218 246 L218 270" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="270" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="292" text-anchor="middle">4 · Untracked files written</text>
  <text class="d" x="218" y="308" text-anchor="middle">.env (chmod 600), deploy/nginx.conf, compose.site.yml</text>
  <path class="conn" d="M218 316 L218 340" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="40" y="340" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="362" text-anchor="middle">5 · Certificate</text>
  <text class="d" x="218" y="378" text-anchor="middle">four possible outcomes</text>
  <path class="conn" d="M218 386 L218 410" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="410" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="432" text-anchor="middle">6 · Build and start</text>
  <text class="m" x="218" y="448" text-anchor="middle">docker compose up -d --build</text>
  <path class="conn" d="M218 456 L218 480" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="480" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="502" text-anchor="middle">7 · Wait for the API</text>
  <text class="m" x="218" y="518" text-anchor="middle">/health/ready in the container, 60 × 5 s</text>
  <path class="conn" d="M218 526 L218 550" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="40" y="550" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="572" text-anchor="middle">8 · Prints where to go</text>
  <text class="m" x="218" y="588" text-anchor="middle">https://&lt;domain&gt;/setup</text>

  <!-- Colonne des conséquences -->
  <path class="conn-a" d="M396 153 L444 153" marker-end="url(#arrow-a)"/>
  <rect class="panel-o" x="444" y="130" width="306" height="46" rx="9"/>
  <text class="l" x="462" y="152">With --tls letsencrypt</text>
  <text class="d" x="462" y="168">a fifth question: the contact address</text>

  <path class="conn-a" d="M396 363 L444 363" marker-end="url(#arrow-a)"/>
  <rect class="panel-o" x="444" y="300" width="306" height="136" rx="9"/>
  <text class="l" x="462" y="322">The TLS mode decides</text>
  <text class="a" x="546" y="350" text-anchor="end">letsencrypt</text>
  <text class="d" x="556" y="350">certbot standalone, port 80 free</text>
  <text class="a" x="546" y="374" text-anchor="end">selfsigned</text>
  <text class="d" x="556" y="374">825 days, browser warning</text>
  <text class="a" x="546" y="398" text-anchor="end">existing</text>
  <text class="d" x="556" y="398">nginx/certs/*.pem expected</text>
  <text class="a" x="546" y="422" text-anchor="end">none</text>
  <text class="d" x="556" y="422">no nginx, no production overlay</text>

  <path class="conn" d="M396 503 L444 503" marker-end="url(#arrow)"/>
  <rect class="panel-d" x="444" y="464" width="306" height="78" rx="9"/>
  <text class="t no" x="462" y="486">Two ways it stops</text>
  <text class="d" x="462" y="508">certbot fails — nothing is started</text>
  <text class="d" x="462" y="526">not ready in 5 min — prints docker compose ps</text>

  <text class="d" x="400" y="624" text-anchor="middle">No tracked file is touched: a later git pull or git checkout vX.Y.Z still applies cleanly.</text>
</svg>
