<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" width="800" height="416" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">From an empty database to a signed-in studio</title>
  <desc id="fig-desc">Three states: an empty database where every route redirects to the setup wizard, a studio with its first administrator signed in, and an installed instance where the wizard is gone and accounts come from the administration.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="416" rx="10"/>

  <text class="d" x="40" y="30">STATE OF THE INSTANCE</text>
  <text class="d" x="384" y="30">WHAT IS TRUE THERE</text>
  <rect class="band" x="364" y="40" width="406" height="356" rx="10"/>

  <rect class="panel" x="40" y="50" width="300" height="46" rx="9"/>
  <text class="t" x="190" y="72" text-anchor="middle">Empty database</text>
  <text class="d" x="190" y="88" text-anchor="middle">no studio row yet</text>

  <text class="d" x="384" y="60">GET /api/setup/status → { needsSetup: true }</text>
  <text class="d" x="384" y="78">every SPA route redirects to /setup</text>
  <text class="d" x="384" y="96">/api/setup — 10 requests / 15 min / IP</text>

  <path class="conn-a" d="M80 96 L80 180" marker-end="url(#arrow-a)"/>
  <text class="a" x="100" y="124">POST /api/setup → 201 Created</text>
  <text class="d" x="100" y="140">studio and first ADMIN in one call</text>
  <text class="d" x="100" y="156">Serializable transaction — one winner</text>

  <rect class="panel-a" x="40" y="180" width="300" height="46" rx="9"/>
  <text class="t" x="190" y="202" text-anchor="middle">Studio + first ADMIN</text>
  <text class="d" x="190" y="218" text-anchor="middle">you are signed in already</text>

  <text class="d" x="384" y="190">the wizard signs the administrator in</text>
  <text class="d" x="384" y="208">access token in localStorage, no refresh token</text>
  <text class="d" x="384" y="226">renewed only by signing in again at expiry</text>

  <path class="conn" d="M80 226 L80 310" marker-end="url(#arrow)"/>
  <text class="a" x="100" y="254">any later attempt</text>
  <text class="d" x="100" y="270">the studio count is no longer zero</text>

  <rect class="panel" x="40" y="310" width="300" height="46" rx="9"/>
  <text class="t" x="190" y="332" text-anchor="middle">Installed for good</text>
  <text class="d" x="190" y="348" text-anchor="middle">the wizard is gone</text>

  <text class="d" x="384" y="320">POST /api/setup → 409 ALREADY_SETUP</text>
  <text class="d" x="384" y="338">the /setup route is no longer registered</text>
  <text class="d" x="384" y="356">accounts come from Admin → Users, invitations, SSO</text>
</svg>
