<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" width="800" height="498" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">Who talks to whom in a ReView stack</title>
  <desc id="fig-desc">The browser enters through the frontend container in development or through the TLS nginx in production, and reaches media directly on MinIO with presigned URLs. Backend and worker share PostgreSQL, Redis and MinIO underneath.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="498" rx="10"/>

  <text class="d" x="40" y="30">WHO TALKS TO WHOM</text>

  <rect class="panel" x="330" y="44" width="140" height="34" rx="9"/>
  <text class="t" x="400" y="65" text-anchor="middle">Browser</text>

  <text class="a" x="770" y="48" text-anchor="end">presigned PUT / GET — S3_PUBLIC_ENDPOINT</text>
  <path class="conn-a" d="M470 61 L778 61 L778 413 L742 413" marker-end="url(#arrow-a)"/>

  <path class="conn" d="M400 78 L400 96 L205 96 L205 116" marker-end="url(#arrow)"/>
  <path class="conn" d="M400 78 L400 96 L595 96 L595 116" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="116" width="330" height="46" rx="9"/>
  <text class="l" x="205" y="138" text-anchor="middle">Development — frontend nginx :3429</text>
  <text class="d" x="205" y="154" text-anchor="middle">/api/ · /socket.io/ → backend · / → SPA</text>

  <rect class="panel-a" x="430" y="116" width="330" height="46" rx="9"/>
  <text class="l" x="595" y="138" text-anchor="middle">Production — nginx TLS :443, sole entry point</text>
  <text class="d" x="595" y="154" text-anchor="middle">same routes, plus /review/… → minio, HLS cached 2 h</text>

  <path class="conn" d="M205 162 L205 194 L250 194 L250 224" marker-end="url(#arrow)"/>
  <path class="conn" d="M595 162 L595 194 L290 194 L290 224" marker-end="url(#arrow)"/>

  <rect class="panel" x="140" y="224" width="240" height="46" rx="9"/>
  <text class="t" x="260" y="246" text-anchor="middle">backend</text>
  <text class="d" x="260" y="262" text-anchor="middle">Express 5 + Socket.io · :3000</text>

  <rect class="panel" x="420" y="224" width="240" height="46" rx="9"/>
  <text class="t" x="540" y="246" text-anchor="middle">worker</text>
  <text class="d" x="540" y="262" text-anchor="middle">six consumers · metrics :9101</text>

  <path class="conn" d="M260 270 L260 340"/>
  <path class="conn" d="M540 270 L540 340"/>
  <path class="conn" d="M160 340 L640 340"/>
  <text class="d" x="400" y="332" text-anchor="middle">SQL (Prisma) · BullMQ · S3 presign, read and write</text>
  <path class="conn" d="M160 340 L160 390" marker-end="url(#arrow)"/>
  <path class="conn" d="M400 340 L400 390" marker-end="url(#arrow)"/>
  <path class="conn" d="M640 340 L640 390" marker-end="url(#arrow)"/>

  <rect class="panel" x="60" y="390" width="200" height="46" rx="9"/>
  <text class="l" x="160" y="412" text-anchor="middle">postgres:16-alpine</text>
  <text class="d" x="160" y="428" text-anchor="middle">volume pgdata</text>

  <rect class="panel" x="300" y="390" width="200" height="46" rx="9"/>
  <text class="l" x="400" y="412" text-anchor="middle">redis:7-alpine</text>
  <text class="d" x="400" y="428" text-anchor="middle">redisdata · no password</text>

  <rect class="panel-a" x="540" y="390" width="200" height="46" rx="9"/>
  <text class="l" x="640" y="412" text-anchor="middle">minio</text>
  <text class="d" x="640" y="428" text-anchor="middle">9000 · console 9001 · miniodata</text>

  <rect class="panel-o" x="40" y="452" width="720" height="34" rx="9"/>
  <text class="d" x="400" y="473" text-anchor="middle">opt-in profiles — prometheus and grafana on 127.0.0.1:3431, clamav reached through CLAMAV_HOST</text>
</svg>
