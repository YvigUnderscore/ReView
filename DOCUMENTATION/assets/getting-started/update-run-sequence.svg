<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="fig-title fig-desc">
  <!-- SPDX-FileCopyrightText: 2026 Yvig Bidon -->
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <title id="fig-title">One run of scripts/update.sh, step by step</title>
  <desc id="fig-desc">The script reads the current version, confirms, backs up, switches images or checkout, lets the backend migrate, then polls readiness inside the container. A ready instance keeps the backup; an unready one is rolled back automatically.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-a { fill: #e6f7fa; stroke: #0e7490; stroke-width: 1.5; }
    .panel-w { fill: #fef6e7; stroke: #b45309; stroke-width: 1.5; }
    .panel-d { fill: #fdeceb; stroke: #b91c1c; stroke-width: 1.5; }
    .panel-o { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #eef2f7; stroke: none; }
    .t { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l { fill: #1e293b; font: 500 12px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .d { fill: #5a6779; font: 400 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { fill: #5a6779; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0e7490; font: 600 11px ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ok { fill: #15803d; }
    .no { fill: #b91c1c; }
    .conn { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .conn-a { stroke: #0e7490; stroke-width: 1.5; fill: none; }
    .conn-o { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #94a3b8; }
    .head-a { fill: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d121b; }
      .panel { fill: #151b27; stroke: #2a3348; }
      .panel-a { fill: #06262c; stroke: #22d3ee; }
      .panel-w { fill: #2a2109; stroke: #f5b301; }
      .panel-d { fill: #2b1113; stroke: #f87171; }
      .panel-o { fill: #151b27; stroke: #4a5872; }
      .band { fill: #111725; }
      .t { fill: #e6ebef; }
      .l { fill: #cfd7e2; }
      .d { fill: #93a0b4; }
      .m { fill: #93a0b4; }
      .a { fill: #22d3ee; }
      .ok { fill: #34d399; }
      .no { fill: #f87171; }
      .conn { stroke: #4a5872; }
      .conn-a { stroke: #22d3ee; }
      .conn-o { stroke: #4a5872; }
      .head { fill: #4a5872; }
      .head-a { fill: #22d3ee; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="640" rx="10"/>

  <text class="d" x="40" y="34">ONE RUN OF scripts/update.sh</text>
  <text class="d" x="444" y="34">WHAT IT COSTS</text>
  <rect class="band" x="424" y="46" width="346" height="440" rx="10"/>

  <rect class="panel" x="40" y="60" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="82" text-anchor="middle">1 · Read the current state</text>
  <text class="d" x="218" y="98" text-anchor="middle">.env: APP_VERSION, REVIEW_IMAGE_TAG, git HEAD</text>
  <path class="conn" d="M218 106 L218 128" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="128" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="150" text-anchor="middle">2 · Confirm</text>
  <text class="d" x="218" y="166" text-anchor="middle">skipped by --yes</text>
  <path class="conn" d="M218 174 L218 196" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="196" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="218" text-anchor="middle">3 · Back up</text>
  <text class="d" x="218" y="234" text-anchor="middle">backup.sh → BACKUP_ID; a failure aborts here</text>
  <path class="conn" d="M218 242 L218 264" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="40" y="264" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="286" text-anchor="middle">4 · Switch</text>
  <text class="d" x="218" y="302" text-anchor="middle">registry: pull · build: checkout, then up -d --build</text>
  <path class="conn" d="M218 310 L218 332" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="332" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="354" text-anchor="middle">5 · Migrate</text>
  <text class="d" x="218" y="370" text-anchor="middle">prisma migrate deploy, run by the backend at boot</text>
  <path class="conn" d="M218 378 L218 400" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="400" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="422" text-anchor="middle">6 · Poll readiness</text>
  <text class="d" x="218" y="438" text-anchor="middle">/health/ready every 5 s, until --timeout</text>
  <path class="conn" d="M218 446 L218 468" marker-end="url(#arrow)"/>

  <rect class="panel-w" x="40" y="468" width="356" height="46" rx="9"/>
  <text class="t" x="218" y="490" text-anchor="middle">7 · Ready before the deadline?</text>
  <text class="d" x="218" y="506" text-anchor="middle">300 s by default</text>

  <path class="conn" d="M160 514 L160 528 L215 528 L215 540" marker-end="url(#arrow)"/>
  <path class="conn" d="M280 514 L280 528 L585 528 L585 540" marker-end="url(#arrow)"/>

  <rect class="panel-a" x="40" y="540" width="350" height="46" rx="9"/>
  <text class="t ok" x="215" y="562" text-anchor="middle">Yes — done</text>
  <text class="d" x="215" y="578" text-anchor="middle">prints /api/version, keeps the backup</text>

  <rect class="panel-d" x="410" y="540" width="350" height="46" rx="9"/>
  <text class="t no" x="585" y="562" text-anchor="middle">No — automatic rollback</text>
  <text class="d" x="585" y="578" text-anchor="middle">last 50 log lines, previous tag or commit</text>

  <path class="conn-a" d="M396 83 L444 83" marker-end="url(#arrow-a)"/>
  <rect class="panel-o" x="444" y="60" width="306" height="46" rx="9"/>
  <text class="l" x="462" y="82">This is what a rollback returns to</text>
  <text class="d" x="462" y="98">the previous tag, or the previous commit</text>

  <path class="conn-a" d="M396 219 L444 219" marker-end="url(#arrow-a)"/>
  <rect class="panel-o" x="444" y="196" width="306" height="46" rx="9"/>
  <text class="l" x="462" y="218">--no-backup</text>
  <text class="d" x="462" y="234">no database rollback is possible at all</text>

  <path class="conn" d="M396 355 L444 355" marker-end="url(#arrow)"/>
  <rect class="panel-d" x="444" y="332" width="306" height="46" rx="9"/>
  <text class="t no" x="462" y="354">Migrations are one-way</text>
  <text class="d" x="462" y="370">the code goes back, the schema does not</text>

  <path class="conn-a" d="M396 423 L444 423" marker-end="url(#arrow-a)"/>
  <rect class="panel-o" x="444" y="400" width="306" height="46" rx="9"/>
  <text class="l" x="462" y="422">Probed inside the container</text>
  <text class="d" x="462" y="438">no assumption about host ports or TLS</text>

  <text class="d" x="40" y="608">Previous version healthy — the new one cannot run here: a migration, or a newly required variable.</text>
  <text class="d" x="40" y="626">Previous version also unhealthy — not a version problem: disk, MinIO, or the database.</text>
</svg>
