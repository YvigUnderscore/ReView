# Ops agent: a SEPARATE compose project (`review-ops`), never listed in `COMPOSE_FILE`.
#
# ⚠ This is the central invariant of the whole mechanism. `scripts/update.sh` runs
# `docker compose up -d` WITHOUT a service list, so everything in the main project is
# recreated. An agent declared in that stack would destroy itself halfway through its own run,
# leaving the instance half-switched with nobody left to roll back. Two safeguards enforce it:
# `scripts/ops-agent.sh install` refuses to install if `.env` mentions this file, and
# `scripts/ops-agent.test.mjs` checks it.
#
# So this file is never started on its own:
#   bash scripts/ops-agent.sh install     # starts the agent
#   bash scripts/ops-agent.sh status      # what it sees
#   bash scripts/ops-agent.sh logs
#
# The `:?` checks are safe here precisely because this file takes part in no other compose
# command.
services:
  ops:
    image: ${REVIEW_OPS_IMAGE:?REVIEW_OPS_IMAGE is required (e.g. ghcr.io/yvigunderscore/review-ops:v2.4.0)}
    container_name: review-ops-agent
    volumes:
      # The daemon socket: this is the container's entire privilege, and the reason it is the
      # only one to hold it. The backend, reachable from the internet, never has it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Relative source (resolved by the compose client against the project directory, i.e.
      # the repository on the host) -> ABSOLUTE target, identical to the host path.
      #
      # This matters: `scripts/backup.sh` takes its `pwd` and passes it as is to
      # `docker run -v "$HOST_DIR:/backup"`, which the DAEMON resolves on the host. Mounted
      # anywhere else, the MinIO mirror would write into an empty directory without a single
      # error, and nobody would notice until the day of the restore. The agent checks this
      # with a marker file before accepting any order.
      - .:${REVIEW_ROOT:?REVIEW_ROOT is required (absolute path of the repository on the host)}
    working_dir: ${REVIEW_ROOT}
    environment:
      REVIEW_ROOT: ${REVIEW_ROOT}
      REVIEW_OPS_IMAGE: ${REVIEW_OPS_IMAGE}
      OPS_POLL_SEC: ${OPS_POLL_SEC:-2}
      OPS_MAX_RUNTIME: ${OPS_MAX_RUNTIME:-3600}
      TZ: ${TZ:-Europe/Paris}
    # No network: `pull`, `run` and `exec` are performed by the DAEMON, not by this container.
    # An agent holding the socket has no reason to also be able to send requests; that removes
    # half of any exfiltration path.
    network_mode: "none"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
