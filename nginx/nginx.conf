# ReView — production TLS reverse proxy.
# Replace YOUR_DOMAIN with the real domain name.
# TLS certificates (Let's Encrypt or other) are mounted into the container.

# ── Compression ──────────────────────────────────────────────────────────────────────────
# `gzip_proxied any` is the directive that matters: its default is `off`, and EVERY
# response from this server is proxied (frontend, backend, MinIO). Without it, `gzip on`
# compresses nothing at all.
#
# ⚠ BREACH: compressing authenticated responses over TLS is theoretically exploitable when
# attacker-controlled input is reflected in a response that also carries a secret. ReView
# never reflects a token in a response body (the JWT travels in the `Authorization`
# header) and CORS forbids cross-origin reads: this is the same trade-off any JSON API
# behind nginx makes.
gzip on;
gzip_vary on;              # Vary: Accept-Encoding — required behind any cache
gzip_comp_level 5;         # higher levels cost more CPU than they save in bytes
gzip_min_length 1024;      # below 1 KB the gzip overhead outweighs the gain
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/markdown
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/wasm
    application/vnd.apple.mpegurl
    image/svg+xml
    font/ttf
    font/otf;
# text/html is always compressed by nginx: do not list it (it would be listed twice).
# No woff2, images or video segments: already compressed, and a .ts segment is binary.
# HLS PLAYLISTS (`application/vnd.apple.mpegurl`) are highly repetitive text and large,
# since every segment is a presigned URL (~450 characters each, ~130 KB for ten minutes):
# they compress by an order of magnitude.
# A response already compressed upstream (the frontend container gzips too) is passed
# through as is — nginx never recompresses.

# No `upstream` block: nginx resolves names there only once, at startup.
#
# In a docker stack every service restart gets a new address; a proxy holding the old one
# answers 502 for the WHOLE application after each `scripts/update.sh`, until it is
# restarted too. Docker's internal resolver plus a variable in `proxy_pass` forces
# resolution on every request. With a variable, nginx no longer appends the original URI,
# so every `proxy_pass` below carries `$request_uri` explicitly.
resolver 127.0.0.11 valid=10s ipv6=off;

# ⚠ Prefix collision between storage and the application: presigned URLs are path-style
# (`/<bucket>/<key>`) and the default bucket is named "review" — but the app also has a
# `/review/:mediaId` route (frontend/src/v2/App.tsx). Both live under the same prefix, and
# sending all of `/review/` to MinIO would return an XML `AccessDenied` on every review
# page load.
#
# They cannot be split on the path: the AWS v4 signature covers the URI, so rewriting the
# prefix would invalidate every presigned URL. They are split on the signature instead —
# by design (see backend/src/services/StorageService.ts) EVERY storage access is either
# presigned (`X-Amz-Signature` in the query) or authenticated by header (mc and other S3
# tools). A browser navigation to /review/<slug> has neither and goes to the SPA.
map $args $review_presigned {
    default                   0;
    "~*(^|&)X-Amz-Signature=" 1;
}
map $http_authorization $review_s3_auth {
    default 1;
    ""      0;
}
map $review_presigned$review_s3_auth $review_to_minio {
    "00"    0;
    default 1;
}

# ── HLS segments: served from storage, cached here ───────────────────────────────────────
# The API only authorizes the manifests; each segment in them is a presigned MinIO URL, so
# video bytes never go through Node.
#
# URLs are signed per fifteen-minute window (backend/src/lib/hlsPlaylist.ts): every viewer
# of the same dailies session gets IDENTICAL URLs, and the cache below turns twenty MinIO
# reads into one (`proxy_cache_lock` lets the first request fill the entry while the
# others wait for it instead of hitting MinIO in parallel).
#
# ⚠ The signature is part of the cache key: an entry is reachable only by a client the API
# already handed the manifest to. A guessed path hits nothing.
#
# ⚠ /var/cache/nginx must be a NAMED VOLUME (`nginx_cache`, docker-compose.prod.yml).
# Without it, these 2 GB — plus temporary request bodies, see client_body_temp_path — land
# in the container's writable layer, i.e. /var/lib/docker, the same filesystem as pgdata
# and miniodata; and every `scripts/update.sh` recreates the container, emptying the cache
# right before the first dailies session after the update.
proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=review_hls:10m max_size=2g
                 inactive=3h use_temp_path=off;

# Cache-Control is chosen from the STATUS, never set on an error. An expired presigned URL
# returns 403 — caching that for a year in the browser would make the media unplayable
# until the cache is cleared by hand. nginx does not emit a header whose value is empty.
map $status $review_hls_cache_control {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    default "";
}

# A presigned request already carries its proof of access: the application's session
# token has no business there, and forwarding it would write it into the storage logs.
# It is stripped — but only where the signature replaces it, so S3 tools that do
# authenticate by header (`mc` and the like) keep working.
map $review_presigned $review_storage_auth {
    1       "";
    default $http_authorization;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Liveness probe of this proxy itself (docker healthcheck, see docker-compose.prod.yml).
    # Local only and answered WITHOUT going upstream: it means "the proxy accepts and
    # answers", not "the whole stack is healthy" — real readiness is the API's /health/ready.
    location = /healthz {
        access_log off;
        # ⚠ `allow`/`deny` would have NO EFFECT here: they run in the access phase, while
        # `return` short-circuits in the earlier rewrite phase. The address filter must
        # therefore be in the same phase, before the `return` — one of the two safe uses of
        # `if` inside a `location`.
        # 404 rather than 403: the probe does not advertise itself to unauthorized clients.
        if ($remote_addr !~ "^(127\.0\.0\.1|::1)$") {
            return 404;
        }
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ⚠ The redirect is INSIDE a `location`, not at server level: a server-level `return`
    # runs in the server rewrite phase, BEFORE location selection, and would also redirect
    # /healthz (the probe would get a 301 to https://YOUR_DOMAIN).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Separate directive: `listen … http2` is deprecated since nginx 1.25 and logs a
    # warning at every start.
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers. ⚠ Only inherited by locations that set NO `add_header` of their own
    # — every location below that sets one repeats the headers it needs.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # X-XSS-Protection is deliberately NOT repeated in locations that set their own
    # headers: browsers have removed the XSS auditor (which itself introduced flaws). The
    # CSP `frame-ancestors` supersedes X-Frame-Options.
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Plain http:// on the TLS port. The `listen 80` block above only helps if port 80 is
    # published: when the instance exposes only its HTTPS port (or an upstream proxy talks
    # to it in clear text), an "http://" address lands here and nginx answers with a raw
    # "400 — The plain HTTP request was sent to HTTPS port" page. 497 is nginx's internal
    # code for exactly that case: catch it and redirect. `$http_host` rather than `$host`:
    # only it keeps the port, otherwise the redirect would point to a dead address.
    error_page 497 =301 https://$http_host$request_uri;

    # ⚠ Default body limit, inherited by every location that does not set one.
    #
    # Only `location /review/` streams unbuffered (`proxy_request_buffering off`): everywhere
    # else nginx writes the WHOLE body to a temporary file (client_body_temp_path, under
    # /var/cache/nginx) BEFORE opening the connection to the backend, so the backend's own
    # limits never get a chance to apply. With no limit here, slow anonymous POSTs to
    # /api/auth/login could fill the host disk without any account. `0` (unlimited) is
    # therefore set only where presigned uploads really need it.
    client_max_body_size 2m;

    # Targets resolved on every request (see the comment on `resolver` above).
    set $review_backend  http://backend:3000;
    set $review_frontend http://frontend:80;
    set $review_minio    http://minio:9000;

    # Backend API
    location /api/ {
        # Largest legitimate API body: the splat edit JSON (bitset mask), capped at 8 MB in
        # backend/src/app.ts; the ShotGrid webhook allows 5 MB and everything else 2 MB.
        # Above that nginx answers 413 without writing anything to disk — files never come
        # through here (presigned URL straight to MinIO).
        client_max_body_size 8m;
        proxy_pass $review_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.io (websocket)
    location /socket.io/ {
        proxy_pass $review_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO behind the proxy: path-style presigned URLs https://<domain>/<bucket>/… — set
    # S3_PUBLIC_ENDPOINT=https://<domain> so the signed Host header is preserved.
    # ⚠ Adjust the prefixes below if S3_BUCKET is not "review".
    #
    # ⚠ These objects are user-uploaded files served on THE SAME ORIGIN as the application.
    # Unguarded, a file rendered as HTML or SVG would run script with access to the session
    # token. The backend already neutralises the Content-Type when signing
    # (backend/src/lib/uploadContentType.ts); the CSP `sandbox` on `location /review/` is
    # the second barrier: opaque origin, no script, no navigation — whatever the type.
    #
    # HLS segments (`<bucket>/derived/<id>/hls/<name>.ts`) — see `proxy_cache_path` at the
    # top of the file. A regex location takes precedence over the `/review/` prefix below;
    # it differs from it only in two things the cache needs: `proxy_buffering on` (nginx
    # NEVER fills the cache in unbuffered mode) and no SPA ambiguity (no app route looks like
    # `/review/derived/<n>/hls/…`, so the `$review_to_minio` guard is not needed here).
    location ~ ^/review/derived/[0-9]+/hls/[^/]+\.(?:ts|m4s)$ {
        proxy_pass $review_minio$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $review_storage_auth;
        proxy_buffering on;

        proxy_cache review_hls;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # Presigned URLs live two hours: past that nobody requests this one any more (the
        # player refetches the manifest and gets fresh URLs).
        proxy_cache_valid 200 2h;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;

        # ⚠ `add_header` here cancels inheritance from `server`: needed headers are
        # repeated. No CSP — it does not apply to a media subresource.
        add_header Cache-Control $review_hls_cache_control always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /review/ {
        # See the `map` blocks at the top of the file. Storage is the default because it
        # carries the requests with a body (upload PUT, streamed unbuffered). An SPA
        # navigation is a body-less GET — diverting it through an internal redirect is safe,
        # the reverse is not.
        error_page 418 = @review_spa;
        if ($review_to_minio = 0) { return 418; }

        # The only place where "no limit" is justified: a 200 GB rush is uploaded here as a
        # presigned PUT, and `proxy_request_buffering off` streams it to MinIO without ever
        # touching nginx's disk. MinIO itself rejects a request whose signature does not
        # match: the body is not accepted on nginx's word alone.
        client_max_body_size 0;
        proxy_pass $review_minio$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # video streaming
        proxy_request_buffering off;  # presigned uploads (PUT) with no disk buffering

        # ⚠ Any `add_header` here cancels inheritance from `server`: needed headers are
        # repeated explicitly.
        add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Navigation to /review/<slug>: an application page, not a storage object. Same headers
    # as `location /` — the user sees a normal page.
    # ⚠ The CSP must stay IDENTICAL to the one in `location /` (same page, same policy):
    # any change here must be copied there, and vice versa.
    location @review_spa {
        proxy_pass $review_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' blob:; connect-src 'self' blob: data:" always;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite build assets: hashed names (`index-a1b2c3d4.js`), immutable content.
    # The frontend container already sets this policy; it is repeated at the edge so it does
    # not depend on the image behind. `immutable` removes even the revalidation request.
    # index.html is NOT cached (served by `location /`, the frontend container sets
    # `no-cache` on it).
    #
    # ⚠ No CSP here: a policy on a .js or .woff2 file is never applied by the browser (it
    # only applies to documents). Headers that do matter on a subresource are repeated —
    # `add_header` cancels inheritance.
    #
    # ⚠⚠ The match is on the file EXTENSION, not the prefix. As `location ^~ /assets/` this
    # block would also capture the app route `/assets/:id` (asset page): the HTML page would
    # go out `immutable` with a one-year expiry — stuck in browser caches across deploys —
    # and WITHOUT the application CSP set by `location /`. Only the extension separates the
    # two namespaces.
    location ~ ^/assets/.+\.(js|mjs|css|map|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|wasm)$ {
        proxy_pass $review_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Frontend (React SPA)
    location / {
        proxy_pass $review_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Application Content-Security-Policy. The SPA is served by the frontend container,
        # out of reach of the backend's helmet, so the policy is set here. It limits the
        # impact of an injection: no third-party script, no inline script, no exfiltration
        # to an external domain.
        #   - 'wasm-unsafe-eval': hash-wasm (upload fingerprints) and the three.js decoders;
        #   - blob: in script/worker/media: transcoding workers and HLS playback;
        #   - 'unsafe-inline' for styles only: Tailwind and runtime-set styles.
        # ⚠ No bare `ws:` or `wss:` in `connect-src`: a bare scheme allows ANY host on that
        # scheme, i.e. `new WebSocket('wss://evil.example')` — and tokens live in
        # localStorage. Socket.io connects to the same origin (`io('/')`), which `'self'`
        # already covers for ws/wss (CSP level 3).
        # ⚠ Set in `location /` on purpose, not at `server` level: when two CSP headers
        # coexist the browser enforces their INTERSECTION — at server level it would override
        # /api/docs's own policy (which allows the Scalar CDN) and leave that page without
        # script.
        # ⚠ If S3_PUBLIC_ENDPOINT points to a DIFFERENT domain than this one, add its origin
        # to `connect-src`, `img-src` and `media-src`.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' blob:; connect-src 'self' blob: data:" always;

        # ⚠ Any `add_header` here cancels inheritance from `server`: needed headers are
        # repeated explicitly.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
