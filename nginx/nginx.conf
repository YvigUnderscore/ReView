# ReView — configuration nginx reverse-proxy (prod)
# Remplacer YOUR_DOMAIN par le vrai nom de domaine.
# Les certificats TLS (Let's Encrypt ou autre) sont montés dans le conteneur.

upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:80;
}

upstream minio {
    server minio:9000;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Protocoles et ciphers modernes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 0;  # pas de limite ici — MinIO via URL présignée

    # API backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.io (websocket)
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO derrière le proxy (durcissement 8.7) : URLs présignées path-style
    # https://<domaine>/<bucket>/… — poser S3_PUBLIC_ENDPOINT=https://<domaine>
    # pour que la signature du Host soit préservée. ⚠ Adapter si S3_BUCKET ≠ « review ».
    #
    # ⚠ Ces objets sont des fichiers déposés par les utilisateurs, servis sur LA MÊME
    # ORIGINE que l'application. Sans garde-fou, un fichier rendu en HTML ou en SVG y
    # exécuterait du script avec accès au jeton de session. Le backend neutralise déjà le
    # Content-Type à la signature (lib/uploadContentType) ; `sandbox` est la seconde
    # barrière : origine opaque, pas de script, pas de navigation — quel que soit le type.
    location /review/ {
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # streaming vidéo
        proxy_request_buffering off;  # uploads présignés (PUT) sans tampon disque

        # ⚠ nginx : dès qu'un `add_header` est posé ici, ceux du bloc `server` ne sont
        # plus hérités — les en-têtes utiles sont donc redonnés explicitement.
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Frontend (SPA React)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Content-Security-Policy de l'application. La SPA est servie par le conteneur
        # frontend, hors de portée de helmet côté backend : la politique se pose donc ici.
        # Elle borne l'impact d'une éventuelle injection : pas de script tiers, pas d'inline,
        # pas d'exfiltration vers un domaine externe.
        #   - 'wasm-unsafe-eval' : hash-wasm (empreintes d'upload) et les décodeurs three.js ;
        #   - blob: en script/worker/media : workers de transcodage et lecture HLS ;
        #   - 'unsafe-inline' en style seulement : Tailwind et les styles posés au runtime.
        # ⚠ Volontairement dans `location /` et pas au niveau `server` : quand deux en-têtes
        # CSP coexistent, le navigateur applique leur INTERSECTION — au niveau server, celle-ci
        # écraserait la politique propre de /api/docs (qui autorise le CDN de Scalar) et
        # laisserait la page de documentation sans script.
        # ⚠ Si S3_PUBLIC_ENDPOINT pointe vers un AUTRE domaine que celui-ci, ajouter son
        # origine à `connect-src`, `img-src` et `media-src`.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' blob:; connect-src 'self' blob: data: ws: wss:" always;

        # ⚠ nginx : poser un `add_header` ici masque ceux du bloc `server` — ils sont donc
        # redonnés explicitement.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
