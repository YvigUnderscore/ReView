# docker-compose.prod.yml — surcharge de production (durcissement 8.7 : TLS + secrets)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prérequis :
#   - Certificats TLS dans ./nginx/certs/ (fullchain.pem + privkey.pem)
#   - .env renseigné avec des secrets forts (voir .env.example)
#
# Ce fichier ajoute nginx en reverse-proxy HTTPS devant frontend + backend + MinIO, et
# retire TOUS les ports hôte de frontend/backend/minio (`!reset` — compose ≥ 2.24).
services:
  # ── Nginx reverse-proxy TLS (seul service exposé) ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  # ── Secrets requis (pas de défaut faible en production) ─────────────────────
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fort requis en production (openssl rand -hex 32)}

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis en production (pas de minioadmin)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD fort requis en production}

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production (≥ 32 caractères aléatoires)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis en production (URL exacte du frontend, pas *)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT requis en production (https://<domaine>)}

  worker:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT requis en production}
      # Exigée comme pour le backend : le worker partage le même schéma d'environnement,
      # qui rejette '*' en production (il refuserait de démarrer).
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis en production (URL exacte du frontend, pas *)}

  frontend:
    ports: !reset []
