# docker-compose.prod.yml — surcharge de production (durcissement 8.7 : TLS + secrets)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prérequis :
#   - Certificats TLS dans ./nginx/certs/ (fullchain.pem + privkey.pem)
#     (ex. Certbot : /etc/letsencrypt/live/<domaine>/ ; auto-signés possibles pour un essai)
#   - .env renseigné avec des secrets forts (voir .env.example) — les variables critiques
#     sont REQUISES ici (${VAR:?…} : compose refuse de démarrer sans) et re-vérifiées par
#     backend/config/env.ts qui refuse les valeurs faibles/défaut en production (10.D5).
#
# Ce fichier :
#   - Ajoute nginx en reverse-proxy HTTPS devant frontend + backend + MinIO
#   - Retire TOUS les ports hôte de frontend/backend/minio (`!reset` — compose ≥ 2.24) :
#     seul nginx est exposé ; MinIO est servi via https://<domaine>/<bucket>/…
#     (poser S3_PUBLIC_ENDPOINT=https://<domaine>) ; console MinIO accessible
#     uniquement par tunnel ssh/VPN.
services:
  # ── Nginx reverse-proxy TLS (seul service exposé) ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_healthy
    restart: always

  # ── Secrets requis (pas de défaut faible en production) ─────────────────────
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fort requis en production (openssl rand -hex 32)}

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis en production (pas de minioadmin)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD fort requis en production}

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production (≥ 32 caractères aléatoires)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis en production (URL exacte du frontend, pas *)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT requis en production (https://<domaine>)}

  worker:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT requis en production}

  frontend:
    ports: !reset []
