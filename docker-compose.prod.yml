# docker-compose.prod.yml — production overlay (TLS front end + mandatory secrets)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - TLS certificates in ./nginx/certs/ (fullchain.pem + privkey.pem)
#   - .env filled in with strong secrets (see .env.example)
#
# Adds nginx as the HTTPS reverse proxy in front of frontend + backend + MinIO, and removes
# EVERY host port from frontend/backend/minio (`!reset`, compose >= 2.24).
services:
  # ── TLS reverse proxy (the only exposed service) ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # HLS cache (2 GB, declared by `proxy_cache_path`) and request-body temp files. Without
      # this volume both are written to the container's writable layer, i.e. /var/lib/docker
      # (the same filesystem as pgdata and miniodata, which the operator did not choose), and
      # are lost every time the container is recreated: the first dailies session after an
      # update then refetches every segment from MinIO, serialised by `proxy_cache_lock`.
      # A named volume rather than tmpfs: 2 GB of permanent RAM for a disk cache would be taken
      # from transcoding, and a tmpfs is emptied on recreation too.
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      # busybox wget (nginx:alpine image) on the proxy's own probe (`location = /healthz` in
      # nginx/nginx.conf): it reaches no upstream, so a failing backend does not make the proxy
      # look dead. Without a probe, an nginx with stuck workers stays "running", and this is
      # the ONLY exposed service.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  # ── Mandatory secrets (no weak default in production) ───────────────────────
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a strong POSTGRES_PASSWORD is required in production (openssl rand -hex 32)}

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in production (not minioadmin)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?a strong MINIO_ROOT_PASSWORD is required in production}

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production (at least 32 random characters)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production (exact frontend URL, not *)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required in production (https://<domain>)}

  worker:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required in production}
      # Required here as for the backend: the worker shares the same environment schema, which
      # rejects '*' in production (the worker would refuse to start).
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production (exact frontend URL, not *)}

  frontend:
    ports: !reset []

# Compose merges the `volumes:` sections of every file in the stack, so this volume only exists
# when the production overlay is loaded, like the service that uses it.
volumes:
  nginx_cache:
