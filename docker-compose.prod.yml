# docker-compose.prod.yml — surcharge de production (durcissement 8.7 : TLS + secrets)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prérequis :
#   - Certificats TLS dans ./nginx/certs/ (fullchain.pem + privkey.pem)
#   - .env renseigné avec des secrets forts (voir .env.example)
#
# Ce fichier ajoute nginx en reverse-proxy HTTPS devant frontend + backend + MinIO, et
# retire TOUS les ports hôte de frontend/backend/minio (`!reset` — compose ≥ 2.24).
services:
  # ── Nginx reverse-proxy TLS (seul service exposé) ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Cache HLS (2 Go déclarés par `proxy_cache_path`) et fichiers temporaires de corps de
      # requête. Sans ce volume, les deux s'écrivent dans la couche inscriptible du conteneur
      # — /var/lib/docker, soit le système de fichiers de pgdata et miniodata, que l'exploitant
      # n'a pas choisi — et disparaissent à chaque recréation du conteneur : la première salle
      # de dailies qui suit une mise à jour retire chaque segment depuis MinIO, sérialisée par
      # `proxy_cache_lock`, c'est-à-dire exactement la latence que le cache existe pour éviter.
      # Volume nommé plutôt que tmpfs : 2 Go de RAM permanents pour un cache disque seraient
      # pris au transcodage, et un tmpfs se viderait lui aussi à chaque recréation.
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      # busybox wget (image nginx:alpine), sur la sonde locale du frontal (`location =
      # /healthz`, nginx/nginx.conf) : elle ne traverse aucun amont, donc un backend en
      # panne ne fait pas passer le frontal pour mort. Sans sonde, un nginx dont les
      # workers sont bloqués restait « running » — et c'est le SEUL service exposé.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  # ── Secrets requis (pas de défaut faible en production) ─────────────────────
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fort requis en production (openssl rand -hex 32)}

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis en production (pas de minioadmin)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD fort requis en production}

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production (≥ 32 caractères aléatoires)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis en production (URL exacte du frontend, pas *)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT requis en production (https://<domaine>)}

  worker:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT requis en production}
      # Exigée comme pour le backend : le worker partage le même schéma d'environnement,
      # qui rejette '*' en production (il refuserait de démarrer).
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis en production (URL exacte du frontend, pas *)}

  frontend:
    ports: !reset []

# Compose fusionne les sections `volumes:` de tous les fichiers de la pile : celui-ci
# n'existe donc que quand l'overlay de production est chargé, comme le service qui l'utilise.
volumes:
  nginx_cache:
